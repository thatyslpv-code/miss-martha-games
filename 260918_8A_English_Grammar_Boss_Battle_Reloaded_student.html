<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Boss Battle Reloaded | 8A</title><style>:root{--ink:#203047;--blue:#36c5ff;--pink:#ff5bbd;--orange:#ff9b3d;--yellow:#ffe04e;--green:#72e58c;--purple:#7d69ff}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ccfbff,#fff2a8 40%,#ffd8f0 70%,#e0d7ff);font-size:18px}header{padding:15px 5%;background:#fff;display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);position:sticky;top:0}.brand{font-weight:950}.brand b{color:var(--pink)}main{max-width:980px;margin:28px auto;padding:0 18px 42px}.card{background:#fff;border:2px solid var(--ink);border-radius:26px;padding:28px;box-shadow:8px 8px 0 #bdd7ff}.hero{text-align:center}.hero h1{font-size:clamp(48px,9vw,92px);line-height:.9;margin:10px 0}.hero h1 span{color:var(--purple)}.sub{font-size:24px;font-weight:900}.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}.pill{padding:7px 12px;border-radius:99px;font-weight:900;background:#fff0a8}.pill:nth-child(2){background:#c7f6ff}.pill:nth-child(3){background:#ffd0ea}.pill:nth-child(4){background:#d4ffd0}label{display:block;font-weight:900;margin:14px 0 7px}input{width:100%;font:inherit;padding:13px;border:2px solid #a9bacb;border-radius:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;font-weight:950;border:2px solid var(--ink);border-radius:14px;padding:13px 18px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer}.primary{background:var(--purple);color:white;border-color:#5a45d4}.lime{background:var(--green)}.badge{display:inline-block;background:var(--orange);color:white;padding:6px 10px;border-radius:9px;font-weight:950;font-size:13px}.progress{height:14px;background:#e7edf5;border-radius:99px;overflow:hidden;margin:18px 0 26px}.progress div{height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--green),var(--blue),var(--purple))}.question h2{font-size:clamp(30px,5vw,46px)}.options{display:grid;gap:12px}.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;box-shadow:none;border-color:#b5c1d0}.opt b{min-width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#edf2ff}.opt.selected{background:#f4edff;border-color:var(--purple)}.feedback{margin-top:22px;padding:20px;border-radius:16px;background:#eaffea;border:2px solid #5cad68}.feedback.wrong{background:#fff0f6;border-color:#cb4b84}.pct{font-size:clamp(92px,18vw,170px);font-weight:950;line-height:.9;color:var(--purple)}.score{font-size:36px;font-weight:950}.evidence{background:#d7ff98;padding:14px;border-radius:12px;font-weight:900;margin:18px 0}.error{color:#b43f72;min-height:22px}@media(max-width:650px){.grid2{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><header><div class="brand">🎉 GRAMMAR <b>BOSS BATTLE: RELOADED</b><div style="font-size:11px;letter-spacing:2px">8A ENGLISH · FRIDAY MODE</div></div><div id="timer"></div></header><main id="app"></main><script>"use strict";const Q=[['Which sentence uses a gerund as the subject?',['To win requires practice.','Running every morning builds stamina.','The running water is cold.','Run every morning.'],1,'Running acts as the subject noun, so it is a gerund.'],['Which sentence contains a participle?',['The glowing sign was easy to see.','To glow brightly is useful.','Glowing helps visibility.','Glow brightly.'],0,'Glowing describes sign, so it is a participle.'],['Which sentence uses an infinitive correctly?',['She plans studying tonight.','She plans to study tonight.','She plans studied tonight.','She plans study tonight.'],1,'Plan is followed by an infinitive: to study.'],['Which sentence is subjunctive?',['I insist that he arrive on time.','He arrives on time.','Arrive on time!','Does he arrive on time?'],0,'Insist that he arrive uses the subjunctive.'],['Which sentence is interrogative AND contains an infinitive?',['Do you want to join us?','Join us now.','I want to join you.','If I were to join, I would call.'],0,'It asks a question and includes to join.'],['Which sentence is imperative AND contains a gerund?',['Stop talking now.','Talking is distracting.','Are you talking?','I wish you would stop talking.'],0,'Stop is a command, and talking is a gerund after stop.'],['Spot the error: “She avoids to drive at night.”',['No error','to drive should be driving','avoids should be avoid','night should be nights'],1,'Avoid is followed by a gerund: avoids driving.'],['Spot the error: “The bored movie made us leave.”',['No error','bored should be boring','made should be makes','leave should be left'],1,'The movie causes boredom, so boring is correct.'],['Which sentence uses a participle to describe a person?',['The laughing child ran outside.','Laughing is healthy.','The child likes to laugh.','Laugh loudly.'],0,'Laughing describes child.'],['Which sentence uses indicative mood?',['The team practices every Friday.','Practice every Friday.','Does the team practice every Friday?','I suggest that the team practice every Friday.'],0,'It states a fact, so it is indicative.'],['Best rewrite: “The students were excited because the game was challenging.”',['The challenged game excited the students.','The challenging game excited the students.','The game challenge excited students.','To challenge game excited them.'],1,'Challenging correctly describes the game.'],['Identify BOTH: “Please remember to submit your work.”',['Imperative + infinitive','Indicative + gerund','Interrogative + participle','Subjunctive + gerund'],0,'It is a command and includes to submit.'],['Identify BOTH: “The broken window needs to be replaced.”',['Gerund + imperative','Participle + indicative','Infinitive + interrogative','Participle + subjunctive'],1,'Broken modifies window, and the sentence states a fact.'],['Which analysis is fully correct? “Dancing after school helps me relax.”',['Dancing = participle; mood = imperative','Dancing = gerund; mood = indicative','Dancing = infinitive; mood = interrogative','Dancing = gerund; mood = subjunctive'],1,'Dancing is a noun/subject and the sentence states a fact.'],['Which sentence contains TWO verbals?',['The smiling student hopes to win.','The student smiles.','Smile and win.','Did the student win?'],0,'Smiling is a participle; to win is an infinitive.'],['Which sentence is subjunctive and contains a gerund?',['I recommend that she stop texting during class.','Stop texting during class.','She stopped texting during class.','Is she texting during class?'],0,'Recommend that she stop is subjunctive, and texting is a gerund after stop.'],['Which sentence has a dangling participle problem?',['Walking to school, the rain soaked my backpack.','Walking to school, I got soaked by the rain.','The student walking to school got wet.','After walking to school, I changed clothes.'],0,'The opening phrase incorrectly seems to modify the rain.'],['Best correction: “Walking into class, the bell rang.”',['Walking into class, I heard the bell ring.','Walking into class, the bell was loud.','The bell walking into class rang.','To walk into class, the bell rang.'],0,'The introductory phrase must modify the subject that follows.'],['Which sentence uses a gerund after a preposition?',['She is good at solving puzzles.','She is good to solve puzzles.','She is good solve puzzles.','She is solving good puzzles.'],0,'After a preposition like at, use a gerund.'],['FINAL BOSS: Which analysis is completely correct? “If I were you, I would avoid making that mistake again.”',['Indicative + participle','Subjunctive + gerund','Imperative + infinitive','Interrogative + gerund'],1,'If I were you is subjunctive; making is a gerund after avoid.']];const EDGE='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',GAME='260918_8A_GRAMMAR_BOSS_RELOADED',DOMAIN='@colegiointernacional.edu.mx';let s=null,locked=false;const app=document.getElementById('app');function landing(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY BONUS CLASS · FINAL BOSS MODE</span><h1>GRAMMAR BOSS<br><span>BATTLE: RELOADED</span></h1><div class="sub">20 harder rounds. No repeats. No mercy.</div><div class="pills"><span class="pill">Verbals</span><span class="pill">Moods</span><span class="pill">Error Correction</span><span class="pill">Double Analysis</span></div><form id="start"><div class="grid2"><div><label>Full name</label><input id="name" required></div><div><label>School email</label><input id="email" type="email" required placeholder="name@colegiointernacional.edu.mx"></div></div><label>Group</label><input value="8A" readonly><p class="error" id="err"></p><button class="primary">START THE REMATCH →</button></form></section>`;start.onsubmit=e=>{e.preventDefault();let n=name.value.trim(),m=email.value.trim().toLowerCase();if(n.length<3){err.textContent='Enter your full name.';return}if(!m.endsWith(DOMAIN)){err.textContent='Use your school email.';return}s={name:n,i:0,a:[],started:Date.now()};render()}}function render(){locked=false;let q=Q[s.i],p=Math.round(s.i/Q.length*100);app.innerHTML=`<section class="card question"><span class="badge">${s.i===Q.length-1?'FINAL BOSS':'ROUND '+(s.i+1)}</span><div class="progress"><div style="width:${p}%"></div></div><h2>${q[0]}</h2><div class="options">${q[1].map((x,j)=>`<button class="opt" data-i="${j}"><b>${String.fromCharCode(65+j)}</b><span>${x}</span></button>`).join('')}</div><div id="feed"></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i))}function pick(j){if(locked)return;locked=true;let q=Q[s.i],ok=j===q[2];s.a.push(ok);document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add('selected')});feed.innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'✅ BOSS HIT':'⚠️ BOSS BLOCKED IT'}</strong><p>${q[3]}</p>${!ok?`<p><b>Correct answer:</b> ${q[1][q[2]]}</p>`:''}<button id="next" class="lime">${s.i===Q.length-1?'SEE MY FINAL SCORE →':'NEXT ROUND →'}</button></div>`;next.onclick=()=>{s.i++;s.i>=Q.length?result():render()}}function result(){let sc=s.a.filter(Boolean).length,p=Math.round(sc/Q.length*100);app.innerHTML=`<section class="card hero"><span class="badge">REMATCH COMPLETE</span><h1>FINAL<br><span>SCORE</span></h1><h2>${s.name}</h2><p><b>8A ENGLISH · Sept. 18, 2026</b></p><div class="pct">${p}%</div><div class="score">${sc} / ${Q.length}</div><div class="evidence">Take a screenshot of this screen for your class evidence.</div><div id="save">Saving score…</div></section>`;fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:s.name,student_group:'8A',game_id:GAME,grade:'8A',score:sc,max_score:Q.length,percentage:p,completed:true})}).then(r=>save.textContent=r.ok?'Score saved to Miss Martha\'s dashboard.':'Screenshot still works.').catch(()=>save.textContent='Screenshot still works.')}setInterval(()=>{if(s){let z=Math.floor((Date.now()-s.started)/1000);timer.textContent=String(Math.floor(z/60)).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}},1000);landing();</script></body></html>
