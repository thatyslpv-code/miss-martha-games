<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Switch: Case Files • Miss Martha</title><style>*{box-sizing:border-box}body{margin:0;color:#142e4c;background:#eff6ff;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:20px;background-image:radial-gradient(#1760ff19 1.5px,transparent 1.5px);background-size:22px 22px}button,input,select{font:inherit}button{cursor:pointer;border:2px solid #173655;border-radius:14px;padding:13px 20px;background:white;color:#142e4c;font-weight:800;box-shadow:0 4px 0 #173655}button:hover{transform:translateY(-2px)}button:disabled{cursor:default;opacity:.6;transform:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #ff9f1c;outline-offset:3px}.primary{background:#1858ed;color:white}.lime{background:#c5f64a}.small{font-size:15px;padding:9px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:auto;padding:22px}.brand{font-weight:900;letter-spacing:1px;font-size:18px}.dot{display:inline-block;background:#ff735e;border:2px solid #142e4c;border-radius:50%;width:18px;height:18px;margin-right:8px}.wrap{max-width:1080px;margin:12px auto;padding:0 24px 40px}.card{background:#fff;border:2px solid #173655;border-radius:24px;padding:30px;box-shadow:7px 8px 0 #173655;animation:enter .3s ease}h1{font-size:clamp(38px,6vw,74px);line-height:1.02;letter-spacing:-2px;margin:18px 0}h2{font-size:32px;margin:12px 0}p{line-height:1.5}.eyebrow,.badge{display:inline-block;background:#c5f64a;font-weight:900;font-size:14px;letter-spacing:1px;padding:8px 12px;border:2px solid #173655;border-radius:7px}.badge{background:#c8f9f1}.orange{background:#ffbb63}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}.blue{color:#1858ed}.folder{background:#ffd664;transform:rotate(3deg);padding:30px;border:2px solid;border-radius:12px;box-shadow:8px 8px #ff735e}.evidence{background:white;border:2px solid #173655;padding:16px;margin:12px 0;border-radius:10px}.arrow{text-align:center;font-weight:900;color:#1858ed;animation:pulse 2s infinite}.meta,.actions,.chips{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.meta{justify-content:space-between;margin:18px 0}.muted{color:#506079;font-size:16px}label{display:block;font-weight:800;margin:16px 0 7px}input,select{width:100%;padding:14px;border:2px solid #a3b7cf;border-radius:12px;background:white;color:#142e4c}.formrow{display:grid;grid-template-columns:2fr 1fr;gap:20px}.progress{height:12px;background:#d5e3f4;border-radius:20px;overflow:hidden;margin:14px 0 24px}.progress>div{height:100%;background:#1858ed;transition:width .4s}.prompt{font-size:24px;line-height:1.5;white-space:pre-line;margin:22px 0}.options{display:grid;gap:12px}.option{text-align:left;display:flex;align-items:center;gap:14px;width:100%;font-size:20px;font-weight:600;box-shadow:0 3px #173655}.letter{padding:4px 10px;background:#edf3ff;border-radius:7px;color:#142e4c}.selected{background:#d8e6ff;border-color:#1858ed}.tray{min-height:90px;padding:18px;border:2px dashed #1858ed;background:#f0f5ff;border-radius:14px;margin-bottom:16px}.chip{font-size:20px;padding:10px 14px;margin:5px;box-shadow:0 3px #173655}.feedback{padding:20px;border-radius:14px;background:#dcf8ed;border:2px solid #128065;margin:22px 0}.feedback.bad{background:#fff0d7;border-color:#cb7800}.actions{margin-top:24px}.boss{border:4px solid #ff735e;background:#fffaf0}.boss .eyebrow{background:#ff735e}.result{text-align:center;padding:24px}.percent{font-size:clamp(96px,16vw,160px);line-height:1;font-weight:900;color:#1858ed;letter-spacing:-8px}.student{font-size:32px;font-weight:900;overflow-wrap:anywhere}.score{font-size:30px;font-weight:900}.result h1{font-size:30px;letter-spacing:-1px}.result p{margin:10px 0}.note{background:#fff1b9;padding:12px;border-radius:10px;font-size:18px}.rounds{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.rounds span{height:9px;flex:1;border-radius:7px;background:#c8d8ed}.rounds span.done{background:#12bfa7}.rounds span.current{background:#ff735e}details{margin-top:20px}summary{cursor:pointer;font-weight:800}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{padding:22px 12px;text-align:left;border-bottom:2px solid #e4ecf6}th{font-size:16px;background:#eaf1ff}td{font-size:22px}td.percentcell{font-weight:900;font-size:38px;color:#1858ed}td:first-child{font-weight:800;overflow-wrap:anywhere}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:16px}.controls>div{flex:1;min-width:150px}.controls input,.controls select{font-size:18px}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:translateX(7px)}}@media(max-width:700px){.hero,.formrow{grid-template-columns:1fr}.folder{display:none}.wrap{padding:0 12px 24px}.card{padding:20px;box-shadow:4px 5px #173655}.prompt{font-size:21px}.option{font-size:18px}header{padding:15px}.student{font-size:26px}td,th{padding:16px 5px;font-size:16px}td.percentcell{font-size:27px}.time{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header><div class="brand"><span class="dot"></span>VOICE SWITCH / INVESTIGATION LAB</div><button id="sound" class="small" aria-pressed="false">SOUND OFF</button></header><main id="app" class="wrap"></main><script>

const questions=[{"r": 0, "type": "choice", "prompt": "The studio releases a new episode every Friday. Switch to passive.", "options": ["A new episode was released by the studio every Friday.", "A new episode is released by the studio every Friday.", "A new episode has been released by the studio every Friday."], "answer": 1, "explain": "Present simple stays present simple: is/are + past participle."}, {"r": 0, "type": "choice", "prompt": "The moderators removed the fake account yesterday. Preserve tense and meaning.", "options": ["The fake account has been removed by the moderators yesterday.", "The moderators were removed by the fake account yesterday.", "The fake account was removed by the moderators yesterday."], "answer": 2, "explain": "Yesterday signals past simple. The account receives the action: was removed."}, {"r": 0, "type": "choice", "prompt": "The designers have already updated the avatars. Switch to passive.", "options": ["The avatars have already been updated by the designers.", "The avatars were already updated by the designers.", "The avatars have already updated the designers."], "answer": 0, "explain": "Present perfect passive = has/have + been + past participle."}, {"r": 0, "type": "choice", "prompt": "The team will reveal the map tomorrow. Switch to passive.", "options": ["The map will reveal the team tomorrow.", "The map will be revealed by the team tomorrow.", "The map is revealed by the team tomorrow."], "answer": 1, "explain": "Future passive needs will be + past participle; keep the same receiver."}, {"r": 0, "type": "choice", "prompt": "The tickets were checked by the volunteers last week. Switch to active.", "options": ["The volunteers have checked the tickets last week.", "The tickets checked the volunteers last week.", "The volunteers checked the tickets last week."], "answer": 2, "explain": "The volunteers become the subject. Past simple remains checked."}, {"r": 1, "type": "build", "prompt": "The students have completed the project. Build the passive version.", "answer": ["The project", "has", "been", "completed", "by the students."], "explain": "The singular project takes has; present perfect passive needs been."}, {"r": 1, "type": "multi", "prompt": "The cameras are tested by the crew every morning. Unlock both fields.", "parts": [{"label": "Original voice", "options": ["Active", "Passive"], "answer": 1}, {"label": "Tense", "options": ["Past simple", "Present simple", "Present perfect"], "answer": 1}, {"label": "Active version", "options": ["The crew tests the cameras every morning.", "The crew tested the cameras every morning.", "The crew has tested the cameras every morning."], "answer": 0}], "explain": "Are tested is present simple passive; the crew tests is present simple active."}, {"r": 1, "type": "build", "prompt": "The curator displayed the sketches last week. Keep every detail; build the passive.", "answer": ["The sketches", "were", "displayed", "by the curator", "last week."], "explain": "Plural sketches require were. Displayed keeps the past-simple tense."}, {"r": 1, "type": "build", "prompt": "The winners will be announced by the host tomorrow. Build the active version.", "answer": ["The host", "will", "announce", "the winners", "tomorrow."], "explain": "Future active uses will + base verb; the host becomes the subject."}, {"r": 1, "type": "multi", "prompt": "The editors have recently corrected the headline. Open the tense lock.", "parts": [{"label": "Tense", "options": ["Past simple", "Present perfect", "Future"], "answer": 1}, {"label": "Passive version", "options": ["The headline was recently corrected by the editors.", "The headline has recently corrected the editors.", "The headline has recently been corrected by the editors."], "answer": 2}], "explain": "Have corrected becomes has been corrected because headline is singular."}, {"r": 2, "type": "build", "prompt": "Someone stole the prototype last night. Build the passive; omit the unknown agent.", "answer": ["The prototype", "was", "stolen", "last night."], "explain": "Steal \u2192 stole \u2192 stolen. An unknown agent can be omitted."}, {"r": 2, "type": "multi", "prompt": "The photographer has taken the portraits. Complete: The portraits ___ ___ ___.", "parts": [{"label": "Auxiliary", "options": ["has", "have", "were"], "answer": 1}, {"label": "Middle word", "options": ["be", "being", "been"], "answer": 2}, {"label": "Participle", "options": ["taken", "took", "taking"], "answer": 0}], "explain": "Plural portraits: have been taken. Take \u2192 took \u2192 taken."}, {"r": 2, "type": "build", "prompt": "The panel chose two finalists. Build the passive.", "answer": ["Two finalists", "were", "chosen", "by the panel."], "explain": "Choose \u2192 chose \u2192 chosen; two finalists require were."}, {"r": 2, "type": "choice", "prompt": "A cracked display case is evidence. Which report keeps the original tense? Original: Someone has broken the glass.", "options": ["The glass has been broken.", "The glass has been broke.", "The glass was broken."], "answer": 0, "explain": "Break \u2192 broke \u2192 broken. Present perfect must stay present perfect."}, {"r": 2, "type": "build", "prompt": "The developer wrote the instructions. Build the passive.", "answer": ["The instructions", "were", "written", "by the developer."], "explain": "Write \u2192 wrote \u2192 written. Plural instructions require were."}, {"r": 3, "type": "multi", "prompt": "ERROR FOUND: The invitations were send yesterday. Locate and repair the error.", "parts": [{"label": "Faulty word", "options": ["invitations", "were", "send"], "answer": 2}, {"label": "Replacement", "options": ["sent", "sending", "sends"], "answer": 0}], "explain": "Were is correct for plural invitations. Send must become the past participle sent."}, {"r": 3, "type": "multi", "prompt": "ERROR FOUND: The results was announced this morning. Locate and repair the error.", "parts": [{"label": "Faulty word", "options": ["results", "was", "announced"], "answer": 1}, {"label": "Replacement", "options": ["is", "has", "were"], "answer": 2}], "explain": "Results is plural, so past simple passive requires were announced."}, {"r": 3, "type": "build", "prompt": "ERROR FOUND: The new level has released been. Rebuild the sentence correctly.", "answer": ["The new level", "has", "been", "released."], "explain": "Correct auxiliary order: has + been + past participle."}, {"r": 3, "type": "multi", "prompt": "ERROR FOUND: The server will restored tomorrow. Find what is missing and repair the verb phrase.", "parts": [{"label": "Missing element", "options": ["Past participle", "Subject", "Auxiliary be"], "answer": 2}, {"label": "Correct phrase", "options": ["will be restored", "will been restored", "will be restore"], "answer": 0}], "explain": "Future passive = will be + past participle. Restored already is the participle."}, {"r": 4, "type": "choice", "prompt": "A report says: \u201cThe stolen laptop was recovered by the police.\u201d The audience only needs to know that the laptop is back. Best edit?", "options": ["Keep the agent because passive always needs by.", "Omit by the police; the agent is not important to this update.", "Change it to The police was recovered."], "answer": 1, "explain": "The agent can be omitted when it is unknown, obvious, or unimportant to the message."}, {"r": 4, "type": "choice", "prompt": "An exhibition label explains WHO created the winning mural: \u201cThe mural was painted by student artist Maya Chen.\u201d Best decision?", "options": ["Omit Maya Chen because names never belong in passive voice.", "Change painted to paint to highlight the artist.", "Keep Maya Chen because identifying the artist is the purpose."], "answer": 2, "explain": "Keep the agent when the identity of the person doing the action matters."}, {"r": 4, "type": "choice", "prompt": "\u201cSomeone has leaked the release date.\u201d The source is unknown. Choose the best passive report.", "options": ["The release date has been leaked.", "The release date was leaked by someone.", "Someone has been leaked by the release date."], "answer": 0, "explain": "Has been leaked preserves present perfect. The unknown someone can be omitted."}, {"r": 5, "type": "multi", "prompt": "The judging panel has given the prize to Nia. The report must credit the judging panel. Solve all three locks.", "parts": [{"label": "Tense", "options": ["Present perfect", "Past simple", "Present simple"], "answer": 0}, {"label": "Passive version", "options": ["The prize was given to Nia by the judging panel.", "The prize has been given to Nia by the judging panel.", "The prize has been gave to Nia by the judging panel."], "answer": 1}, {"label": "Agent decision", "options": ["Omit: the report must never name judges.", "Keep: the report must credit the panel.", "Replace the panel with Nia."], "answer": 1}], "explain": "Has given \u2192 has been given. Keep the panel because this report explicitly credits it."}, {"r": 5, "type": "multi", "prompt": "The backup files have been sent by someone. The sender is unknown; the update is about the files. Solve all three locks.", "parts": [{"label": "Original voice", "options": ["Active", "Passive"], "answer": 1}, {"label": "Tense", "options": ["Future", "Past simple", "Present perfect"], "answer": 2}, {"label": "Best edited report", "options": ["The backup files were sent.", "The backup files have sent.", "The backup files have been sent."], "answer": 2}], "explain": "Present perfect passive: have been sent. Omit the unknown agent without changing tense."}, {"r": 6, "type": "multi", "prompt": "Yesterday, the media club launched a digital exhibition. Students built a virtual gallery. Rare sketches were displayed in it. The headteacher gave a short speech. Someone has already shared the exhibition link.\n\nClose the case: preserve the evidence across all four locks.", "parts": [{"label": "Which original sentence is already passive?", "options": ["Students built a virtual gallery.", "Rare sketches were displayed in it.", "The headteacher gave a short speech."], "answer": 1}, {"label": "Best passive version of sentence 2", "options": ["A virtual gallery has been built by students.", "A virtual gallery was built by students.", "Students were built by a virtual gallery."], "answer": 1}, {"label": "Best passive version of the last sentence", "options": ["The exhibition link has already been shared.", "The exhibition link was already shared.", "The exhibition link has already shared."], "answer": 0}, {"label": "Why omit by someone in the last sentence?", "options": ["It changes the tense to past simple.", "Passive never allows agents.", "The unknown sender is unimportant; the link is the focus."], "answer": 2}], "explain": "Were displayed is passive. Built stays past simple: was built. Has shared becomes has been shared; someone can be omitted."}], bonus=[{"r": 7, "type": "build", "prompt": "Bonus 1: They will have restored the archive by Friday. Build the FUTURE PERFECT passive.", "answer": ["The archive", "will", "have", "been", "restored", "by Friday."], "explain": "Future perfect passive adds been: will have been restored."}, {"r": 7, "type": "choice", "prompt": "Bonus 2: Which sentence CANNOT normally become passive because its verb has no direct object?", "options": ["The courier delivered the parcel.", "The parcel arrived yesterday.", "Someone opened the parcel."], "answer": 1, "explain": "Arrive is intransitive: there is no direct object to become a passive subject."}, {"r": 7, "type": "multi", "prompt": "Bonus 3: The curator is being interviewed by a reporter. Decode this new tense.", "parts": [{"label": "Tense", "options": ["Present perfect", "Present continuous", "Past continuous"], "answer": 1}, {"label": "Active version", "options": ["A reporter interviews the curator.", "A reporter has interviewed the curator.", "A reporter is interviewing the curator."], "answer": 2}], "explain": "Is being interviewed is present continuous passive; active is is interviewing."}];
const rounds=['SPOT THE TRAP','TENSE LOCK','IRREGULAR VERB VAULT','SENTENCE SURGERY','MISSING AGENT','MIXED VOICE CHALLENGE','FINAL CASE','BONUS CASE'];
const $=id=>document.getElementById(id), app=$('app');
const EDGE='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results', GAME='260917_9A_ACTIVE_PASSIVE_CASE_FILES';
let index=0,score=0,student='',group='',choice=null,parts=[],order=[],bank=[],locked=false,isBonus=false,bonusIndex=0,sound=false,audio,started=0,history=[],saveState='Saving score…',submitted=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function beep(kind){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=kind==='bad'?[180,130]:kind==='boss'?[330,440,660]:[520,780];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+i*.12+.15);o.start(audio.currentTime+i*.12);o.stop(audio.currentTime+i*.12+.17);});}catch{}}
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',String(sound));if(sound)beep('ok');};
function home(){app.innerHTML=`<section class="card"><div class="hero"><div><span class="eyebrow">MISS MARTHA • 9TH ENGLISH</span><h1>VOICE SWITCH<span class="blue">:<br>CASE FILES</span></h1><p><b>Keep the tense. Switch the voice.</b><br>A grammar investigation. Every detail is evidence.</p></div><div class="folder"><span class="badge orange">CLASSIFIED / CASE 017</span><div class="evidence"><b>ACTIVE</b><p>The students decorated the room.</p></div><div class="arrow">↓ SWITCH ↓</div><div class="evidence"><b>PASSIVE</b><p>The room was decorated by the students.</p></div></div></div><div class="meta"><span class="badge">25 CASES • 25 POINTS</span><span class="badge orange">35–40 MIN MISSION</span><span class="badge">NO LIVES LIMIT</span></div><p class="muted">Work individually. Read every clue. Some cases have several locks: all must be correct to earn the one point. Your first checked answer counts. No countdown — finish every case.</p><form id="login"><div class="formrow"><div><label for="student">First and Last Name</label><input id="student" maxlength="90" autocomplete="name" required placeholder="Your full name"></div><div><label for="group">Group</label><select id="group" required><option value="">Choose group</option><option>9A</option></select></div></div><p id="loginError" role="alert"></p><button class="primary" type="submit">START INVESTIGATION →</button></form></section>`;$('login').onsubmit=e=>{e.preventDefault();student=$('student').value.trim().replace(/\s+/g,' ');group=$('group').value;if(student.split(' ').length<2){$('loginError').textContent='Enter your first and last name.';return;}if(!group)return;index=0;score=0;history=[];started=Date.now();isBonus=false;submitted=false;saveState='Saving score…';render();};}
function current(){return isBonus?bonus[bonusIndex]:questions[index];}
function render(){const q=current();choice=null;parts=[];order=[];locked=false;bank=q.type==='build'?q.answer.map((text,i)=>({text,i})):[];for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}if(bank.length&&bank.every((x,i)=>x.i===i))bank.reverse();const num=isBonus?bonusIndex+1:index+1;app.innerHTML=`<div class="meta"><span class="badge">${esc(student)} • ${esc(group)}</span><span class="muted">${isBonus?'BONUS • UNGRADED':`CASE ${num} / 25 • ${score} POINTS`}</span></div><div class="rounds">${rounds.slice(0,7).map((_,i)=>`<span class="${i<q.r?'done':i===q.r?'current':''}"></span>`).join('')}</div><section class="card ${q.r===6?'boss':''}"><span class="eyebrow">${q.r===6?'FINAL BOSS / ':isBonus?'UNLOCKED / ':'ROUND '+(q.r+1)+' / '}${rounds[q.r]}</span><div class="progress" aria-label="Completed cases"><div style="width:${isBonus?100:index/25*100}%"></div></div>${q.r===4?'<div class="note">In passive voice, the agent can be omitted when it is unknown, obvious, or unimportant.</div>':''}<div class="prompt">${esc(q.prompt)}</div><div id="interaction"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="check" class="primary">CHECK EVIDENCE</button><button id="reset">RESET CASE</button><button id="next" class="lime hidden">NEXT CASE →</button></div><p class="muted">${q.type==='multi'?'Solve every lock. This entire case is worth ONE point.':q.type==='build'?'Click or drag tiles into the tray in order. Click a placed tile to return it.':'Choose the version supported by the evidence.'}</p></section>`;draw();$('check').onclick=check;$('reset').onclick=()=>{if(!locked){choice=null;parts=[];order=[];draw();}};$('next').onclick=()=>{if(isBonus){bonusIndex++;if(bonusIndex===3){isBonus=false;result();}else render();}else{index++;if(index===25)finish();else{if(questions[index].r!==q.r)beep('boss');render();}}};if(q.r===6)beep('boss');window.scrollTo(0,0);}
function draw(){const q=current(),el=$('interaction');if(q.type==='choice'){el.innerHTML=`<div class="options">${q.options.map((o,i)=>`<button class="option ${choice===i?'selected':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="letter">${'ABC'[i]}</span>${esc(o)}</button>`).join('')}</div>`;el.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(!locked){choice=Number(b.dataset.choice);draw();}});}else if(q.type==='multi'){el.innerHTML=q.parts.map((p,i)=>`<label for="part${i}">LOCK ${i+1} — ${esc(p.label)}</label><select id="part${i}"><option value="">Select evidence…</option>${p.options.map((o,j)=>`<option value="${j}" ${parts[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('');q.parts.forEach((_,i)=>$('part'+i).onchange=e=>{parts[i]=e.target.value===''?undefined:Number(e.target.value);});}else{el.innerHTML=`<div id="tray" class="tray" aria-label="Your sentence">${order.length?order.map(i=>`<button class="chip" data-remove="${i}">${esc(q.answer[i])}</button>`).join(''):'<span class="muted">Drop evidence here — or click tiles below</span>'}</div><div class="chips">${bank.filter(x=>!order.includes(x.i)).map(x=>`<button class="chip" draggable="true" data-add="${x.i}">${esc(x.text)}</button>`).join('')}</div>`;el.querySelectorAll('[data-add]').forEach(b=>{b.onclick=()=>add(Number(b.dataset.add));b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.add);});el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!locked){order=order.filter(x=>x!==Number(b.dataset.remove));draw();}});$('tray').ondragover=e=>e.preventDefault();$('tray').ondrop=e=>{e.preventDefault();add(Number(e.dataTransfer.getData('text/plain')));};}}
function add(i){if(!locked&&Number.isInteger(i)&&i>=0&&i<current().answer.length&&!order.includes(i)){order.push(i);draw();}}
function answerText(q){return q.type==='choice'?q.options[q.answer]:q.type==='build'?q.answer.join(' '):q.parts.map(p=>p.label+': '+p.options[p.answer]).join(' • ');}
function check(){if(locked)return;const q=current();if((q.type==='choice'&&choice===null)||(q.type==='build'&&order.length!==q.answer.length)||(q.type==='multi'&&q.parts.some((_,i)=>parts[i]===undefined))){$('feedback').innerHTML='<p role="alert">Complete all the evidence before checking.</p>';return;}locked=true;const correct=q.type==='choice'?choice===q.answer:q.type==='build'?order.every((v,i)=>v===i):q.parts.every((p,i)=>parts[i]===p.answer);if(!isBonus){if(correct)score++;history.push({case:index+1,correct,answer:answerText(q),explain:q.explain});}beep(correct?'ok':'bad');$('interaction').querySelectorAll('button,select').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'CASE SOLVED • Correct':'ERROR FOUND • Not quite'}</strong><p>${esc(q.explain)}</p>${correct?'':`<p><b>Correct evidence:</b> ${esc(answerText(q))}</p>`}</div>`;$('check').classList.add('hidden');$('reset').disabled=true;$('next').classList.remove('hidden');$('next').textContent=isBonus&&bonusIndex===2?'BACK TO MY SCORE':!isBonus&&index===24?'CASE CLOSED →':'NEXT CASE →';$('next').focus();}
function finish(){beep('boss');result();sendScore();}
function result(){const pct=score*4;const rank=pct>=92?'Case Closed: Grammar Expert':pct>=84?'Excellent Investigation':pct>=76?'Strong Detective Work':pct>=68?'Case Almost Solved':'Keep Investigating';app.innerHTML=`<section class="card result"><span class="eyebrow">CASE CLOSED • MISS MARTHA</span><h1>VOICE SWITCH: CASE FILES</h1><div class="student">${esc(student)}</div><p><b>GROUP: ${esc(group)}</b> • September 17, 2026</p><div class="percent">${pct}%</div><div class="score">SCORE: ${score} / 25</div><p><b>${rank}</b></p><div class="note">Take a screenshot of this screen and upload it to Algebraix as your evidence.</div><p id="saveStatus" class="muted" role="status">${esc(saveState)}</p></section><div class="actions"><button id="bonus" class="lime">BONUS CASE UNLOCKED →</button><button id="again">PLAY AGAIN</button></div><p class="muted">3 optional mini challenges. Your score stays ${score} / 25. Mission time: ${Math.max(1,Math.round((Date.now()-started)/60000))} min.</p><details><summary>Open your evidence review</summary>${history.map(x=>`<div class="evidence"><b>Case ${x.case} • ${x.correct?'Correct':'Review'}</b><p>${esc(x.answer)}</p><p class="muted">${esc(x.explain)}</p></div>`).join('')}</details>`;$('bonus').onclick=()=>{isBonus=true;bonusIndex=0;render();};$('again').onclick=()=>{if(confirm('Start a new investigation? Your current result will remain in the teacher records.'))home();};window.scrollTo(0,0);}
async function sendScore(){if(submitted)return;submitted=true;const payload={student_name:student,student_group:group,game_id:GAME,grade:'9A',score,max_score:25,percentage:score*4,completed:true};try{const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('save');const data=await r.json();if(data.error||data.success===false)throw Error('save');saveState='Score saved.';}catch{saveState='Score could not be saved, but your screenshot still works.';}if($('saveStatus'))$('saveStatus').textContent=saveState;}
home();
</script></body></html>
