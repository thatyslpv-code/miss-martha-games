he action.", "direction": "ACTIVE → PASSIVE"}, {"type": "choice", "title": "Last week’s leak", "source": "The passwords were changed by the administrator last week.", "prompt": "Switch to active without changing the tense.", "options": ["The administrator has changed the passwords last week.", "The passwords changed the administrator last week.", "The administrator changed the passwords last week."], "answer": 2, "feedback": "The administrator becomes the subject. Were changed becomes changed.", "direction": "PASSIVE → ACTIVE"}, {"type": "build", "title": "Lock 01 / routine", "source": "The technicians check the cameras every morning.", "prompt": "Reconstruct the sentence. Tap tiles in order; tap a placed tile to return it. Use every tile.", "tokens": ["The cameras", "are", "checked", "by the technicians", "every morning."], "answer": ["The cameras", "are", "checked", "by the technicians", "every morning."], "feedback": "Plural cameras need are. Present simple passive = are checked.", "direction": "ACTIVE → PASSIVE"}, {"type": "fields", "title": "Lock 02 / completed action", "source": "The drones were repaired by Maya last night.", "prompt": "Resolve every clue. All findings together are worth exactly ONE point.", "parts": [{"label": "Original tense", "options": ["Past simple", "Present perfect", "Present simple"], "answer": 0}, {"label": "Maya ___ the drones last night.", "options": ["has repaired", "repaired", "was repaired"], "answer": 1}], "feedback": "Were repaired is past simple passive. Active: Maya repaired the drones last night.", "boss": false}, {"type": "build", "title": "Lock 03 / future", "source": "The team will send the files tomorrow.", "prompt": "Reconstruct the sentence. Tap tiles in order; tap a placed tile to return it. Use every tile.", "tokens": ["The files", "will", "be", "sent", "by the team", "tomorrow."], "answer": ["The files", "will", "be", "sent", "by the team", "tomorrow."], "feedback": "Future passive = will be sent. Will does not change with a plural subject.", "direction": "ACTIVE → PASSIVE"}, {"type": "build", "title": "Lock 04 / perfect evidence", "source": "The students have completed the project.", "prompt": "Reconstruct the sentence. Tap tiles in order; tap a placed tile to return it. Use every tile.", "tokens": ["The project", "has", "been", "completed", "by the students."], "answer": ["The project", "has", "been", "completed", "by the students."], "feedback": "The singular project needs has been completed.", "direction": "ACTIVE → PASSIVE"}, {"type": "build", "title": "Lock 05 / reverse switch", "source": "The winners have been chosen by the judges.", "prompt": "Reconstruct the sentence. Tap tiles in order; tap a placed tile to return it. Use every tile.", "tokens": ["The judges", "have", "chosen", "the winners."], "answer": ["The judges", "have", "chosen", "the winners."], "feedback": "Remove passive been; keep present perfect have chosen.", "direction": "PASSIVE → ACTIVE"}, {"type": "fields", "title": "Vault 01 / coded report", "source": "A journalist wrote the report yesterday.", "prompt": "Resolve every clue. All findings together are worth exactly ONE point.", "parts": [{"label": "The report ___", "options": ["is", "has been", "was"], "answer": 2}, {"label": "___ by a journalist yesterday.", "options": ["written", "wrote", "writing"], "answer": 0}], "feedback": "Past simple passive: was written. Wrote is past simple; written is the participle.", "boss": false}, {"type": "fill", "title": "Vault 02 / missing frames", "source": "Someone has taken the memory cards.", "prompt": "Type ONLY the missing participle: “The memory cards have been ___.”", "answer": ["taken"], "feedback": "Take → took → taken. Have been taken preserves present perfect. Omit the unknown agent."}, {"type": "fields", "title": "Vault 03 / damaged display", "source": "Someone broke two display screens during the rehearsal.", "prompt": "Resolve every clue. All findings together are worth exactly ONE point.", "parts": [ y, the school organized a digital arts festival.\n[2] Students built a light installation.\n[3] Several devices were stolen during the show.\n[4] The principal has already sent a warning.\n[5] The media club will publish the footage tomorrow.", "prompt": "Resolve every clue. All findings together are worth exactly ONE point.", "parts": [{"label": "Which sentence is already passive?", "options": ["Sentence 3", "Sentence 2", "Sentence 4"], "answer": 0}, {"label": "Best passive version of sentence 2", "options": ["A light installation has been built by students.", "A light installation was built by students.", "A light installation was build by students."], "answer": 1}, {"label": "Preserve the tense of sentence 4", "options": ["A warning was already sent by the principal.", "A warning has already sent by the principal.", "A warning has already been sent by the principal."], "answer": 2}, {"label": "Why is the agent omitted in sentence 3?", "options": ["The thief is unidentified; the focus is on the devices.", "Passive sentences never have agents.", "Stolen is a present-tense verb."], "answer": 0}], "feedback": "Sentence 3 is passive. Built stays past simple; has sent becomes has been sent. Omit the unknown thief.", "boss": true}], "bonus": [{"type": "repair", "title": "Bonus 01 / no invented agent", "source": "Someone has given the finalists a secret code.", "prompt": "Write a present perfect passive sentence starting “The finalists”. Omit the unknown agent.", "answer": ["The finalists have been given a secret code."], "feedback": "The finalists have been given a secret code. Give → gave → given."}, {"type": "build", "title": "Bonus 02 / double auxiliary", "source": "The director will not show the unfinished film.", "prompt": "Build the negative future passive. Use all tiles.", "tokens": ["The unfinished film", "will", "not", "be", "shown", "by the director."], "answer": ["The unfinished film", "will", "not", "be", "shown", "by the director."], "feedback": "Future neg const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function tone(kind){if(!audioOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const freqs=kind==='wrong'?[190,150]:kind==='boss'?[260,390,520]:kind==='final'?[523,659,784,1047]:[520,780];freqs.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.11;o.frequency.value=f;g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.16)})}catch(e){}}
el('sound').onclick=()=>{audioOn=!audioOn;el('sound').textContent='SOUND '+(audioOn?'ON':'OFF');el('sound').setAttribute('aria-pressed',String(audioOn));tone('ok')};
function roundAt(i){return ROUNDS.findIndex(r=>i>=r.start&&i<r.end)}
function score(){return state.answers.reduce((n,a)=>n+(a.correct?1:0),0)}
function landing(){app.innerHTML=`<section class="hero"><div><span class="tag">25 CASES. ONE INVESTIGATION.</span><h1>KEEP THE<br>TENSE.<br><span>SWITCH<br>THE VOICE.</span></h1><p class="subtitle">The evidence is in the grammar.</p><p class="muted">Someone scrambled the digital festival archive. Rebuild the story, expose the traps, and close the case.</p><div class="facts"><span>9A · Individual mission</span><span>35–40 min target*</span><span>No lives. No game over.</span></div><p class="mini muted">*Including notebook evidence and reflection. Your timer counts up; it never stops the game.</p></div><div class="card folder"><div class="visual" aria-hidden="true"><div class="evidencecard"><small>ACTIVE / EVIDENCE 01</small>The students decorated the room.</div><div class="evidencecard"><small>PASSIVE / EVIDENCE 02</small>The room was decorated by the students.</div><span class="magnifier">⌕</span></div><span class="kicker">Detective registration</span><form id="login"><div class="formrow"><div><label for="studentName">First and Last Name</label><input id="studentName" autocomplete="name" maxlength="90" placeholder="Your full name" required></div><div><label for="studentGroup">Group</label><select id="studentGroup" required><option value="">Select</option><option value="9A">9A</option></select></div></div><p class="mini muted">Your name, group and final score are sent to Miss Martha’s results system.</p><p id="loginError" class="error" role="alert"></p><button class="primary wide" type="submit">START INVESTIGATION →</button></form></div></section><section class="rounds">${ROUNDS.map((r,i)=>`<div class="roundtile"><b>${r.icon}</b>0${i+1} / ${r.name}</div>`).join('')}</section>`;
 el('login').onsubmit=e=>{e.preventDefault();const name=el('studentName').value.trim().replace(/\s+/g,' '),group=el('studentGroup').value;if(name.split(' ').length<2||name.length<3||group!=='9A'){el('loginError').textContent='Enter your first and last name, and select your group.';return}state={name,group,answers:[],index:0,started:Date.now(),introSeen:[],finished:false,saved:false,bonusAnswers:[]};persist();intro(0)};
}
function intro(rn){const r=ROUNDS[rn];app.innerHTML=`<section class="card intro"><span class="tag coral">NEW CASE FILE / ${r.pace}</span><div class="number">${r.icon} 0${rn+1}</div><h1>${r.name.toUpperCase()}</h1><p class="subtitle">${r.brief}</p><div class="source">${r.rule}</div><div class="notebook">✎ FIELD NOTES<br>${r.note}<br><small>Notebook work supports your investigation; it does not add graded questions.</small></div><p>Cases ${r.start+1}–${r.end} · ${r.end-r.start} point${r.end-r.start===1?'':'s'}</p><button id="openFile" class="primary">OPEN CASE FILE →</button></section>`;el('openFile').onclick=()=>{if(!state.introSeen.includes(rn))state.introSeen.push(rn);persist();renderCase()};window.scrollTo(0,0)}
function question(){return bonusIndex>=0?DATA.bonus[bonusIndex]:DATA.questions[state.index]}
function shuffledIndexes(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a}
function renderCase(){const q=question(),rn=roundAt(state.index),bonus=bonusIndex>=0;locked=false;draft={choice:null,parts:[],text:'',order:[],pool:q.tokens?shuffledIndexes(q.tokens.length):[]};app.innerHTML=`<div class="workspace"><aside class="side"><span class="kicker">Investigation map</span><ol>${ROUNDS.map((r,i)=>`<li class="${!bonus&&i===rn?'current':i<rn||bonus?'done':''}">${i+1}. ${r.name}</li>`).join('')}</ol><div class="note">${bonus?'BONUS UNLOCKED<br>Your official score is locked.':`<b>${score()} / 25</b> points secured<br>Every case is worth 1 point. Keep going even if you miss one.`}</div></aside><section><div class="topline"><span class="tag ${bonus?'coral':''}">${bonus?'BONUS / UNGRADED':`CASE ${String(state.index+1).padStart(2,'0')} / 25`}</span><span class="mini">${bonus?`${bonusIndex+1} of 3`:ROUNDS[rn].name}</span></div><div class="progress"><div style="width:${bonus?(bonusIndex/3*100):(state.index/25*100)}%"></div></div><article class="card case ${q.boss?'boss':''}">${q.boss?'<div class="bosstape">★ FINAL CASE / CONTEXT BOSS ★</div><div class="bossmeter" id="bossmeter"><span></span><span></span><span></span><span></span></div>':''}<span class="kicker">${q.type==='build'?'RECONSTRUCT THE EVIDENCE':q.type==='repair'?'ERROR FOUND / REPAIR STATION':q.type==='fill'?'UNLOCK THE VAULT':q.type==='fields'?'CROSS-CHECK THE CLUES':'EXAMINE THE EVIDENCE'}</span><h2>${esc(q.title)}</h2><div class="source">${esc(q.source)}</div><p>${esc(q.prompt)}</p><div id="interaction"></div><p id="caseError" class="error" role="alert"></p><div class="actions" id="controls"><button id="check" class="primary">CHECK EVIDENCE</button><button id="reset">RESET CASE</button></div><div id="feedback" aria-live="polite"></div></article></section></div>`;
 renderInteraction(q);el('check').onclick=check;el('reset').onclick=()=>{renderCase()};window.scrollTo(0,0);if(q.boss)tone('boss');
}
function renderInteraction(q){const root=el('interaction');if(q.type==='choice'){root.innerHTML=`<div class="options">${q.options.map((o,i)=>`<button class="option" data-option="${i}" aria-pressed="false"><b>${'ABC'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;root.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(locked)return;draft.choice=Number(b.dataset.option);root.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})})}
 else if(q.type==='fields'){root.innerHTML=`<div class="parts">${q.parts.map((p,i)=>`<div class="part"><label for="part${i}">${i+1}. ${esc(p.label)}</label><select id="part${i}" data-part="${i}"><option value="">Select your finding…</option>${p.options.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select></div>`).join('')}</div><p class="mini muted">All findings must be correct. This case is worth 1 point${bonusIndex>=0?' in bonus practice only':''}.</p>`;root.querySelectorAll('select').forEach(s=>s.onchange=()=>{draft.parts[Number(s.dataset.part)]=s.value===''?null:Number(s.value);if(q.boss)el('bossmeter').querySelectorAll('span').forEach((v,i)=>v.classList.toggle('on',draft.parts[i]!=null))})}
 else if(q.type==='build'){root.innerHTML='<label>Your reconstruction</label><div id="answerzone" class="tiles answerzone" aria-label="Sentence answer"></div><label>Evidence tiles</label><div id="pool" class="tiles"></div><p class="mini muted">Tap or use Tab + Enter. You can also drag tiles into the answer area; placed tiles return to the pool when tapped.</p>';renderTiles(q)}
 else {root.innerHTML=`<label for="written">${q.type==='fill'?'Missing participle':'Your corrected sentence'}</label>${q.type==='fill'?'<input id="written" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">':'<textarea id="written" spellcheck="false" maxlength="280"></textarea>'}<p class="mini muted">Capitalization and final punctuation do not affect your score.</p>`;el('written').oninput=e=>draft.text=e.target.value}
}
function renderTiles(q){const zone=el('answerzone'),pool=el('pool');zone.innerHTML=draft.order.length?draft.order.map(i=>`<button data-id="${i}" ${locked?'disabled':''}>${esc(q.tokens[i])}</button>`).join(''):'<span class="placeholder">Drop or tap evidence tiles here</span>';pool.innerHTML=draft.pool.map(i=>`<button data-id="${i}" draggable="true" ${locked?'disabled':''}>${esc(q.tokens[i])}</button>`).join('');pool.querySelectorAll('button').forEach(b=>{b.onclick=()=>moveTile(Number(b.dataset.id),true);b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.id)});zone.querySelectorAll('button').forEach(b=>b.onclick=()=>moveTile(Number(b.dataset.id),false));zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(/^\d+$/.test(raw))moveTile(Number(raw),true)}}
function moveTile(i,toAnswer){if(locked)return;const from=toAnswer?draft.pool:draft.order,to=toAnswer?draft.order:draft.pool;if(!from.includes(i))return;from.splice(from.indexOf(i),1);to.push(i);renderTiles(question())}
function answerText(q){if(q.type==='choice')return q.options[q.answer];if(q.type==='fields')return q.parts.map(p=>p.label+' '+p.options[p.answer]).join(' • ');if(q.type==='build')return q.answer.join(' ');return q.answer[0]}
function check(){if(locked)return;const q=question();let complete=false,correct=false,user='';if(q.type==='choice'){complete=draft.choice!==null;correct=draft.choice===q.answer;user=q.options[draft.choice]||''}else if(q.type==='fields'){complete=q.parts.every((_,i)=>draft.parts[i]!=null);correct=q.parts.every((p,i)=>draft.parts[i]===p.answer);user=q.parts.map((p,i)=>p.options[draft.parts[i]]||'').join(' • ')}else if(q.type==='build'){complete=draft.order.length===q.tokens.length;user=draft.order.map(i=>q.tokens[i]).join(' ');correct=norm(user)===norm(q.answer.join(' '))}else{complete=!!draft.text.trim();user=draft.text.trim();correct=q.answer.some(a=>norm(a)===norm(user))}if(!complete){el('caseError').textContent='Complete every clue before checking the evidence.';return}locked=true;el('caseError').textContent='';const result={correct,user};if(bonusIndex>=0){state.bonusAnswers[bonusIndex]=result}else{state.answers[state.index]=result}persist();el('interaction').querySelectorAll('button,input,textarea,select').forEach(x=>x.disabled=true);el('controls').innerHTML='';tone(correct?'ok':'wrong');const transform=q.direction?`<div class="switch"><div><small>${q.direction.startsWith('PASSIVE')?'PASSIVE':'ACTIVE'}</small>${esc(q.source)}</div><span>→ SWITCH →</span><div><small>${q.direction.startsWith('PASSIVE')?'ACTIVE':'PASSIVE'}</small>${esc(answerText(q))}</div></div>`:'';el('feedback').innerHTML=`<div class="feedback ${correct?'':'wrong'}"><span class="tag ${correct?'teal':'coral'}">${correct?'CASE SOLVED':'ERROR FOUND'}</span><p><b>${correct?'Correct':'Not quite'} ${bonusIndex>=0?'· Practice only':correct?'· +1 point':'· +0 points'}</b></p><p>${esc(q.feedback)}</p>${!correct?`<p><strong>Verified evidence:</strong> ${esc(answerText(q))}</p>`:''}${transform}<button id="next" class="lime">${bonusIndex>=0?(bonusIndex===2?'BACK TO MY SCORE':'NEXT BONUS CASE'):state.index===24?'CLOSE THE CASE →':'NEXT CASE →'}</button></div>`;el('next').onclick=next;el('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!locked)return;tone('ok');if(bonusIndex>=0){bonusIndex++;if(bonusIndex>=3){bonusIndex=-1;showResult()}else renderCase();return}state.index++;if(state.index===25){state.finished=true;state.finishedAt=Date.now();persist();tone('final');showResult();submitScore();return}persist();const rn=roundAt(state.index);if(!state.introSeen.includes(rn))intro(rn);else renderCase()}
function rank(p){return p>=92?'Case Closed: Grammar Expert':p>=84?'Excellent Investigation':p>=76?'Strong Detective Work':p>=68?'Case Almost Solved':'Keep Investigating'}
function showResult(){bonusIndex=-1;const p=score()*4;app.innerHTML=`<section class="screenresult" id="certificate"><span class="tag">CASE CLOSED / OFFICIAL RESULT</span><h1>VOICE SWITCH: CASE FILES</h1><div class="resultname">${esc(state.name)}</div><div><b>GROUP: ${esc(state.group)}</b> · September 17, 2026</div><div class="percent">${p}%</div><div class="score">SCORE: ${score()} / 25</div><p><b>${rank(p)}</b></p><div class="algebraix">Take a screenshot of this screen and upload it to Algebraix as your evidence.</div><div class="status" id="saveStatus" role="status">${state.saved?'Score saved.':'Saving score…'}</div></section><div class="resultactions"><button class="primary" id="bonus">BONUS CASE UNLOCKED →</button><button id="download">DOWNLOAD RESULT</button><button id="print">PRINT / SAVE PDF</button><button id="retrySave" ${state.saved?'class="hidden"':''}>RETRY SAVING SCORE</button><button id="again">PLAY AGAIN</button></div><div class="review card"><details><summary>Open your investigation review · 25 cases</summary>${DATA.questions.map((q,i)=>`<article><b>${i+1}. ${esc(q.title)} · ${state.answers[i]?.correct?'✓ Correct':'Not quite'}</b><p class="mini">Your answer: ${esc(state.answers[i]?.user)}</p><p class="mini">${esc(q.feedback)}</p><p class="mini"><b>Verified:</b> ${esc(answerText(q))}</p></article>`).join('')}</details><p class="mini muted">The 3 optional bonus challenges never change your official score.</p>${state.bonusAnswers.length?`<p class="mini">Bonus practice: ${state.bonusAnswers.filter(x=>x.correct).length} / ${state.bonusAnswers.length} correct. Official score unchanged.</p>`:''}</div>`;el('bonus').onclick=()=>{bonusIndex=0;renderCase()};el('print').onclick=()=>window.print();el('download').onclick=downloadResult;el('retrySave').onclick=submitScore;el('again').onclick=()=>{if(confirm('Start a new attempt? Your current result will remain in the teacher dashboard if it was saved. Download or screenshot this result first.')){state=null;try{localStorage.removeItem(STORE)}catch(e){}landing()}};window.scrollTo(0,0);if(!state.saved&&!sending)el('saveStatus').textContent='Score could not be saved, but your screenshot still works.'}
async function submitScore(){if(!state||!state.finished||state.saved||sending)return;sending=true;const current=state;if(el('saveStatus'))el('saveStatus').textContent='Saving score…';if(el('retrySave'))el('retrySave').disabled=true;try{const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:current.name,student_group:current.group,game_id:GAME_ID,grade:'9A',score:current.answers.filter(x=>x.correct).length,max_score:25,percentage:current.answers.filter(x=>x.correct).length*4,completed:true}),signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Save failed');const text=await r.text();if(text){const body=JSON.parse(text);if(body.error||body.success===false)throw Error('Save failed')}current.saved=true;if(state===current){persist();if(el('saveStatus'))el('saveStatus').textContent='Score saved.';if(el('retrySave'))el('retrySave').classList.add('hidden')}}catch(e){if(state===current&&el('saveStatus'))el('saveStatus').textContent='Score could not be saved, but your screenshot still works.'}finally{sending=false;if(el('retrySave'))el('retrySave').disabled=false}}
function downloadResult(){const canvas=document.createElement('canvas');canvas.width=1400;canvas.height=1000;const c=canvas.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,1400,1000);c.strokeStyle='#2156ed';c.lineWidth=12;c.strokeRect(20,20,1360,960);c.textAlign='center';c.fillStyle='#172a48';c.font='bold 40px Arial';c.fillText('VOICE SWITCH: CASE FILES',700,100);let fs=60;while(fs>20){c.font=`bold ${fs}px Arial`;if(c.measureText(state.name).width<1260)break;fs-=2}c.fillText(state.name,700,205);c.font='30px Arial';c.fillText('GROUP: '+state.group+'  •  September 17, 2026',700,270);c.font='bold 260px Arial';c.fillStyle='#2156ed';c.fillText(score()*4+'%',700,560);c.fillStyle='#172a48';c.font='bold 55px Arial';c.fillText('SCORE: '+score()+' / 25',700,660);c.font='bold 35px Arial';c.fillText(rank(score()*4),700,740);c.fillStyle='#d6fa64';c.fillRect(60,810,1280,110);c.fillStyle='#172a48';c.font='28px Arial';c.fillText('Take a screenshot of this screen and upload it to Algebraix',700,855);c.fillText('as your evidence.',700,895);canvas.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='260917_9A_Voice_Switch_'+state.name.replace(/[^a-z0-9]/gi,'_')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')}
function boot(){try{const raw=JSON.parse(localStorage.getItem(STORE));if(raw&&typeof raw.name==='string'&&raw.group==='9A'&&Array.isArray(raw.answers)&&raw.index>=0&&raw.index<=25&&Array.isArray(raw.introSeen)&&Array.isArray(raw.bonusAnswers))state=raw}catch(e){}if(!state){landing();return}app.innerHTML=`<section class="card intro"><span class="tag">INVESTIGATION ON FILE</span><h1>Welcome back,<br>${esc(state.name)}.</h1><p>${state.finished?'Your result is ready.':`${state.answers.length} of 25 cases checked. Your progress was saved on this browser.`}</p><div class="actions"><button id="resume" class="primary">${state.finished?'OPEN MY RESULT':'RESUME INVESTIGATION'}</button><button id="newStudent">NEW STUDENT</button></div></section>`;el('resume').onclick=()=>{if(state.finished){showResult();submitScore()}else{if(state.answers[state.index])state.index++;if(state.index===25){state.finished=true;persist();showResult();submitScore()}else{const rn=roundAt(state.index);if(state.introSeen.includes(rn))renderCase();else intro(rn)}}};el('newStudent').onclick=()=>{if(confirm('Clear this browser’s saved session for a new student?')){state=null;try{localStorage.removeItem(STORE)}catch(e){}landing()}}}
setInterval(()=>{if(state&&!state.finished){const s=Math.floor((Date.now()-state.started)/1000);el('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}else el('timer').textContent=''},1000);
window.addEventListener('online',()=>{if(state?.finished&&!state.saved)submitScore()});
boot();
</script></body></html>
