$('#pause').onclick=()=>{modal('<span class="reward-icon">☁️</span><h2>Take a breath.</h2><p>Your timer is paused. Your adventure will be right here.</p><button id="resume" class="primary">Keep exploring →</button>');$('#resume').onclick=closeModal};
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<28;i++){let d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=['#ffc944','#ee8e79','#64b79b','#b197da'][i%4];d.style.animationDelay=Math.random()*.3+'s';document.body.append(d);setTimeout(()=>d.remove(),2200)}}
function home(){view='home';$('#pause').classList.add('hidden');const old=stored();app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="pill">SURVIVAL CHALLENGE · 7A</span><h1 class="title">LOST<br>AT <span>CAMP</span></h1><p class="lead">A little lost.<br>A lot of adventure.</p><p style="max-width:330px">Find your crew, pack your bag and follow the clues back to base camp.</p><form id="start"><label class="vislabel" for="name">Explorer full name</label><div class="startbox"><input id="name" required maxlength="45" placeholder="Your name" autocomplete="off"><button class="primary">LET’S EXPLORE! →</button></div></form>${old?'<button class="small" id="continue" style="margin-top:15px">Continue saved adventure →</button>':''}</div><div class="hero-foot">⭐ You don’t have to know everything.<br>You just have to try the next step.</div></section><div class="introtiles"><div><b>5 places. 5 ways to play.</b>Discover, pack, build, repair and choose.</div><div><b>Your English is your compass.</b>Use <strong>who</strong> for people; <strong>which / that</strong> for things in these missions.</div><div><b>Three hearts. Fresh chances.</b>Hints and repair breaks help you keep going. About 30–35 minutes with writing.</div></div><details class="a1"><summary>How to play / Need a little support?</summary><p>Tap or click your choices. You can use the keyboard too. For the bridge, tap the pieces in order or drag them. Read the hint whenever you need it. After three mistakes, study the repair card and try the same challenge with new hearts.</p><p><b>Words to know:</b> camper = person at camp · torch = flashlight · trail = path · beside = next to · bandages = strips for covering a wound.</p><p>For these identifying clauses, put the description after its noun. Do not add a second he, she or it. Some relative clauses can use other pronouns; follow each task’s instruction.</p></details>`;$('#name').value=pupil.name;$('#name').readOnly=true;$('#start').onsubmit=e=>{e.preventDefault();const name=pupil.name;if(!name)return;const begin=()=>{state={version:2,name,runId:window.schoolRunId(),trace:[],i:0,unlocked:0,hearts:3,seconds:0,scores:Array(15).fill(null),tries:Array(15).fill(0),attempts:0,correct:0,repairs:0,writing:'',journalChecks:[false,false,false]};persist();showMap()};if(old){modal('<h2>Start a fresh adventure?</h2><p>This replaces the saved adventure on this device.</p><button id="newgo" class="primary">Start fresh</button> <button id="cancel">Keep my save</button>');$('#newgo').onclick=()=>{closeModal();begin()};$('#cancel').onclick=closeModal}else begin()};if(old)$('#continue').onclick=()=>{state=old;if(state.finished)showResult();else if(state.i===15)journal();else showMap()}}
function hud(){return `<div class="hud"><span>🧑‍🚀 <strong>${esc(state.name)}</strong></span><span>⭐ <strong id="points">${total()}</strong></span><span class="life" aria-label="${state.hearts} hearts">${'♥'.repeat(state.hearts)}${'♡'.repeat(3-state.hearts)}</span><span class="spacer"></span><span>⏱ <strong id="timer">${clock()}</strong></span><button class="small plain" id="saveexit">Save & exit</button></div>`}
function bindHud(){ $('#pause').classList.remove('hidden');$('#saveexit').onclick=()=>{persist();home()}}
function showMap(){view='map';persist();app.innerHTML=hud()+`<div class="row maphead"><div><div class="eyebrow">Your expedition · ${state.unlocked} of 5 badges</div><h2>Every clue brings you closer.</h2></div><span class="pill">People → who · Things → which / that</span></div><div class="mapgrid"><section class="journeymap" aria-label="Adventure map">${zones.map((z,i)=>`<button class="mapnode ${i<state.unlocked?'done':i===state.unlocked?'active':''}" data-zone="${i}" ${i!==state.unlocked?'disabled':''}><span class="emoji">${i<state.unlocked?'✓':z.icon}</span>${i+1}. ${z.name}<small>${i<state.unlocked?'Badge earned':i===state.unlocked?'Explore this stop →':'Unlock the previous stop'}</small></button>`).join('')}</section><aside class="panel"><span class="mascot">🌟</span><h3>Small steps.<br>Big adventure.</h3><p class="muted">Your next stop: <b>${zones[state.unlocked]?.name||'Explorer journal'}</b>. Finish three challenges to earn its badge.</p><div class="bag">${zones.map((z,i)=>`<div class="bagitem ${i>=state.unlocked?'locked':''}">${i<state.unlocked?z.icon:'○'} ${z.reward}</div>`).join('')}</div><p class="muted">Your progress saves on this browser. Each new stop gives you three fresh hearts.</p></aside></div>`;bindHud();document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{renderTask()});window.scrollTo(0,0)}
function side(){return `<aside class="sidecard"><span class="mascot">🌟</span><h3>You’ve got this.</h3><p class="rule"><b>who</b> → people<br><b>which / that</b> → things</p><ul><li>Read the whole clue.</li><li>Put the clause after its noun.</li><li>Use each subject only once.</li></ul><details class="a1"><summary>Word help</summary><p>torch = flashlight<br>trail = path<br>beside = next to<br>hood = head covering on a jacket</p></details><p class="muted">Hints are free. Every corrected answer still earns points.</p></aside>`}
function renderTask(){view='task';picked=null;selected=[];order=[];replacement='';locked=false;let t=tasks[state.i],z=zones[Math.floor(state.i/3)];app.innerHTML=hud()+`<div class="phasebar">${tasks.map((_,i)=>`<span class="${i<state.i?'filled':''}"></span>`).join('')}</div><div class="stage"><section class="task"><div class="tasktitle"><span class="stageicon">${z.icon}</span><div><div class="eyebrow">Stop ${Math.floor(state.i/3)+1} · Challenge ${state.i%3+1} of 3</div><h2>${z.name}</h2></div></div><p class="instruction">${t.q}</p><div id="activity"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="hintbox" class="hintbox hidden"></div><div class="actions"><button id="hint" class="small">✦ A little help</button><button id="check" class="primary" disabled>Check my choice →</button></div></section>${side()}</div>`;bindHud();renderActivity();$('#check').onclick=check;$('#hint').onclick=()=>{$('#hintbox').classList.remove('hidden');$('#hintbox').textContent=t.why};window.scrollTo(0,0)}
function enable(){const t=tasks[state.i];$('#check').disabled=locked||(t.type==='people'||t.type==='route'?picked===null:t.type==='pack'?selected.length!==2:t.type==='bridge'?order.length!==t.parts.length:picked===null||(t.action==='replace'&&!replacement))}
function renderActivity(){const t=tasks[state.i],a=$('#activity');if(t.type==='people'){a.innerHTML='<div class="choices">'+people.map((p,i)=>`<button data-pick="${i}" class="character"><div class="portrait" style="--pos:${p.pos}" role="img" aria-label="${p.name}, ${p.desc}"></div><div class="caption"><strong>${p.name}</strong><span>${p.desc}</span></div></button>`).join('')+'</div>'}
if(t.type==='pack'){a.innerHTML=`<div class="bagtray" id="bagtray">🎒 Your backpack: <strong id="packcount">0 / 2</strong><div class="muted">Tap two items. Tap again to unpack.</div></div><div class="geargrid">${shuffle(t.items.map((x,i)=>({x,i}))).map(({x,i})=>`<button class="gear" data-gear="${i}" aria-pressed="false"><span aria-hidden="true">${x[0]}</span><em>${x[1]}</em></button>`).join('')}</div>`;document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{if(locked||paused)return;let i=+b.dataset.gear;if(selected.includes(i))selected=selected.filter(v=>v!==i);else if(selected.length<2)selected.push(i);b.classList.toggle('selected',selected.includes(i));b.classList.toggle('checked',selected.includes(i));b.setAttribute('aria-pressed',String(selected.includes(i)));$('#packcount').textContent=selected.length+' / 2';enable()})}
if(t.type==='bridge'){a.innerHTML='<div class="river"><div class="slots" id="slots" aria-label="Your sentence"></div></div><div class="wordbank" id="bank"></div><p class="muted">Tap or drag a plank. Tap a placed plank to return it.</p>';paintBridge();$('#slots').ondragover=e=>{if(!locked&&!paused)e.preventDefault()};$('#slots').ondrop=e=>{e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(!locked&&!paused&&Number.isInteger(i)&&i>=0&&i<t.parts.length&&!order.includes(i)){order.push(i);paintBridge()}}}
if(t.type==='radio'){a.innerHTML=`<div class="radio"><div class="radiolight"></div><p>${t.words.map((w,i)=>`<button class="word" data-word="${i}" aria-pressed="false">${esc(w)}</button>`).join(' ')}</p></div>${t.action==='replace'?'<div class="radioinput"><span>Replace the selected word with:</span><button data-replace="which" class="small">which</button><button data-replace="who" class="small">who</button></div>':''}`;document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(locked||paused)return;picked=+b.dataset.word;document.querySelectorAll('[data-word]').forEach(c=>{c.classList.toggle(t.action==='remove'?'strike':'chosen',c===b);c.setAttribute('aria-pressed',String(c===b))});enable()});document.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>{if(locked||paused)return;replacement=b.dataset.replace;document.querySelectorAll('[data-replace]').forEach(c=>c.classList.toggle('selected',c===b));enable()})}
if(t.type==='route'){a.innerHTML='<div class="routecards">'+shuffle(t.items.map((x,i)=>({x,i}))).map(({x,i})=>`<button class="route" data-pick="${i}"><span class="emoji" aria-hidden="true">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></button>`).join('')+'</div>'}
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(locked||paused)return;picked=+b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(c=>{c.classList.toggle('selected',c===b);c.setAttribute('aria-pressed',String(c===b))});enable()})}
function paintBridge(){let t=tasks[state.i];$('#slots').innerHTML=order.map(i=>`<button class="plank" data-remove="${i}">${esc(t.parts[i])}</button>`).join('');$('#bank').innerHTML=shuffle(t.parts.map((p,i)=>({p,i})).filter(x=>!order.includes(x.i))).map(({p,i})=>`<button class="plank" draggable="true" data-add="${i}">${esc(p)}</button>`).join('');document.querySelectorAll('[data-add]').forEach(b=>{b.onclick=()=>{if(locked||paused)return;order.push(+b.dataset.add);paintBridge()};b.ondragstart=e=>{if(locked||paused){e.preventDefault();return}e.dataTransfer.setData('text/plain',b.dataset.add)}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(locked||paused)return;order=order.filter(i=>i!==+b.dataset.remove);paintBridge()});enable()}
function check(){if(locked||paused)return;let t=tasks[state.i];let ok=t.type==='people'||t.type==='route'?picked===t.answer:t.type==='pack'?selected.length===2&&selected.every(i=>t.answer.includes(i)):t.type==='bridge'?order.every((x,i)=>x===i)&&order.length===t.parts.length:picked===t.answer&&(t.action!=='replace'||replacement===t.replacement);state.trace.push({index:state.i,answer:t.type==='pack'?[...selected]:t.type==='bridge'?[...order]:t.type==='radio'?{picked,replacement}:picked});state.attempts++;state.tries[state.i]++;let fb=$('#feedback');if(ok){state.correct++;if(state.scores[state.i]===null)state.scores[state.i]=state.tries[state.i]===1?100:60;locked=true;tone(784);fb.className='feedback';fb.textContent='You found it! '+t.why;document.querySelectorAll('#activity button').forEach(b=>b.disabled=true);$('#check').textContent='Keep exploring →';$('#check').onclick=next;$('#hint').disabled=true}else{state.hearts--;tone(294);fb.className='feedback retry';fb.textContent='Not quite yet. '+t.why+' Try another choice.';if(state.hearts===0){state.repairs++;modal(`<span class="reward-icon">🌟</span><h2>A fresh start.</h2><p>Every explorer needs a reset sometimes.</p><div class="clue">${t.why}</div><p>Read the clue, take a breath, then try this challenge again with three hearts.</p><button id="repair" class="primary">I’m ready to try →</button>`);$('#repair').onclick=()=>{state.hearts=3;closeModal();renderTask()}}}persist();if($('#points'))$('#points').textContent=total();const hudLife=document.querySelector('.life');if(hudLife){hudLife.textContent='♥'.repeat(state.hearts)+'♡'.repeat(3-state.hearts);hudLife.setAttribute('aria-label',state.hearts+' hearts')}}
function next(){if(paused)return;state.i++;persist();if(state.i%3===0){state.unlocked=state.i/3;state.hearts=3;persist();let z=zones[state.unlocked-1];modal(`<span class="reward-icon">${z.icon}</span><div class="eyebrow">New badge unlocked</div><h2 class="celebrate">${z.reward} earned!</h2><p>You made it through <b>${z.name.toLowerCase()}</b>.</p><div class="pairprompt"><b>60-second partner moment</b><p>${z.talk}</p></div><button id="advance" class="primary">${state.i===15?'Open explorer journal →':'Back to the adventure map →'}</button>`);confetti();$('#advance').onclick=()=>{closeModal();state.i===15?journal():showMap()}}else renderTask()}
function journal(){view='journal';app.innerHTML=hud()+`<section class="journal panel"><span class="badge">🏕️ BASE CAMP REACHED</span><h2>Your story belongs here.</h2><p>You earned all five badges. Now write your explorer journal.</p><div class="clue">Write <b>four sentences, at least 30 words total</b>. Describe two people with <b>who</b> and two objects with <b>which</b> or <b>that</b>. Invent your own camp details.</div><p class="muted">Example starter: “The camper who …” · “The backpack that …”</p><label for="writing" class="vislabel">My explorer journal</label><textarea id="writing" placeholder="Tell us about your crew and your equipment…">${esc(state.writing)}</textarea><div id="wordcount" class="muted"></div>${['I wrote four sentences describing two people and two objects.','I placed each relative clause after its noun.','I checked who / which / that and avoided repeated subjects.'].map((s,i)=>`<label class="checkline"><input type="checkbox" id="self${i}" ${state.journalChecks[i]?'checked':''}>${s}</label>`).join('')}<p class="muted">The game checks completion only. Miss Martha will review your writing and give feedback.</p><div class="actions"><button id="finish" class="primary" disabled>Collect my explorer passport →</button></div></section>`;bindHud();function update(){state.writing=$('#writing').value;state.journalChecks=[0,1,2].map(i=>$('#self'+i).checked);let wc=words(state.writing);$('#wordcount').textContent=wc+' words · minimum 30';$('#finish').disabled=wc<30||!state.journalChecks.every(Boolean);persist()}$('#writing').oninput=update;[0,1,2].forEach(i=>$('#self'+i).onchange=update);update();$('#finish').onclick=()=>{state.finished=new Date().toLocaleString('en-GB',{timeZone:'America/Mexico_City'});persist();showResult();confetti()};window.scrollTo(0,0)}
function words(s){return s.trim()?s.trim().split(/\s+/).length:0}
function reportText(){return `MISS MARTHA’S LAB — EXPLORER PASSPORT\nLost at Camp | 7A English | Unit 2 Chapter 9\nExplorer: ${state.name}\nCompleted: ${state.finished} (Mexico City)\nPractice: ${total()} / 1500\nAccuracy: ${Math.round(state.correct/state.attempts*100)}%\nChallenges completed: 15 / 15\nActive time: ${clock()}\nAttempts: ${state.attempts} | Repair breaks: ${state.repairs}\nBadges: ${zones.map(z=>z.reward).join(', ')}\n\nORIGINAL JOURNAL — PENDING TEACHER REVIEW\n${state.writing}\n\n${words(state.writing)} words. Checklist completed by student.\nThis is practice evidence, not an automatic writing grade.`}
function download(url,ext){let a=document.createElement('a');a.href=url;let d=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'2-digit',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let part=t=>d.find(x=>x.type===t).value;a.download=part('year')+part('month')+part('day')+'_7A_English_Lost_at_Camp_'+state.name.replace(/[^a-z0-9_-]/gi,'_').slice(0,35)+'_Result.'+ext;document.body.append(a);a.click();a.remove();$('#savestatus').textContent='Download requested. Check your Downloads folder. You can also take a screenshot of this passport.'}
function savePNG(){try{let c=document.createElement('canvas');c.width=1200;c.height=1200;let x=c.getContext('2d');x.fillStyle='#fff6df';x.fillRect(0,0,1200,1200);x.fillStyle='#247e73';x.fillRect(0,0,1200,190);x.fillStyle='#fff9e9';x.font='bold 35px sans-serif';x.fillText('MISS MARTHA’S LAB',60,80);x.font='bold 55px sans-serif';x.fillText('LOST AT CAMP',60,150);x.fillStyle='#194c48';x.font='bold 37px sans-serif';x.fillText('EXPLORER PASSPORT',60,275);x.font='32px sans-serif';x.fillText(state.name+' · 7A English',60,340,1070);x.fillStyle='#247e73';x.font='bold 90px sans-serif';x.fillText(total()+' / 1500',60,480);x.fillStyle='#194c48';x.font='30px sans-serif';['15 challenges completed · 5 badges earned','Accuracy: '+Math.round(state.correct/state.attempts*100)+'%','Active time: '+clock(),'Attempts: '+state.attempts+' · Repair breaks: '+state.repairs,'Journal: '+words(state.writing)+' words','Writing quality: pending teacher review'].forEach((s,i)=>x.fillText(s,60,575+i*65));x.font='24px sans-serif';x.fillText(state.finished+' · Mexico City',60,1040);x.fillText('Save your journal TXT too. Upload both to Algebraix.',60,1110);download(c.toDataURL('image/png'),'png')}catch(e){$('#savestatus').textContent='The image could not download. Take a screenshot of your passport and save the TXT report.'}}
function showResult(){view='result';$('#pause').classList.add('hidden');app.innerHTML=`<section class="journal panel"><div class="resultbanner"><span>🏕️ EXPLORER PASSPORT · 7A</span></div><h2>You found your way, ${esc(state.name)}!</h2><p>You tried. You learned. You made it.</p><div class="row"><div class="score">${total()} <small style="font-size:22px">/ 1500</small></div><span class="badge">5 badges earned ★</span></div><p class="muted">Controlled practice points · Your writing is reviewed separately.</p><div class="metrics"><div><b>${Math.round(state.correct/state.attempts*100)}%</b>Practice accuracy</div><div><b>15 / 15</b>Challenges</div><div><b>${clock()}</b>Active time</div></div><p class="muted">${state.attempts} attempts · ${state.repairs} repair breaks · ${esc(state.finished)} (Mexico City)</p><h3>My explorer journal</h3><p class="report">${esc(state.writing)}</p><span class="pill">Writing: pending Miss Martha’s review</span><div class="actions"><button class="primary" id="png">Save passport PNG ↓</button><button id="txt">Save journal TXT ↓</button></div><p class="muted" id="savestatus">Upload both files to Algebraix. Automatic delivery is temporarily unavailable. Upload your evidence to Algebraix.</p><button class="small plain" id="home">Back to start</button></section>`;$('#png').onclick=savePNG;$('#txt').onclick=()=>{let u=URL.createObjectURL(new Blob([reportText()],{type:'text/plain;charset=utf-8'}));download(u,'txt');setTimeout(()=>URL.revokeObjectURL(u),10000)};$('#home').onclick=home;window.sendSchoolResult({id:state.runId,game:'7',group:'7A',trace:state.trace,seconds:state.seconds,writing:state.writing});window.scrollTo(0,0)}
home();
})();
</script></body></html>
