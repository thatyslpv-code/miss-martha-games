<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Showdown | Teacher Dashboard</title>
<style>body{margin:0;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;background:#f2f0ff;color:#192039;font-size:18px}header{padding:16px 5%;background:#17142c;color:#fff;font-weight:900}main{max-width:1200px;margin:30px auto;padding:0 18px}.card{background:#fff;border:2px solid #192039;border-radius:22px;padding:26px;box-shadow:8px 8px 0 #cbc6f5}input,select,button{font:inherit;padding:12px;border:2px solid #aaa5c9;border-radius:11px}button{font-weight:900;cursor:pointer}.primary{background:#6c4cff;color:#fff;border-color:#6c4cff}label{display:block;font-weight:900;margin:8px 0}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.controls>div{flex:1;min-width:180px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{background:#efedff;border-radius:13px;padding:15px 20px}.stat b{font-size:36px;color:#6c4cff;display:block}table{width:100%;border-collapse:collapse}th{text-align:left;background:#eeeaff;padding:14px}td{padding:16px 14px;border-bottom:1px solid #ddd8ef}.pct{font-size:32px;font-weight:950;color:#6c4cff}.hidden{display:none!important}.msg{min-height:25px;margin:14px 0}</style></head><body>
<header>⚡ SENTENCE SHOWDOWN · MISS MARTHA · TEACHER DASHBOARD</header><main><section class="card"><h1>7A English · Friday Final Review</h1><p>Sentence Structure · 22 points · September 18, 2026</p>
<form id="login"><label>Teacher code</label><input id="code" type="password" required placeholder="Enter teacher code"> <button class="primary">OPEN DASHBOARD</button></form><div class="msg" id="msg">Enter your teacher code to retrieve results.</div>
<section id="dash" class="hidden"><div class="controls"><div><label>Sort</label><select id="sort"><option value="new">Most recent</option><option value="high">Highest score</option><option value="low">Lowest score</option></select></div><div><label>Find student</label><input id="search" type="search" placeholder="Type a name"></div><button class="primary" id="refresh">REFRESH</button><button id="lock">LOCK</button></div><div class="stats"><div class="stat"><b id="count">0</b>submissions</div><div class="stat"><b id="avg">—</b>average</div></div><table><thead><tr><th>STUDENT</th><th>GROUP</th><th>SCORE</th><th>PERCENTAGE</th><th>DATE / TIME</th></tr></thead><tbody id="rows"></tbody></table></section></section></main>
<script>"use strict";const EDGE="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results",GAME="260918_7A_SENTENCE_SHOWDOWN",el=id=>document.getElementById(id);let rows=[],code="",loading=false;
function render(){const s=el("search").value.trim().toLowerCase();let list=rows.filter(r=>String(r.student_name).toLowerCase().includes(s));const sort=el("sort").value;list.sort((a,b)=>sort==="high"?Number(b.percentage)-Number(a.percentage):sort==="low"?Number(a.percentage)-Number(b.percentage):new Date(b.created_at||0)-new Date(a.created_at||0));el("rows").replaceChildren();for(const r of list){const tr=document.createElement("tr"),d=new Date(r.created_at||r.completed_at||0);[r.student_name,r.student_group,r.score+" / "+r.max_score,r.percentage+"%",d.toLocaleString()].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===3)td.className="pct";tr.appendChild(td)});el("rows").appendChild(tr)}if(!list.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=5;td.textContent="No results yet.";tr.appendChild(td);el("rows").appendChild(tr)}el("count").textContent=list.length;el("avg").textContent=list.length?Math.round(list.reduce((n,r)=>n+Number(r.percentage||0),0)/list.length)+"%":"—"}
async function load(){if(!code||loading)return;loading=true;el("msg").textContent="Loading results…";try{const r=await fetch(EDGE+"?game_id="+encodeURIComponent(GAME),{headers:{"x-teacher-code":code},cache:"no-store",signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(r.status===401||r.status===403?"Teacher code was not accepted.":"Results service unavailable.");const data=await r.json();rows=(data.results||[]).filter(x=>x.game_id===GAME);el("login").classList.add("hidden");el("dash").classList.remove("hidden");render();el("msg").textContent="Results updated: "+new Date().toLocaleTimeString()}catch(e){el("msg").textContent=e.message}finally{loading=false}}
el("login").onsubmit=e=>{e.preventDefault();code=el("code").value.trim();load()};el("refresh").onclick=load;el("sort").onchange=render;el("search").oninput=render;el("lock").onclick=()=>{code="";rows=[];el("dash").classList.add("hidden");el("login").classList.remove("hidden");el("code").value="";el("msg").textContent="Dashboard locked."};</script></body></html>
