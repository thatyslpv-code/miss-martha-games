<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff4f8b"><title>Grammar Arena | 8A English</title>
<style>
:root{--ink:#19162f;--pink:#ff4f8b;--purple:#6d52ff;--cyan:#4ed8ff;--lime:#c9f36b;--yellow:#ffd85a;--paper:#fff;--bg:#f7f2ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f2ff 0,#eef9ff 100%);font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;color:var(--ink);font-size:18px}header{position:sticky;top:0;z-index:10;background:#17142b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand b{color:var(--pink)}main{max-width:980px;margin:28px auto;padding:0 18px 40px}.card{background:#fff;border:2px solid var(--ink);border-radius:24px;padding:28px;box-shadow:8px 8px 0 #d7d1f7}.hero{text-align:center}.hero h1{font-size:clamp(50px,10vw,96px);line-height:.88;margin:10px 0;letter-spacing:-5px}.hero h1 span{color:var(--pink)}.sub{font-size:25px;font-weight:900}.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0}.pill{padding:7px 12px;border-radius:99px;background:#f1efff;border:1px solid #d3cff4;font-weight:850;font-size:14px}label{display:block;font-weight:900;margin:14px 0 7px}input{width:100%;font:inherit;padding:13px;border:2px solid #bcb6d9;border-radius:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;font-weight:950;border:2px solid var(--ink);border-radius:14px;padding:13px 18px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer}.primary{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 4px 0 #a92b58}.lime{background:var(--lime)}.badge{display:inline-block;background:var(--yellow);padding:6px 10px;border-radius:8px;font-weight:950;font-size:13px}.bossbadge{background:#ff7a4e;color:#fff}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:14px;background:#e7e4f6;border-radius:99px;overflow:hidden;margin:18px 0 28px}.progress div{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan))}.question h2{font-size:clamp(30px,5vw,48px);line-height:1.08}.options{display:grid;gap:12px}.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;box-shadow:none;border-color:#bdb8d4;padding:16px}.opt b{min-width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#f1efff}.opt.selected{background:#fff0f6;border-color:var(--pink)}.feedback{margin-top:22px;padding:20px;border-radius:16px;background:#e8fff5;border:2px solid #268d68}.feedback.wrong{background:#fff0f4;border-color:#bf4168}.phasecard{padding:18px;border-radius:16px;background:linear-gradient(135deg,#fff1f7,#f0ecff);border:2px solid var(--pink);margin-bottom:20px;text-align:center}.bossmeter{display:flex;gap:5px;margin:10px 0}.bossmeter span{height:8px;flex:1;border-radius:9px;background:#ddd8ef}.bossmeter span.on{background:#ff7a4e}.pct{font-size:clamp(92px,18vw,175px);font-weight:950;line-height:.9;color:var(--pink);letter-spacing:-8px}.score{font-size:36px;font-weight:950}.evidence{background:var(--lime);padding:14px;border-radius:12px;font-weight:900;margin:18px 0}.error{color:#aa2d55;min-height:22px}.hidden{display:none!important}.timer{font-variant-numeric:tabular-nums}
@media(max-width:650px){.grid2{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body>
<header><div class="brand">🏟️ GRAMMAR <b>ARENA</b><div style="font-size:11px;letter-spacing:2px;color:#d5cffd">MISS MARTHA · 8A ENGLISH</div></div><div class="timer" id="timer"></div></header><main id="app"></main>
<script>
"use strict";
const QUESTIONS=[{"phase":"GAME SHOW","q":"Identify the verbal: “Swimming before school wakes me up.”","o":["Gerund","Infinitive","Participle","Not a verbal"],"a":0,"f":"Swimming acts as a noun, so it is a gerund."},{"phase":"GAME SHOW","q":"Identify the verbal: “I want to finish early.”","o":["Gerund","Infinitive","Participle","Imperative"],"a":1,"f":"To finish is an infinitive: to + base verb."},{"phase":"GAME SHOW","q":"Identify the verbal: “The cracked screen was replaced.”","o":["Gerund","Infinitive","Participle","Subjunctive"],"a":2,"f":"Cracked describes screen, so it functions as a participle."},{"phase":"GAME SHOW","q":"What mood is this sentence? “Close the door quietly.”","o":["Indicative","Imperative","Interrogative","Subjunctive"],"a":1,"f":"It gives a command, so the mood is imperative."},{"phase":"GAME SHOW","q":"What mood is this sentence? “Did you finish the assignment?”","o":["Indicative","Imperative","Interrogative","Subjunctive"],"a":2,"f":"It asks a question, so it is interrogative."},{"phase":"GAME SHOW","q":"What mood is this sentence? “The library closes at 5:00.”","o":["Indicative","Imperative","Interrogative","Subjunctive"],"a":0,"f":"It states a fact, so it is indicative."},{"phase":"GAME SHOW","q":"What mood is this sentence? “If I were you, I would apologize.”","o":["Indicative","Imperative","Interrogative","Subjunctive"],"a":3,"f":"This expresses an unreal/hypothetical situation, so it is subjunctive."},{"phase":"GAME SHOW","q":"Which sentence contains a GERUND?","o":["She hopes to win.","Running is my favorite exercise.","The broken vase was expensive.","Please sit down."],"a":1,"f":"Running is acting as a noun."},{"phase":"GAME SHOW","q":"Which sentence contains an INFINITIVE?","o":["He enjoys reading.","To travel is my goal.","The barking dog woke us.","Turn off the light."],"a":1,"f":"To travel is an infinitive."},{"phase":"GAME SHOW","q":"Which sentence contains a PARTICIPLE?","o":["The glowing screen hurt my eyes.","I like to draw.","Drawing relaxes me.","Can you draw this?"],"a":0,"f":"Glowing modifies screen, so it is a participle."},{"phase":"GAME SHOW","q":"Choose the best completion: “_____ every day improves your vocabulary.”","o":["Read","Reading","To reads","Readed"],"a":1,"f":"Reading functions as the subject of the sentence, so a gerund works."},{"phase":"GAME SHOW","q":"Choose the best completion: “She decided _____ the competition.”","o":["entering","to enter","entered","enters"],"a":1,"f":"Decided is naturally followed by an infinitive: to enter."},{"phase":"GAME SHOW","q":"Which sentence is IMPERATIVE?","o":["You should finish now.","Finish your work now.","Are you finished?","I wish you were finished."],"a":1,"f":"Finish your work now is a direct command."},{"phase":"GAME SHOW","q":"Which sentence is SUBJUNCTIVE?","o":["I suggest that he be on time.","He is on time.","Be on time!","Is he on time?"],"a":0,"f":"Suggest that he be uses the subjunctive form."},{"phase":"GAME SHOW","q":"Spot the error: “She enjoys to read mystery novels.”","o":["No error","to read should be reading","enjoys should be enjoy","mystery should be mysteries"],"a":1,"f":"Enjoy is followed by a gerund: enjoys reading."},{"phase":"BOSS BATTLE","q":"BOSS 1: In “The students waiting outside looked nervous,” what is “waiting”?","o":["Gerund used as a noun","Infinitive used as a noun","Participle describing students","Main verb"],"a":2,"f":"Waiting describes which students, so it is a participle."},{"phase":"BOSS BATTLE","q":"BOSS 2: Which sentence contains BOTH a verbal and interrogative mood?","o":["Running is difficult.","Can you help me finish this project?","Please finish the project.","I wish the project were finished."],"a":1,"f":"To finish is an infinitive, and the sentence asks a question."},{"phase":"BOSS BATTLE","q":"BOSS 3: Which sentence contains a participle and indicative mood?","o":["The shattered glass covered the floor.","Pick up the shattered glass.","Did the shattered glass fall?","If the glass were shattered, we would replace it."],"a":0,"f":"Shattered modifies glass, and the sentence states a fact."},{"phase":"BOSS BATTLE","q":"BOSS 4: Which rewrite is correct? “The baby cried because the noise was frightening.”","o":["The frightening noise made the baby cry.","The frighten noise made the baby cry.","The noise frightening made the baby cry.","The baby to cry because the noise."],"a":0,"f":"Frightening correctly works as a participle modifying noise."},{"phase":"BOSS BATTLE","q":"BOSS 5: Which sentence uses a gerund correctly after a preposition?","o":["She is interested in learn French.","She is interested in learning French.","She is interested to learning French.","She is interested learn French."],"a":1,"f":"After the preposition in, use the gerund form learning."},{"phase":"BOSS BATTLE","q":"BOSS 6: Identify BOTH features: “Please stop talking.”","o":["Imperative + gerund","Indicative + participle","Interrogative + infinitive","Subjunctive + gerund"],"a":0,"f":"Please stop is a command, and talking functions as a gerund after stop."},{"phase":"BOSS BATTLE","q":"BOSS 7: Identify BOTH features: “Would you like to join us?”","o":["Indicative + gerund","Interrogative + infinitive","Imperative + participle","Subjunctive + gerund"],"a":1,"f":"It is a question, and to join is an infinitive."},{"phase":"BOSS BATTLE","q":"BOSS 8: Which sentence is the best example of subjunctive mood?","o":["She was here yesterday.","Was she here yesterday?","I recommend that she be here by eight.","Be here by eight."],"a":2,"f":"Recommend that she be uses the subjunctive form."},{"phase":"BOSS BATTLE","q":"FINAL BOSS: Which analysis is completely correct? “The exhausted runner stopped to drink water.”","o":["Exhausted = gerund; to drink = participle","Exhausted = participle; to drink = infinitive","Exhausted = infinitive; to drink = gerund","Exhausted = main verb; to drink = imperative"],"a":1,"f":"Exhausted describes runner, while to drink is an infinitive."},{"phase":"BOSS BATTLE","q":"FINAL BOSS: Which sentence contains a verbal AND uses subjunctive mood?","o":["I insist that he stop texting during class.","Stop texting during class.","He stopped texting during class.","Did he stop texting during class?"],"a":0,"f":"Texting is a gerund after stop, and insist that he stop uses the subjunctive."}];
const EDGE="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results",GAME_ID="260918_8A_GRAMMAR_ARENA",DOMAIN="@colegiointernacional.edu.mx",STORE="260918_8A_grammar_arena";
const el=id=>document.getElementById(id);let state=null,locked=false,sending=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function landing(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY FINAL REVIEW · SEPT. 18, 2026</span><h1>GRAMMAR<br><span>ARENA</span></h1><div class="sub">Verbals & Moods · 25 rounds · Game Show + Boss Battle</div><div class="pills"><span class="pill">Gerunds</span><span class="pill">Infinitives</span><span class="pill">Participles</span><span class="pill">Indicative</span><span class="pill">Imperative</span><span class="pill">Interrogative</span><span class="pill">Subjunctive</span></div><form id="start"><div class="grid2"><div><label>Full name</label><input id="name" required placeholder="First and last name"></div><div><label>School email</label><input id="email" type="email" required placeholder="name@colegiointernacional.edu.mx"></div></div><label>Group</label><input value="8A" readonly><p class="error" id="err"></p><button class="primary">ENTER THE ARENA →</button></form></section>`;el("start").onsubmit=e=>{e.preventDefault();const name=el("name").value.trim(),email=el("email").value.trim().toLowerCase();if(name.length<3){el("err").textContent="Please enter your full name.";return}if(!email.endsWith(DOMAIN)){el("err").textContent="Use your colegiointernacional.edu.mx school email.";return}state={name,email,group:"8A",index:0,answers:[],started:Date.now(),finished:false,saved:false};persist();renderQ()}}
function renderQ(){locked=false;const i=state.index,q=QUESTIONS[i],pct=Math.round(i/QUESTIONS.length*100),boss=q.phase==="BOSS BATTLE";app.innerHTML=`<section class="card question">${i===15?`<div class="phasecard"><span class="badge bossbadge">BOSS BATTLE UNLOCKED</span><h2>Now the questions combine skills.</h2><p>No lives. Think before you click.</p></div>`:""}<div class="topline"><span class="badge ${boss?"bossbadge":""}">${q.phase}</span><b>${i+1} / ${QUESTIONS.length}</b></div>${boss?`<div class="bossmeter">${Array.from({length:10},(_,k)=>`<span class="${k<=i-15?"on":""}"></span>`).join("")}</div>`:""}<div class="progress"><div style="width:${pct}%"></div></div><h2>${esc(q.q)}</h2><div class="options">${q.o.map((x,j)=>`<button class="opt" data-i="${j}"><b>${String.fromCharCode(65+j)}</b><span>${esc(x)}</span></button>`).join("")}</div><div id="feed"></div></section>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>select(+b.dataset.i));window.scrollTo(0,0)}
function select(j){if(locked)return;locked=true;const q=QUESTIONS[state.index],correct=j===q.a;state.answers[state.index]={choice:j,correct};persist();document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add("selected")});el("feed").innerHTML=`<div class="feedback ${correct?"":"wrong"}"><strong>${correct?"✅ POINT WON":"⚠️ Not this time"}</strong><p>${esc(q.f)}</p>${!correct?`<p><b>Correct answer:</b> ${esc(q.o[q.a])}</p>`:""}<button class="lime" id="next">${state.index===24?"SEE MY FINAL SCORE →":"NEXT ROUND →"}</button></div>`;el("next").onclick=next}
function next(){state.index++;if(state.index>=QUESTIONS.length){state.finished=true;persist();showResult();submitScore()}else{persist();renderQ()}}
function score(){return state.answers.filter(x=>x&&x.correct).length}function rank(p){return p>=92?"Grammar Arena Champion":p>=84?"Boss Battle Master":p>=76?"Strong Grammar Player":p>=68?"Good Fight":"Keep Training"}
function showResult(){const s=score(),p=Math.round(s/QUESTIONS.length*100);app.innerHTML=`<section class="card hero"><span class="badge bossbadge">ARENA COMPLETE</span><h1>FINAL<br><span>SCORE</span></h1><h2>${esc(state.name)}</h2><p><b>8A ENGLISH · Friday, Sept. 18, 2026</b></p><div class="pct">${p}%</div><div class="score">${s} / ${QUESTIONS.length}</div><h2>${rank(p)}</h2><div class="evidence">Take a screenshot of this screen for your class evidence.</div><div id="save">${state.saved?"Score saved to Miss Martha's dashboard.":"Saving score…"}</div><p><button class="primary" id="download">DOWNLOAD RESULT</button> <button id="retry" class="${state.saved?"hidden":""}">RETRY SAVE</button> <button id="again">PLAY AGAIN</button></p></section>`;el("download").onclick=downloadResult;el("retry").onclick=submitScore;el("again").onclick=()=>{if(confirm("Start a new attempt?")){localStorage.removeItem(STORE);state=null;landing()}}}
async function submitScore(){if(!state||!state.finished||state.saved||sending)return;sending=true;try{const s=score(),p=Math.round(s/QUESTIONS.length*100),r=await fetch(EDGE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student_name:state.name,student_group:"8A",game_id:GAME_ID,grade:"8A",score:s,max_score:QUESTIONS.length,percentage:p,completed:true}),signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error();state.saved=true;persist();if(el("save"))el("save").textContent="Score saved to Miss Martha's dashboard.";if(el("retry"))el("retry").classList.add("hidden")}catch(e){if(el("save"))el("save").textContent="Could not save automatically. Your screenshot still works."}finally{sending=false}}
function downloadResult(){const c=document.createElement("canvas");c.width=1200;c.height=800;const x=c.getContext("2d"),s=score(),p=Math.round(s/QUESTIONS.length*100);x.fillStyle="#fff";x.fillRect(0,0,1200,800);x.strokeStyle="#ff4f8b";x.lineWidth=12;x.strokeRect(20,20,1160,760);x.textAlign="center";x.fillStyle="#19162f";x.font="bold 50px Arial";x.fillText("GRAMMAR ARENA",600,90);x.font="bold 54px Arial";x.fillText(state.name,600,175);x.fillStyle="#ff4f8b";x.font="bold 220px Arial";x.fillText(p+"%",600,470);x.fillStyle="#19162f";x.font="bold 54px Arial";x.fillText(s+" / "+QUESTIONS.length,600,565);x.font="31px Arial";x.fillText("8A ENGLISH · SEPTEMBER 18, 2026",600,650);c.toBlob(b=>{const a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download="260918_8A_Grammar_Arena_"+state.name.replace(/[^a-z0-9]/gi,"_")+".png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},"image/png")}
function boot(){try{const r=JSON.parse(localStorage.getItem(STORE));if(r&&r.group==="8A"&&Array.isArray(r.answers))state=r}catch(e){}if(!state){landing();return}if(state.finished){showResult();submitScore();return}app.innerHTML=`<section class="card hero"><span class="badge">SESSION FOUND</span><h1>WELCOME<br><span>BACK</span></h1><h2>${esc(state.name)}</h2><p>You completed ${state.answers.length} of ${QUESTIONS.length} rounds.</p><button class="primary" id="resume">RESUME →</button> <button id="new">NEW STUDENT</button></section>`;el("resume").onclick=renderQ;el("new").onclick=()=>{localStorage.removeItem(STORE);state=null;landing()}}
setInterval(()=>{if(state&&!state.finished){const sec=Math.floor((Date.now()-state.started)/1000);el("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else el("timer").textContent=""},1000);window.addEventListener("online",()=>{if(state?.finished&&!state.saved)submitScore()});boot();
</script></body></html>
