const G={"group": "10A / 10B", "topic": "Using Transitions", "mode": "Rewrite Lab", "title": "The Broken Report", "file": "261104_10A_10B_English_Using_Transitions_Rewrite_Lab.html", "brief": "The school newspaper received three damaged reports. You are the editor. Repair their logic, rebuild the paragraphs and prepare one original report for publication.", "writing": "Write a 5–6 sentence report (55–100 words) about a school activity. Give a clear opening, an example, a contrast and a result. Use at least three different transitions. Explain one connector choice in a final sentence.", "minwords": 55, "checklist": ["I developed one main idea in a logical order.", "I included an example, a contrast and a result.", "I checked transitions and punctuation."], "evidence": ["CHECK 1: A connector must match the meaning. Contrast is not the same as result.", "CHECK 2: An opening introduces the topic. Later sentences explain, illustrate or develop it.", "CHECK 3: A coherent report has one main idea, useful details and accurate punctuation."], "key": "10", "duration": "20–25 minutes", "symbol": "✏️", "hero": "261104_10A_10B_English_Rewrite_Illustration.png", "headline": ["THE BROKEN", "REPORT"], "stages": ["Repair the logic", "Rebuild the report", "Publish with purpose"], "rewards": ["Logic lens", "Structure stamp", "Editor badge"], "talk": ["Explain how one connector changes the relationship between ideas.", "Explain how you knew which sentence belongs first.", "Explain how you kept the paragraph focused."], "tasks": [{"kind": "edit", "title": "01 / Repair the logic", "story": "Report A: the book fair. Replace only Similarly with Therefore. Keep the rest of the text.", "source": "The delivery arrived late. Similarly, the fair opened at noon.", "answers": ["The delivery arrived late. Therefore, the fair opened at noon."], "hint": "The late delivery caused the later opening.", "why": "Therefore introduces a result; similarly would introduce a likeness."}, {"kind": "edit", "title": "02 / Repair the punctuation", "story": "Use a semicolon before however and a comma after it. Keep all the words.", "source": "The hall was small, however the event was successful.", "answers": ["The hall was small; however, the event was successful."], "hint": "The clauses on both sides can stand alone.", "why": "A semicolon separates the clauses and a comma follows however."}, {"kind": "edit", "title": "03 / Remove a duplicate", "story": "Keep Moreover and remove furthermore. Keep the remaining words and fix the comma.", "source": "The fair raised funds. Moreover, furthermore, it encouraged reading.", "answers": ["The fair raised funds. Moreover, it encouraged reading."], "hint": "Only one addition transition is needed here.", "why": "Two addition connectors in a row create unnecessary repetition."}, {"kind": "order", "title": "04 / Restore Report A", "story": "Drag or tap the four sentences into the most logical order.", "parts": ["Our class organised a book fair.", "First, we collected books from families.", "Next, we sorted the donations by age group.", "Finally, we opened the fair to visitors."], "hint": "Find the opening idea, then follow references, examples and results.", "why": "The opening introduces the fair. First, next and finally organise its stages."}, {"kind": "edit", "title": "05 / Add an example", "story": "Report B: the museum visit. Replace However with For example; keep the rest.", "source": "The museum offers interactive activities. However, visitors can build a model bridge.", "answers": ["The museum offers interactive activities. For example, visitors can build a model bridge."], "hint": "A model bridge is one specific activity.", "why": "For example connects the general claim to a concrete illustration."}, {"kind": "edit", "title": "06 / Keep the contrast", "story": "Replace Therefore with Nevertheless. Keep the rest of the text.", "source": "The tickets were expensive. Therefore, the students enjoyed the visit.", "answers": ["The tickets were expensive. Nevertheless, the students enjoyed the visit."], "hint": "Enjoyment is presented as a benefit despite the cost.", "why": "Nevertheless acknowledges the cost and introduces a contrasting positive experience."}, {"kind": "order", "title": "07 / Rebuild Report B", "story": "Use the opening, its example, a difficulty and the response to that difficulty.", "parts": ["The museum visit taught us about bridge design.", "For example, we tested how much weight a model could hold.", "However, our first model collapsed.", "Therefore, we strengthened the base and tried again."], "hint": "Find the opening idea, then follow references, examples and results.", "why": "The example illustrates the learning; however introduces the problem; therefore gives the response."}, {"kind": "pick", "title": "08 / Remove the distraction", "story": "An editor checks that every sentence supports the report.", "source": "Which sentence should be removed from a report about learning bridge design?", "options": ["We tested three different bridge shapes.", "The experiment helped us compare structures.", "My cousin bought a new skateboard yesterday."], "answer": "My cousin bought a new skateboard yesterday.", "hint": "The skateboard sentence does not develop the bridge-design topic.", "why": "The skateboard sentence does not develop the bridge-design topic."}, {"kind": "edit", "title": "09 / Repair a result", "story": "Report C: the garden project. Replace For instance with As a result. Keep the rest.", "source": "The volunteers watered the seedlings regularly. For instance, the plants grew well.", "answers": ["The volunteers watered the seedlings regularly. As a result, the plants grew well."], "hint": "The second sentence describes what happened because of the first.", "why": "As a result introduces the outcome of regular watering."}, {"kind": "order", "title": "10 / Restore Report C", "story": "Use references and cause-and-effect relationships to rebuild the paragraph.", "parts": ["A group of students decided to restore a neglected garden.", "However, the group had no gardening tools.", "Therefore, they asked a local shop for help.", "The shop donated equipment, so the work began."], "hint": "Find the opening idea, then follow references, examples and results.", "why": "The group refers to the students; the lack of tools motivates the request; the donation follows it."}, {"kind": "edit", "title": "11 / Choose useful punctuation", "story": "Use a period before Therefore and a comma after it. Keep all the words.", "source": "The project needed funding therefore the class organised a sale.", "answers": ["The project needed funding. Therefore, the class organised a sale."], "hint": "There are two complete statements.", "why": "The period separates the statements; the comma follows the introductory transition."}, {"kind": "pick", "title": "12 / Final editorial decision", "story": "The report must end by synthesising its main point.", "source": "Which ending best fits a report about learning teamwork through the garden project?", "options": ["In conclusion, the project showed us how cooperation can solve practical problems.", "For example, my favourite film is a comedy.", "However, nevertheless, therefore, teamwork."], "answer": "In conclusion, the project showed us how cooperation can solve practical problems.", "hint": "The conclusion returns to the main idea and expresses a complete thought.", "why": "The conclusion returns to the main idea and expresses a complete thought."}]},$=s=>document.querySelector(s),app=$('#app'),overlay=$('#overlay'),STORAGE='MissMartha_Studio_'+G.key+'_261104_v3_'+pupil.email;

function total(){return s.scores.reduce((a,b)=>a+(b||0),0)}function clock(){return Math.floor(s.seconds/60)+':'+String(Math.floor(s.seconds)%60).padStart(2,'0')}

function tone(f=523){if(!audioOn||!ctx||paused||document.hidden)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.022,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.23)}catch(e){}}
$('#audio').onclick=()=>{audioOn=!audioOn;if(audioOn){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});tone(659);let n=0;music=setInterval(()=>tone([261,329,392,329,293,349,440,349][n++%8]),900)}catch(e){audioOn=false}}else{clearInterval(music);if(ctx)ctx.suspend().catch(()=>{})}$('#audio').textContent=audioOn?'♫ Sound on':'♫ Sound off';$('#audio').setAttribute('aria-pressed',String(audioOn))};

$('#pause').onclick=()=>{modal('<span class="reward-icon">☁️</span><h2>A moment to recharge.</h2><p>Your timer is paused and your answers are safe.</p><button id="resume" class="primary">Resume mission →</button>');$('#resume').onclick=closeModal};

function home(){view='home';$('#pause').classList.add('hidden');let old=saved();app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="pill">${G.mode.toUpperCase()} · ${G.group}</span><h1 class="title">${G.headline[0]}<br><span>${G.headline[1]}</span></h1><p class="lead">${G.key==='9'?'Every detail tells a story.':'Good ideas deserve great sentences.'}</p><p>${G.key==='9'?'A reading-event invitation has vanished. Restore documents, gather clues and solve the case.':'The newspaper needs your help. Repair the links, rebuild the paragraphs and prepare a report worth reading.'}</p><form id="start"><label class="vislabel" for="name">Your full name</label><div class="startbox"><input id="name" required maxlength="45" placeholder="Your name" autocomplete="off">${G.key==='10'?'<select id="group" class="groupselect" aria-label="Class"><option>10A</option><option>10B</option></select>':''}<button class="primary">${G.key==='9'?'OPEN THE CASE':'ENTER THE LAB'} →</button></div></form>${old?'<button class="small" id="continue" style="margin-top:16px">Continue saved mission →</button>':''}</div><div class="hero-foot">🌟 Think it through. Try a new approach.<br>Every correction is progress.</div></section><div class="introtiles"><div><b>${G.key==='9'?'Restore the evidence':'Rewrite with purpose'}</b>${G.key==='9'?'Tap words to repair capitals. Compare documents to find the truth.':'Type precise edits, move paragraph strips and make editorial decisions.'}</div><div><b>Three desks. Twelve challenges.</b>${G.duration}, including discussion and original writing.</div><div><b>Keep your progress.</b>Three hearts, free hints and a saved mission. A fresh try is always possible.</div></div><details class="a1"><summary>Mission rules</summary><p>Complete four challenges at each desk. First-try answers earn 100 points; corrected answers earn 60. After three errors, study the repair card and retry the current challenge. Your original writing receives teacher feedback separately.</p><p>${G.key==='9'?'For word cards, tap to switch between lowercase and an initial capital. Use the context to decide.':'Edits ask for a specific change. Keep the remaining wording. Other valid rewrites belong in the final writing task.'}</p></details>`;$('#name').value=pupil.name;$('#name').readOnly=true;$('#start').onsubmit=e=>{e.preventDefault();let name=pupil.name,group=G.key==='10'?$('#group').value:'9A';if(!name)return;const begin=()=>{s={version:2,name,runId:window.schoolRunId(),trace:[],group,i:0,unlocked:0,hearts:3,seconds:0,scores:Array(12).fill(null),tries:Array(12).fill(0),attempts:0,correct:0,repairs:0,writing:'',checks:[false,false,false]};persist();desk()};if(old){modal('<h2>Start a new mission?</h2><p>This replaces the saved mission on this device.</p><button id="fresh" class="primary">Start fresh</button> <button id="cancel">Keep my save</button>');$('#fresh').onclick=()=>{closeModal();begin()};$('#cancel').onclick=closeModal}else begin()};if(old)$('#continue').onclick=()=>{s=old;s.finished?result():s.i===12?journal():desk()}}
function hud(){return `<div class="hud"><span>${G.symbol} <strong>${esc(s.name)} · ${s.group}</strong></span><span>⭐ <strong id="points">${total()}</strong></span><span class="life" aria-label="${s.hearts} hearts">${'♥'.repeat(s.hearts)}${'♡'.repeat(3-s.hearts)}</span><span class="spacer"></span><span>⏱ <strong id="timer">${clock()}</strong></span><button class="small plain" id="saveexit">Save & exit</button></div>`}
function bindHud(){ $('#pause').classList.remove('hidden');$('#saveexit').onclick=()=>{persist();home()}}

function desk(){view='task';locked=false;pick=null;order=[];caps=[];let t=G.tasks[s.i];app.innerHTML=hud()+`<div class="desksteps">${G.stages.map((z,i)=>`<div class="step ${i<s.unlocked?'done':i===Math.floor(s.i/4)?'active':''}">${i<s.unlocked?'✓':i+1} · ${z}</div>`).join('')}</div><div class="stage"><section class="task"><div class="eyebrow">${G.mode} · Challenge ${s.i+1} / 12</div><h2>${t.title.substring(5)}</h2><p class="instruction">${t.story}</p><div id="activity"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="hintbox hidden" id="hintbox"></div><div class="actions"><button id="hint" class="small">✦ A little help</button><button id="check" class="primary" disabled>Check my work →</button></div><details class="evidenceinline"><summary>${G.key==='9'?'Evidence board':'Editor’s toolkit'}</summary>${board()}</details></section><aside class="noteboard"><div class="boardlabel">${G.key==='9'?'CASE EVIDENCE':'EDITOR’S TOOLKIT'}</div>${board()}<p class="helpertext">${G.key==='9'?'Use facts from the documents. Do not guess from the length of an invitation.':'Meaning comes first. Then check sentence order and punctuation.'}</p></aside></div>`;bindHud();activity();$('#check').onclick=check;$('#hint').onclick=()=>{$('#hintbox').textContent=t.hint;$('#hintbox').classList.remove('hidden')};window.scrollTo(0,0)}

function activity(){let t=G.tasks[s.i],a=$('#activity');if(t.kind==='caps'){caps=t.source.split(' ');a.innerHTML=`<div class="paper" data-doc="${s.i+1}"><div id="capitalwords"></div></div><p class="helpertext">Tap the word cards. Highlighted cards have an initial capital. Read the sentence before checking.</p>`;paintCaps()}

if(t.kind==='order'){a.innerHTML='<div class="studio-order"><div class="slots" id="slots" aria-label="Your paragraph"></div></div><div class="wordbank" id="bank"></div><p class="helpertext">Tap or drag the strips in order. Tap a placed strip to return it.</p>';paintOrder();$('#slots').ondragover=e=>{if(!locked&&!paused)e.preventDefault()};$('#slots').ondrop=e=>{e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(!locked&&!paused&&Number.isInteger(i)&&i>=0&&i<t.parts.length&&!order.includes(i)){order.push(i);paintOrder()}}}

function answer(){let t=G.tasks[s.i];return t.kind==='caps'?caps.join(' '):t.kind==='edit'?$('#response').value.trim():t.kind==='order'?order.map(i=>t.parts[i]).join(' '):t.options[pick]}
function check(){if(locked||paused)return;let t=G.tasks[s.i],a=answer(),ok=t.kind==='caps'?a===t.target:t.kind==='edit'?t.answers.some(x=>norm(x)===norm(a)):t.kind==='order'?order.length===t.parts.length&&order.every((x,i)=>x===i):a===t.answer;s.trace.push({index:s.i,answer:a});s.attempts++;s.tries[s.i]++;let f=$('#feedback');if(ok){s.correct++;if(s.scores[s.i]===null)s.scores[s.i]=s.tries[s.i]===1?100:60;locked=true;tone(784);f.className='feedback';f.textContent='Verified! '+t.why;document.querySelectorAll('#activity button,#activity textarea').forEach(b=>b.disabled=true);$('#hint').disabled=true;$('#check').textContent='Continue →';$('#check').onclick=next}else{s.hearts--;tone(294);f.className='feedback retry';f.textContent='You’re getting closer. '+t.hint;if(s.hearts===0){s.repairs++;modal(`<span class="reward-icon">🌟</span><h2>Reset. Rethink. Try again.</h2><p>${t.why}</p><p class="clue">${esc(t.kind==='caps'?t.target:t.kind==='edit'?t.answers[0]:t.kind==='order'?t.parts.join(' '):t.answer)}</p><button id="repair" class="primary">Try with three new hearts →</button>`);$('#repair').onclick=()=>{s.hearts=3;closeModal();desk()}}}persist();$('#points').textContent=total();let h=document.querySelector('.life');h.textContent='♥'.repeat(s.hearts)+'♡'.repeat(3-s.hearts);h.setAttribute('aria-label',s.hearts+' hearts')}
function next(){if(paused)return;s.i++;if(s.i%4===0){s.unlocked=s.i/4;s.hearts=3;persist();let n=s.unlocked-1;modal(`<span class="reward-icon">${G.symbol}</span><div class="eyebrow">Mission progress</div><h2>${G.rewards[n]} unlocked!</h2><div class="clue">${G.evidence[n]}</div><div class="pairprompt"><b>Discuss with a partner · 60 seconds</b><p>${G.talk[n]}</p></div><button id="advance" class="primary">${s.i===12?'Create my final report →':'Open the next desk →'}</button>`);celebrate();$('#advance').onclick=()=>{closeModal();s.i===12?journal():desk()}}else{persist();desk()}}
function journal(){view='journal';app.innerHTML=hud()+`<section class="journal panel"><span class="badge">${G.symbol} ALL THREE DESKS COMPLETE</span><h2>${G.key==='9'?'Close the case.':'Make it your own.'}</h2><div class="clue">${G.writing}</div><details class="evidenceinline" open><summary>${G.key==='9'?'Your case evidence':'Your editor’s toolkit'}</summary>${board()}</details><label for="writing" class="vislabel">My original writing</label><textarea id="writing">${esc(s.writing)}</textarea><p class="muted" id="wordcount"></p>${G.checklist.map((x,i)=>`<label class="checkline"><input id="self${i}" type="checkbox" ${s.checks[i]?'checked':''}>${x}</label>`).join('')}<p class="muted">Word count and your checklist confirm completion only. Miss Martha reviews the quality and accuracy of your writing.</p><div class="actions"><button id="finish" class="primary" disabled>Collect my mission certificate →</button></div></section>`;bindHud();function update(){s.writing=$('#writing').value;s.checks=[0,1,2].map(i=>$('#self'+i).checked);$('#wordcount').textContent=words(s.writing)+' words · at least '+G.minwords+' required';$('#finish').disabled=words(s.writing)<G.minwords||!s.checks.every(Boolean);persist()}$('#writing').oninput=update;[0,1,2].forEach(i=>$('#self'+i).onchange=update);update();$('#finish').onclick=()=>{s.finished=new Date().toLocaleString('en-GB',{timeZone:'America/Mexico_City'});persist();result();celebrate()};window.scrollTo(0,0)}
