<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context Detectives | 8A English</title><style>
:root{--ink:#292039;--paper:#fff9e9;--yellow:#ffd53d;--orange:#ff753e;--purple:#6d39b8}*{box-sizing:border-box}body{margin:0;background:var(--yellow);color:var(--ink);font:17px/1.5 system-ui,sans-serif;background-image:radial-gradient(#b7952426 2px,transparent 2px);background-size:22px 22px}header,main{max-width:1030px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;text-transform:uppercase;letter-spacing:1px}.pill{background:var(--ink);color:white;border-radius:30px;padding:8px 18px;font-weight:700}h1{font-size:clamp(38px,7vw,75px);line-height:1.03;margin:12px 0 25px;letter-spacing:-2px}h2{line-height:1.25}.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:clamp(20px,4vw,38px);margin-bottom:28px}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:900;color:#9f320a;text-transform:uppercase}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{padding:16px;border:2px solid var(--ink);border-radius:14px;background:#ffe899}.step:nth-child(2){background:#ffc0a7}.step:nth-child(3){background:#ded1fa}button,input,textarea{font:inherit}button{cursor:pointer;border:2px solid var(--ink);border-radius:13px;padding:13px 20px;background:var(--yellow);font-weight:750;color:var(--ink)}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--purple);outline-offset:3px}button.primary{background:var(--ink);color:white;margin-top:20px}button:disabled{opacity:.55;cursor:default;transform:none}input,textarea{display:block;width:100%;padding:13px;border:2px solid var(--ink);border-radius:12px;background:white;margin-top:7px}label{font-weight:700;display:block;margin-top:20px}.muted{font-size:14px;color:#62556d}.sentence{font-size:clamp(21px,3vw,29px);border-left:7px solid var(--orange);padding-left:18px}.choices{display:grid;gap:10px}.choice{text-align:left;background:white;font-weight:600}.selected{background:#e4d3ff;outline:3px solid var(--purple)}.good{background:#d8efc2}.bad{background:#ffd0c4}.feedback{padding:18px;border-radius:14px;border:2px solid var(--ink);margin-top:22px;background:#f1e5ff}progress{width:100%;height:17px;accent-color:var(--purple)}.bar{display:flex;justify-content:space-between;gap:10px}.score{font-size:68px;font-weight:950;line-height:1.15}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}footer{text-align:center;padding:20px;font-size:13px}textarea{min-height:115px}.hidden{display:none}@media(max-width:600px){.steps{grid-template-columns:1fr}header,main{padding:14px}.pill{font-size:12px}.card{box-shadow:5px 5px 0 var(--ink)}h1{letter-spacing:-1px}}@media print{body{background:white}header,footer,.actions{display:none}.card{box-shadow:none}}
</style><header><div class="logo">Miss Martha's Lab</div><div class="pill">GRADE 8 · ENGLISH</div></header><main id="app"></main><footer>21 OCT 2026 · Context clues investigation · Your results are saved for Miss Martha.</footer><script>'use strict';
const API='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/context-detectives';
const KEY='sb_publishable_zgaYDjfwjpkOoZD8-HwaSQ_j6jNpnWE',STORE='mm_context_8A_261021';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let attempt=null,game=null,resume=null,selected=-1,busy=false;
try{resume=JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
async function request(b){if(b.action==='start'){if(resume){b.attempt_id=resume.id;b.student_token=resume.token}}else{b.attempt_id=attempt.id;b.student_token=resume.token}const res=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b),signal:AbortSignal.timeout(25000)});const d=await res.json();if(!res.ok)throw Error(d.error||'Please retry.');return d}
function intro(){app.innerHTML=`<div class="card"><div class="eyebrow">Grade 8 / Evidence beats guessing</div><h1>CONTEXT<br>DETECTIVES<span style="color:#ce4b17">.</span></h1><p>Unlock 15 case files. Infer each word's meaning, then prove it with evidence.</p><div class="steps"><div class="step"><b>01 / INFER</b><br>Choose the meaning that fits.</div><div class="step"><b>02 / PROVE</b><br>Find the strongest text clue.</div><div class="step"><b>03 / FINISH</b><br>Save your grade and screenshot.</div></div><p class="muted">30 scored decisions in total. Your first answer counts. Read the feedback before moving on. Internet is required to save your work.</p><form id="start"><label>Full name<input id="student" required minlength="3" maxlength="100" autocomplete="name" value="${esc(resume?.name||'')}"></label><label>School email<input id="email" type="email" required maxlength="254" autocomplete="email" placeholder="name@colegiointernacional.edu.mx" value="${esc(resume?.email||'')}"></label><label>Grade and group<input value="Grade 8 · 8A" readonly></label><button class="primary" id="startButton">${resume?'Start / resume investigation →':'Open the case files →'}</button><p id="startStatus" role="status"></p></form><p class="muted">Your school email is recorded as entered. No verification email or code is required. Your work is saved for Miss Martha. You can only open your own attempt on this device.</p><div class="feedback"><b>At the end: submit your screenshot to Algebraix.</b><br>Include your full name, school email, group, and grade.</div></div>`;
document.getElementById('start').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('startButton'),s=document.getElementById('startStatus'),email=document.getElementById('email').value.trim().toLowerCase(),name=document.getElementById('student').value.trim();if(!/^[^@\s]+@colegiointernacional\.edu\.mx$/.test(email)){s.textContent='Use your @colegiointernacional.edu.mx school email.';return}b.disabled=true;s.textContent='Opening your saved case files…';try{const d=await request({action:'start',name,email,group:'8A'});attempt=d.attempt;game=d.game;resume={id:attempt.id,token:d.student_token,name:attempt.student_name,email:attempt.student_email};try{sessionStorage.setItem(STORE,JSON.stringify(resume))}catch{}render()}catch(e){s.textContent=e.message}finally{if(b.isConnected)b.disabled=false}}}
function render(){if(attempt.completed)return finishScreen();const n=attempt.tasks.length;if(n>=30)return finish();const q=game.rounds[n];selected=-1;busy=false;const order=shuffle(q.options.map((_,i)=>i));app.innerHTML=`<div class="bar"><b>CASE ${q.case} / 15</b><span>${esc(attempt.student_name)} · ${attempt.score} / 30 points</span></div><progress value="${n}" max="30" aria-label="Investigation progress"></progress><div class="card" style="margin-top:20px"><div class="eyebrow">DECISION ${n+1} / 30 · ${q.part==='meaning'?'INFER THE MEANING':'PROVE IT WITH EVIDENCE'}</div><h2>${q.part==='evidence'?'Which clue is strongest?':'What does “'+esc(q.word)+'” mean?'}</h2><p class="sentence">${esc(q.phrase)}</p><div class="choices">${order.map((v,i)=>`<button type="button" class="choice" data-v="${v}" aria-pressed="false">${String.fromCharCode(65+i)}. ${esc(q.options[v])}</button>`).join('')}</div><button class="primary" id="check" disabled>Lock & save my answer</button><div id="feedback" role="status" aria-live="polite"></div></div>`;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(busy)return;selected=Number(b.dataset.v);document.querySelectorAll('[data-v]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});document.getElementById('check').disabled=false});
document.getElementById('check').onclick=async()=>{if(selected<0||busy)return;busy=true;const b=document.getElementById('check'),f=document.getElementById('feedback');b.disabled=true;f.textContent='Checking and saving your answer…';try{const d=await request({action:'answer',index:n,response:selected});attempt=d.attempt;document.querySelectorAll('[data-v]').forEach(x=>{x.disabled=true;if(Number(x.dataset.v)===selected)x.classList.add(d.correct?'good':'bad')});f.innerHTML=`<div class="feedback"><b>${d.correct?'Evidence accepted! +1 point':'Saved. +0 points'}</b><p>${esc(d.feedback)}</p><button id="next">${q.part==='meaning'?'Now prove it →':'Next case →'}</button></div>`;document.getElementById('next').onclick=()=>{render();window.scrollTo(0,0)};document.getElementById('next').focus()}catch(e){f.textContent=e.message+' Your selection is still here. Retry saving.';busy=false;b.disabled=false}}}
async function finish(){app.innerHTML='<div class="card"><h1>Saving your result…</h1><p id="finishStatus" role="status">Please keep this page open.</p><button id="retryFinish" class="hidden">Retry saving</button></div>';try{const d=await request({action:'finish'});attempt=d.attempt;finishScreen()}catch(e){document.getElementById('finishStatus').textContent=e.message+' Your result is not marked complete yet.';document.getElementById('retryFinish').classList.remove('hidden');document.getElementById('retryFinish').onclick=finish}}
function report(){return ['CONTEXT DETECTIVES | 8A ENGLISH','21 OCT 2026','Student: '+attempt.student_name,'School email: '+attempt.student_email,'Grade 8 · '+attempt.student_group,'Score: '+attempt.score+'/'+attempt.max_score+' · '+attempt.grade.toFixed(2)+'/10','Saved receipt: '+attempt.id,'Submit your screenshot to Algebraix.','',...attempt.tasks.map((a,i)=>'Decision '+(i+1)+': '+(a.correct?'correct':'incorrect')+' · '+(game.rounds[i]?.options[a.response]||'Saved response'))].join('\n')}
function finishScreen(){app.innerHTML=`<div class="card"><div class="eyebrow">Investigation complete · Result saved for Miss Martha</div><h1>Case closed.</h1><h2>${esc(attempt.student_name)}</h2><p><b>Grade 8 · ${esc(attempt.student_group)}</b><br>${esc(attempt.student_email)}</p><div class="score">${attempt.grade.toFixed(2)}<span style="font-size:28px"> / 10</span></div><p><b>${attempt.score} / ${attempt.max_score} decisions correct · ${Math.round(attempt.score/attempt.max_score*100)}%</b></p><div class="feedback"><b>Submit your screenshot to Algebraix.</b><p>Make sure your full name, school email, group, and grade are clearly visible.</p></div><p class="muted">✓ Result saved · Receipt ${esc(attempt.id)}<br>${esc(new Date(attempt.completed_at).toLocaleString('en-GB',{timeZone:'America/Mexico_City'}))} · Mexico City</p><div class="actions"><button id="download">Download my report</button><button onclick="window.print()">Print / Save PDF</button></div></div>`;document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='261021_8A_8th_English_Context_Detectives_Result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
intro();
</script></html>
