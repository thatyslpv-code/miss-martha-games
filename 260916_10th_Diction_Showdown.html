:root{color-scheme:dark;--lime:#d5ff65;--blue:#6c9dff;--purple:#a38bff;--coral:#ff937d;--muted:#bac3dc}*{box-sizing:border-box}body{margin:0;background:#0b1022;color:#f4f6ff;font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background-image:radial-gradient(ellipse at 85% 0%,#382665 0,transparent 48%),radial-gradient(ellipse at 0% 80%,#132953 0,transparent 45%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #596380;border-radius:14px;padding:12px 18px;background:#202b46;color:#fff;transition:transform .15s,background .15s}button:hover{background:#34466c;transform:translateY(-2px)}button:disabled{opacity:.45;cursor:default;transform:none}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.primary{background:var(--lime);color:#102017;border-color:var(--lime);font-weight:850}.primary:hover{background:#e2ff9a}.small{font-size:14px;padding:8px 12px}.wrap{max-width:1160px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:2px;font-size:14px}.mark{display:inline-grid;place-items:center;background:var(--lime);color:#152219;border-radius:9px;width:34px;height:34px;margin-right:9px;transform:rotate(-8deg)}nav,.actions{display:flex;gap:9px;flex-wrap:wrap}.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-weight:800}h1{font-size:clamp(42px,7vw,80px);line-height:1;letter-spacing:-3px;margin:20px 0}h2{font-size:clamp(26px,3vw,38px);line-height:1.15;letter-spacing:-1px}h3{margin:0 0 14px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:45px;align-items:center;padding:44px 0}.gradient{color:var(--purple)}.tag{display:inline-block;border:1px solid #637091;padding:5px 12px;border-radius:100px;font-size:13px;margin:4px}.panel{background:linear-gradient(145deg,#202a46eb,#131b31f5);border:1px solid #465071;border-radius:25px;padding:28px;box-shadow:0 16px 60px #0003}.phone{max-width:380px;margin:15px auto;transform:rotate(3deg);border:7px solid #596184;border-radius:38px;padding:20px;background:#10192d;position:relative}.phone:before{content:'';display:block;background:#050917;border-radius:10px;width:75px;height:8px;margin:0 auto 22px}.bubble{padding:15px;border-radius:20px 20px 20px 4px;background:#353465;margin:16px 0}.bubble.reply{background:var(--lime);color:#17220a;margin-left:35px;border-radius:20px 20px 4px 20px}.sticker{background:var(--coral);color:#201329;border-radius:12px;padding:8px 16px;position:absolute;right:-18px;bottom:-10px;font-weight:900;transform:rotate(-10deg)}label{display:block;margin:13px 0 6px;font-weight:650}input,select,textarea{width:100%;background:#0e162a;border:1px solid #7684a5;border-radius:12px;color:#fff;padding:13px}textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0 12px}.stat{padding:12px 16px;border:1px solid #495573;border-radius:16px;background:#121d33}.stat span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.stat strong{font-size:24px}.track{background:#343e58;border-radius:20px;height:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--lime));transition:width .4s}.stagebar{display:flex;justify-content:space-between;margin:24px 0 18px;align-items:center;gap:15px}.timer{font:800 27px ui-monospace,monospace;color:var(--lime)}.urgent{color:var(--coral)}.gamegrid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}.source{min-height:260px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.source:after{content:'Aa';position:absolute;bottom:-38px;right:0;font-weight:950;font-size:140px;opacity:.045;pointer-events:none}blockquote{font-size:clamp(23px,3vw,31px);font-weight:600;line-height:1.4;margin:22px 0}.options{display:grid;gap:11px}.option{text-align:left;display:flex;gap:15px;align-items:center;width:100%;min-height:65px;background:#18223b}.letter{flex-shrink:0;display:grid;place-items:center;border:1px solid #7784a9;border-radius:9px;width:32px;height:32px;color:var(--lime);font-weight:800}.feedback{border-left:5px solid var(--coral);margin-top:22px}.feedback.good{border-color:var(--lime)}.feedback p{margin:8px 0}.boss{display:flex;align-items:center;gap:16px;margin-bottom:24px;background:#2a1c44}.robot{width:75px;height:65px;flex-shrink:0}.center{text-align:center;max-width:790px;margin:45px auto}.big{font-size:70px;color:var(--lime);font-weight:900}.reviewcard{margin:18px 0}.note{font-size:14px;color:var(--muted)}.hidden{display:none!important}footer{font-size:12px;color:var(--muted);margin:35px 0 10px;display:flex;justify-content:space-between;gap:15px}.confetti{position:fixed;top:-20px;width:9px;height:16px;z-index:10;pointer-events:none;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(600deg)}}main{animation:enter .3s ease-out}@keyframes enter{from{opacity:.4;transform:translateY(8px)}}#printResult{display:none}.badge{display:inline-block;background:var(--lime);color:#152117;padding:12px 24px;border-radius:100px;font-weight:900}.reflection{margin-top:20px}.danger{color:#ffc3b7}details{margin:18px 0}summary{cursor:pointer;color:var(--lime)}@media(max-width:760px){.hero,.gamegrid{grid-template-columns:1fr}.hero{gap:15px;padding:25px 0}.hero .phone{display:none}.wrap{padding:18px}.panel{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.source{min-height:180px}.formgrid{grid-template-columns:1fr}h1{letter-spacing:-2px}nav{gap:5px}button.small{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}@media print{body{background:white;color:black}.wrap,.confetti{display:none!important}#printResult{display:block;font:18px/2 system-ui;padding:40px}}
</style></head><body><div class="wrap"><header><div class="brand"><span class="mark">D/</span>DICTION SHOWDOWN</div><nav id="controls"></nav></header><div id="hud"></div><main id="app"></main><footer><span>MISS MARTHA · ENGLISH LAB · 10A / 10B</span><span id="storage">Offline ready · Progress saves on this device</span></footer></div><div id="printResult"></div><script>
'use strict';
const QUESTIONS=[{"ctx": "School office · decision letter", "text": "We regret that we are unable to approve your request at this time.", "prompt": "Which register dominates this message?", "options": ["Formal", "Academic", "Neutral", "Informal"], "reasons": ["Conventional, respectful institutional wording establishes distance.", "There is no research, analysis, or subject-specific argument.", "“We regret” and “approve your request” create more institutional distance than a plain update.", "The wording avoids conversational familiarity."], "kind": "choice"}, {"ctx": "DM · teammate", "text": "I can send you my notes tonight if that helps.", "prompt": "This or That: which register best describes this friendly offer?", "options": ["Informal", "Formal"], "reasons": ["The direct personal offer sounds conversational; slang is not required for informal language.", "Politeness alone does not make language formal. This is a relaxed personal offer."], "kind": "binary"}, {"ctx": "School app · notification", "text": "The library closes at 4 p.m. on Fridays.", "prompt": "Which register best fits this factual notification?", "options": ["Neutral", "Formal", "Academic", "Informal"], "reasons": ["Plain, factual wording conveys information without marked familiarity or ceremony.", "An official source can use neutral language; there is no ceremonial wording here.", "A factual statement is not automatically academic analysis.", "The notification does not use conversational or personal wording."], "kind": "choice"}, {"ctx": "Gaming chat · reaction", "text": "That comeback was low-key iconic.", "prompt": "Which register is most distinctive here?", "options": ["Slang", "Neutral", "Formal", "Academic"], "reasons": ["“Low-key” and this use of “iconic” signal an in-group, trend-based evaluation.", "The wording evaluates the comeback through fashionable expressions.", "Trend-based expressions do not fit an institutional register.", "The sentence expresses a reaction rather than an analytical claim."], "kind": "choice"}, {"ctx": "Research feed · abstract", "text": "The findings suggest a correlation between sleep duration and recall accuracy.", "prompt": "Sort this excerpt into its dominant register. Drag the card, or tap a category.", "options": ["Academic", "Formal", "Neutral", "Informal"], "reasons": ["“Findings,” “correlation,” and cautious “suggest” support a precise research claim.", "It is formal in tone, but Academic is the more specific category for research analysis.", "The research vocabulary and analytical purpose make Academic more precise.", "The technical terms and impersonal analysis are not conversational."], "kind": "sort"}, {"ctx": "Agency dashboard · proposal review", "text": "This plan is kinda bad and hardly anyone is into it.", "prompt": "Choose a formal revision that preserves the criticism without exaggeration.", "options": ["The proposal has weaknesses and limited support.", "The proposal is unacceptable and has no support.", "The proposal is unusual and deserves further discussion.", "The proposal exhibits an undesirable existential predicament."], "reasons": ["It preserves both concerns without claiming complete rejection.", "“Unacceptable” and “no support” exaggerate the original.", "This removes the original criticism and limited support.", "Inflated vocabulary obscures the two concrete concerns."], "kind": "choice"}, {"ctx": "Student news · neutral report", "text": "The app ate my homework.", "prompt": "The upload failed; no file was submitted. Choose the clearest factual update.", "options": ["The homework file did not upload successfully.", "The app deleted my submitted homework file.", "A catastrophic system failure destroyed my work.", "The homework experienced a technological inconvenience."], "reasons": ["It describes the known outcome without guessing a cause.", "Deletion and successful submission have not been established.", "“Catastrophic” exaggerates and “destroyed” adds an unsupported claim.", "The euphemism hides the specific upload failure."], "kind": "choice"}, {"ctx": "Research poster · screen use", "text": "Everyone is glued to their phone.", "prompt": "Your survey found 68% of 50 respondents check phones hourly. Choose the academic version.", "options": ["In this survey, 68% of respondents reported checking their phones hourly.", "Most teenagers are addicted to checking their phones.", "In this survey, phone use caused poor concentration.", "Respondents frequently engaged with mobile technology."], "reasons": ["It retains the measured behavior and limits the claim to the sample.", "The sample does not establish addiction or represent all teenagers.", "No causal relationship or concentration measure was provided.", "This omits the measured frequency and proportion, reducing precision."], "kind": "choice"}, {"ctx": "Customer support · complaint", "text": "Your delivery service is a total joke.", "prompt": "The parcel arrived three days late. Request help firmly and respectfully.", "options": ["My parcel arrived three days late. Please explain what happened.", "Your team clearly does not care about customers.", "I humbly beg your forgiveness for mentioning a delay.", "The delivery was not ideal, but there is no need to respond."], "reasons": ["The specific delay and direct request make the complaint clear and respectful.", "It assumes motives and attacks the team.", "Excessive deference weakens a reasonable complaint.", "It removes the request for help and hides the extent of the delay."], "kind": "choice"}, {"ctx": "Club feed · caption rewrite", "text": "Our debate team absolutely cooked today.", "prompt": "Replace the slang for a general school audience while keeping the celebratory tone.", "options": ["Our debate team delivered an excellent performance today.", "Our debate team won every round today.", "Our debate team participated in an event today.", "Our debate team demonstrated operational superiority."], "reasons": ["It translates the praise clearly without inventing a result.", "Winning every round is not established by the original praise.", "This loses the celebratory meaning.", "Corporate jargon sounds unnatural for a school celebration."], "kind": "choice"}, {"ctx": "DM · close friend", "text": "You cannot attend your friend’s party because you have a family dinner.", "prompt": "Choose a warm, natural reply.", "options": ["I can’t make it—family dinner that night. Hope you have a great time!", "I regret to inform you that I must decline your invitation.", "Your party conflicts with an obligation of greater importance.", "I may attend, depending on other arrangements."], "reasons": ["A contraction, brief reason, and warm wish fit a close friendship.", "This is respectful but unnecessarily distant for a close friend.", "It implies the friend’s celebration matters less.", "It changes a definite inability into uncertainty."], "kind": "choice"}, {"ctx": "School email · extension", "text": "You need one extra day because your interview source rescheduled.", "prompt": "Ask your teacher respectfully without assuming approval.", "options": ["Could I submit on Friday? My interview source rescheduled, so I need one extra day.", "I will submit on Friday because my interview source rescheduled.", "Please move the deadline because the project is impossible.", "Might your esteemed self permit a temporal accommodation?"], "reasons": ["The request specifies the new date, reason, and amount of extra time.", "It announces a decision instead of asking for permission.", "It exaggerates and fails to specify the needed extension.", "Artificially elaborate language hides a simple request."], "kind": "choice"}, {"ctx": "Academic essay · evidence", "text": "A study found that students who slept longer tended to recall more words.", "prompt": "Choose the most precise interpretation.", "options": ["Longer sleep was associated with better recall in the study.", "Longer sleep guaranteed better recall for students.", "The study proved that sleep causes better memory.", "Sleep had a positive impact on every participant."], "reasons": ["“Associated” reports a relationship without asserting causation.", "“Guaranteed” makes an absolute claim unsupported by a tendency.", "An observed association alone does not prove causation.", "“Impact” implies causation and “every” adds an unsupported universal claim."], "kind": "choice"}, {"ctx": "College application · experience", "text": "You organized three club events and coordinated six volunteers.", "prompt": "Which version provides credible evidence of leadership?", "options": ["I coordinated six volunteers to organize three club events.", "I transformed the entire school through exceptional leadership.", "I was involved in various things with several people.", "I single-handedly organized three successful club events."], "reasons": ["Specific actions and numbers demonstrate leadership without exaggeration.", "This overstates the scope and supplies no concrete evidence.", "Vague nouns and a weak verb conceal the actual contribution.", "“Single-handedly” erases the volunteers’ contribution; success was not specified."], "kind": "choice"}, {"ctx": "Debate stage · disagreement", "text": "A classmate proposes banning all phones to reduce distraction.", "prompt": "Challenge the policy while respecting the speaker.", "options": ["The proposal addresses distraction, but a total ban may restrict useful learning tools.", "Only someone out of touch would propose a total ban.", "The proposal is perfect, although I completely oppose it.", "The proposal’s pedagogical modalities are intrinsically deficient."], "reasons": ["It recognizes the purpose and critiques the policy rather than the person.", "It attacks the speaker instead of assessing the policy.", "The praise contradicts the stated position rather than identifying a strength.", "Unnecessary abstraction makes the criticism hard to understand."], "kind": "choice"}, {"ctx": "Project update · weak wording", "text": "We did some stuff to make the website better.", "prompt": "Which revision removes vague words and weak verbs without inventing results? Known changes: menu simplified; broken links repaired.", "options": ["We simplified the menu and repaired broken links.", "We revolutionized the website and doubled engagement.", "We implemented multiple enhancements to several elements.", "We did website improvements to improve the website."], "reasons": ["Concrete verbs name the actual improvements.", "Neither a revolution nor doubled engagement is supported.", "“Multiple enhancements” and “several elements” remain vague.", "Repetition and “did” still obscure the specific work."], "kind": "choice"}, {"ctx": "Student newspaper · headline", "text": "Lazy students demand an easier timetable.", "prompt": "Which headline reports the request without judging motives?", "options": ["Students request changes to the timetable.", "Unmotivated students ask for timetable changes.", "Students bravely challenge a cruel timetable.", "Students demand fewer lessons to avoid hard work."], "reasons": ["It reports the action without assigning laziness or assuming the desired changes.", "“Unmotivated” still assigns a negative motive.", "“Bravely” and “cruel” introduce favorable and unfavorable bias.", "It invents a specific request and motive."], "kind": "choice"}, {"ctx": "Family text · arrival", "text": "Kindly apprise me of your estimated time of arrival at our residence.", "prompt": "Which rewrite best fits a quick text to your sibling?", "options": ["What time will you be home?", "Please furnish your anticipated residential arrival time.", "Why are you taking forever to get home?", "Confirm that you will arrive at six."], "reasons": ["Plain conversational wording is the most natural choice for the audience.", "The unnecessarily complicated vocabulary remains.", "It adds impatience and criticism absent from the original.", "It adds a time and changes a question into a demand."], "kind": "choice"}, {"ctx": "Company announcement · euphemism", "text": "We are rightsizing the team to unlock new efficiencies.", "prompt": "The company is eliminating 12 jobs. What is the clearest transparent revision?", "options": ["The company is eliminating 12 jobs.", "The company is optimizing its people footprint.", "The company is cruelly throwing everyone away.", "The company is making a few exciting personnel updates."], "reasons": ["Direct wording states the human consequence hidden by “rightsizing.”", "Another euphemism conceals the job losses.", "Loaded wording and “everyone” exaggerate the facts.", "Positive framing minimizes the impact and omits the number."], "kind": "choice"}, {"ctx": "Feedback chat · connotation", "text": "Your solution is ambitious. Your solution is unrealistic.", "prompt": "What changes when “ambitious” becomes “unrealistic”?", "options": ["The tone shifts from potentially admiring to doubtful about feasibility.", "The second version gives a more precise numerical estimate.", "Both versions praise the solution equally.", "The second version becomes slang because it is critical."], "reasons": ["“Ambitious” can praise aspiration; “unrealistic” questions whether it can work.", "Neither adjective supplies a measurement.", "“Unrealistic” carries a negative judgment about feasibility.", "Criticism does not make a word slang."], "kind": "choice"}, {"ctx": "BOSS · school email", "text": "Your grade appears as 72, but the rubric totals 82. You want the teacher to check.", "prompt": "Choose the most appropriate subject and opening.", "options": ["Subject: Question about rubric total. Could you check my score? I calculate 82, but the portal shows 72.", "Subject: Incorrect grade. You entered my grade wrong; change it to 82.", "Subject: Grade concern. I am disappointed and deserve a better score.", "Subject: Academic injustice. The portal has seriously misrepresented my achievement."], "reasons": ["It gives verifiable information, allows for a mistake, and requests a check respectfully.", "It assumes fault and demands a correction before verification.", "It is polite in form but substitutes feelings for the specific discrepancy.", "Loaded language escalates a potentially simple arithmetic or entry issue."], "kind": "choice"}, {"ctx": "BOSS · social feed", "text": "Your club collected 120 books. Caption for classmates: upbeat, inclusive, accurate.", "prompt": "Which caption fits all three requirements?", "options": ["120 books collected—thanks to everyone who pitched in!", "Our superior generosity has transformed literacy worldwide.", "The collection of 120 literary units was duly accomplished.", "120 books collected—unlike the clubs that did nothing."], "reasons": ["The informal phrase invites belonging while preserving the exact result.", "It is self-congratulatory and claims unsupported global impact.", "Accurate but stiff and impersonal for classmates.", "The total is accurate, but the comparison excludes and criticizes others."], "kind": "choice"}, {"ctx": "BOSS · academic excerpt", "text": "A voluntary survey of 40 students found 26 preferred recorded feedback.", "prompt": "Select the strongest claim the evidence supports.", "options": ["In this voluntary sample, 65% preferred recorded feedback.", "Recorded feedback improves learning for 65% of students.", "Most students at the school prefer recorded feedback.", "The results prove that written feedback is ineffective."], "reasons": ["26 of 40 is 65%; the wording acknowledges the sample rather than generalizing.", "Preference does not measure improvement in learning.", "A small voluntary sample may not represent the school.", "Neither effectiveness nor a definitive comparison was established."], "kind": "choice"}, {"ctx": "BOSS · recommendation", "text": "A referee describes you as “persistent,” then changes it to “stubborn.”", "prompt": "How is the admissions reader likely to interpret the change?", "options": ["Determination now sounds like unwillingness to reconsider.", "The change strengthens praise for your adaptability.", "The meaning is unchanged because both mean continuing.", "The revised word provides proof of poor academic performance."], "reasons": ["Both suggest continuing, but “stubborn” often implies inflexibility.", "“Stubborn” suggests the opposite of adaptability.", "Shared basic meaning does not erase different connotations.", "An attitude description does not establish academic results."], "kind": "choice"}, {"ctx": "BOSS · two plausible replies", "text": "A teammate privately says: “I’m overwhelmed. Could you take my slides?” You can review them tonight, but cannot create them.", "prompt": "Choose a supportive reply that preserves your actual boundary.", "options": ["That sounds stressful. I can review your draft tonight, but I can’t make the slides for you.", "I understand. I can help with your slides tonight.", "I can review your draft tonight if you stop overreacting.", "Please be advised that slide production falls outside my responsibilities."], "reasons": ["It acknowledges the feeling and offers exactly the help available without promising more.", "Kind and plausible, but “help” is ambiguous and may imply taking over.", "The boundary is clear, but the judgment dismisses the teammate’s feelings.", "Clear refusal, but cold and overly formal for a private peer conversation."], "kind": "choice"}];
const STAGES=['Register Radar','Meme Translator','Rewrite Lab','Diction Detective','The Diction Destroyer'];
const TIMES=[300,360,360,360,420], KEY='diction-showdown-260916-v1';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=null,paused=false,resumeMode=null,audioCtx=null,last=performance.now(),noteStep=0;
try{s=JSON.parse(localStorage.getItem(KEY));if(s?.version!==1)s=null}catch(e){}
function save(){try{if(s)localStorage.setItem(KEY,JSON.stringify(s.mode==='resume'?{...s,mode:resumeMode||'intro'}:s));else localStorage.removeItem(KEY)}catch(e){$('storage').textContent='Saving unavailable in this browser · Keep this tab open';}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orders(){let p;do{p=shuffle(Array.from({length:24},(_,i)=>i%4))}while(p.some((x,i)=>i>1&&x===p[i-1]&&x===p[i-2]));let j=0;const result=QUESTIONS.map(q=>{const pos=q.options.length===2?Math.floor(Math.random()*2):p[j++];const a=shuffle(q.options.map((_,i)=>i).slice(1));a.splice(pos,0,0);return a});const positions=result.map(a=>a.indexOf(0));return positions.some((x,i)=>i>1&&x===positions[i-1]&&x===positions[i-2])?orders():result}
function fresh(name,group){return {version:1,name,group,stage:0,index:0,mode:'intro',remaining:TIMES[0],answers:[],mistakes:[],bonuses:[],order:orders(),tries:0,wrong:[],feedback:null,totalAttempts:0,elapsed:0,retries:0,sound:true,music:false,reflections:{},secret:{},secretDone:false,date:null,warned:false}}
function initAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function tone(freq,duration=.12,vol=.045,offset=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+offset;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}
function sound(kind){if(!s?.sound)return;const notes={correct:[660,880],wrong:[220,180],round:[523,659,784],hit:[110,440,880],victory:[523,659,784,1047],warning:[330,330]};(notes[kind]||[]).forEach((f,i)=>tone(f,.16,.045,i*.12))}
setInterval(()=>{if(s?.music&&!paused&&s.mode==='play'&&audioCtx){const notes=[130.81,196,261.63,196,146.83,220,293.66,220];tone(notes[noteStep++%8],.38,.018)}},430);
function score(){return s.answers.reduce((a,b)=>a+(b?.points||0),0)+s.bonuses.reduce((a,b)=>a+(b||0),0)}
function completed(){return s.answers.filter(Boolean).length}
function correct(){return s.answers.filter(a=>a?.correct).length}
function percentage(){return Math.round(correct()/25*100)}
function level(){const p=percentage();return p>=96?'Boardroom Legend':p>=84?'Diction Master':p>=68?'Language Strategist':p>=48?'Register Detective':'Diction Rookie'}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function btn(label,act,cls=''){return `<button type="button" class="${cls}" data-action="${act}">${label}</button>`}
function confetti(){for(let i=0;i<36;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=['#d5ff65','#a38bff','#ff937d','#6c9dff'][i%4];e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}}
function render(){last=performance.now();$('controls').innerHTML=s?btn('Sound '+(s.sound?'On':'Off'),'sound','small')+btn('Music '+(s.music?'On':'Off'),'music','small')+(['play','feedback'].includes(s.mode)?btn(paused?'Resume':'Pause','pause','small')+btn('Restart Round','restart','small'):'')+btn('Start Over','erase','small'):'';
$('hud').innerHTML=s?`<div class="stats"><div class="stat"><span>Score</span><strong>${score()}</strong></div><div class="stat"><span>Progress</span><strong>${completed()*4}%</strong></div><div class="stat"><span>Challenges completed</span><strong>${completed()} / 25</strong></div><div class="stat"><span>${s.mode==='final'?'Final':'Overall'} accuracy</span><strong>${percentage()}%</strong></div></div><div class="track" role="progressbar" aria-label="Game progress" aria-valuenow="${completed()*4}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${completed()*4}%"></div></div>`:'';
if(!s){landing();return}if(paused){$('app').innerHTML=`<section class="panel center"><p class="eyebrow">Time to breathe</p><h2>Showdown paused</h2><p>Your timer is paused. Ready when you are.</p>${btn('Resume','pause','primary')}</section>`;return}
if(s.mode==='resume'){ $('app').innerHTML=`<section class="panel center"><h2>Welcome back, ${esc(s.name)}.</h2><p>${esc(s.group)} · Round ${s.stage+1} · ${fmt(s.remaining)} remaining</p><p>Your progress is saved. Audio begins when you resume.</p>${btn('Resume Showdown','resume','primary')}</section>`;return}
if(s.mode==='intro'){intro();return}if(['play','feedback'].includes(s.mode)){play();return}if(s.mode==='timeout'){ $('app').innerHTML=`<section class="panel center"><p class="eyebrow">Round ${s.stage+1}</p><h2>Time’s up for this round!</h2><p>${s.answers.slice(s.stage*5,s.stage*5+5).filter(Boolean).length} of 5 challenges completed.</p><p>Retry as often as you need. Earlier rounds stay saved. This round’s points and answers will reset.</p>${btn('Retry This Round','retry','primary')}</section>`;return}if(s.mode==='round'){roundEnd();return}if(s.mode==='final'){final();return}if(s.mode==='review'){review();return}if(s.mode==='secret'){secret();return}}
function landing(){$('app').innerHTML=`<section class="hero"><div><p class="eyebrow">25 challenges. Five rounds. Your words matter.</p><h1>DICTION<br><span class="gradient">SHOWDOWN</span></h1><h2>From Group Chat to Boardroom</h2><p class="muted">Your language is about to leave the group chat and enter the real world. Choose your words carefully. Audience, purpose, and tone change everything.</p><span class="tag">35–40 MIN CLASS MISSION</span><span class="tag">NO LIVES · UNLIMITED ROUND RETRIES</span></div><div class="phone" aria-hidden="true"><span class="eyebrow">THE REGISTER SWITCH</span><div class="bubble">this idea kinda ate</div><div class="bubble reply">The proposal is compelling.</div><div class="bubble">Same reaction.<br>Different audience.</div><div class="sticker">CONTEXT IS EVERYTHING</div></div></section><section class="panel"><h3>Claim your player card</h3><form id="startForm"><div class="formgrid"><div><label for="name">Student name</label><input id="name" required maxlength="70" autocomplete="name" placeholder="Your name"></div><div><label for="group">Group</label><select id="group" required><option value="">Select group</option><option>10A</option><option>10B</option></select></div></div><p class="note">Read, compare, then choose. Spend 30–45 seconds explaining each round’s key decision in the reflection box. Timers allow 30 minutes of active play; feedback and reflections pause the clock.</p><button class="primary" type="submit">START THE SHOWDOWN</button></form><details><summary>How scoring and saving work</summary><p>First attempt: 100 points. Second attempt: 60. Round completed: 50. Time bonus: 1 point per 10 whole seconds remaining. Boss defeated: 150 if all five final answers are solved. Accuracy = challenges solved on either attempt ÷ 25; failed round attempts are replaced on retry. Total attempts and active time include retries. No speed penalty for reading feedback.</p><p>Progress stays in this browser on this device; results are not sent to your teacher automatically. Complete the game, then submit a screenshot.</p></details></section>`;$('startForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name){$('name').setCustomValidity('Please enter your name.');$('name').reportValidity();return}s=fresh(name,$('group').value);initAudio();save();render()};$('name').oninput=()=> $('name').setCustomValidity('')}
const tips=['Formal and academic can overlap. Choose the most specific register. Polite does not always mean formal.','Translate the meaning, not just the vocabulary. Do not add claims that the source never made.','Who is reading? What do you need them to understand or do? Match your words to that situation.','Notice what the words hide, exaggerate, repeat, or imply. Clear language can be informal.','The opponent uses plausible answers. Check every condition: audience, accuracy, purpose, tone, and meaning.'];
function intro(){$('app').innerHTML=`<section class="panel center"><p class="eyebrow">Round 0${s.stage+1} / 05</p><h2>${STAGES[s.stage]}</h2><p>${tips[s.stage]}</p><div class="big">${TIMES[s.stage]/60}:00</div><p>5 challenges · Two attempts per challenge<br>Feedback pauses the clock. Your best tool is careful reading.</p>${btn('Enter Round','enter','primary')}</section>`}
function robot(){return `<svg class="robot" viewBox="0 0 100 90" aria-label="Digital opponent" role="img"><path d="M20 20L12 6M80 20L88 6" stroke="#d5ff65" stroke-width="6"/><rect x="8" y="20" width="84" height="62" rx="18" fill="#a38bff"/><rect x="18" y="32" width="64" height="29" rx="8" fill="#10152d"/><path d="M27 44h16m14 0h16M35 70h30" stroke="#d5ff65" stroke-width="6"/></svg>`}
function play(){const q=QUESTIONS[s.index];const bossHits=s.answers.slice(20,25).filter(a=>a?.correct).length;$('app').innerHTML=`<div class="stagebar"><div><span class="eyebrow">Round ${s.stage+1} / 5</span><h2 style="margin:4px 0">${STAGES[s.stage]}</h2></div><div><span class="note">${s.mode==='feedback'?'TIMER PAUSED':'ROUND TIMER'}</span><div class="timer ${s.remaining<=60?'urgent':''}" id="timer" aria-label="Time remaining">${fmt(Math.ceil(s.remaining))}</div></div></div>${s.stage===4?`<div class="panel boss">${robot()}<div style="flex:1"><b>THE DICTION DESTROYER</b><p class="note">Energy: ${100-bossHits*20}% · Each solved challenge deals 20 damage.</p><div class="track"><div class="fill" style="width:${100-bossHits*20}%"></div></div></div></div>`:''}<div class="gamegrid"><section class="panel source"><div><span class="eyebrow">${esc(q.ctx)}</span><blockquote ${q.kind==='sort'?'draggable="true" id="dragcard" tabindex="0" aria-label="Drag this excerpt to a register, or choose a category button"':''}>${esc(q.text)}</blockquote></div><span class="note">CHALLENGE ${s.index+1} / 25 · ${q.kind==='binary'?'THIS OR THAT':q.kind==='sort'?'DRAG OR TAP TO SORT':'READ THE CONTEXT'}</span></section><section><h3>${esc(q.prompt)}</h3><div class="options">${s.order[s.index].map((id,i)=>`<button class="option" data-choice="${id}" ${s.mode==='feedback'||s.wrong.includes(id)?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(q.options[id])}</span></button>`).join('')}</div><p class="note">Attempt ${Math.min(s.tries+1,2)} of 2 · ${q.kind==='sort'?'Drag the excerpt onto a category, or use the buttons.':'Use the buttons or press A–'+(q.kind==='binary'?'B':'D')+'.'}</p></section></div>${s.mode==='feedback'?`<section class="panel feedback ${s.feedback.ok?'good':''}" aria-live="polite"><h3>${s.feedback.ok?'Well chosen.':s.tries===1?'Not quite. Recheck the context.':'Two attempts used. Let’s unpack it.'}</h3><p><b>Your choice:</b> ${esc(q.options[s.feedback.id])}</p><p>${esc(q.reasons[s.feedback.id])}</p>${s.feedback.ok||s.tries===2?`<p><b>Best answer:</b> ${esc(q.options[0])}</p><p>${esc(q.reasons[0])}</p>`:''}${btn(s.feedback.ok||s.tries===2?'Continue':'Try Again',s.feedback.ok||s.tries===2?'next':'again','primary')}</section>`:''}`;
if(q.kind==='sort'&&s.mode==='play'){const card=$('dragcard');card.ondragstart=e=>e.dataTransfer.setData('text/plain','excerpt');document.querySelectorAll('[data-choice]').forEach(b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();if(e.dataTransfer.getData('text/plain')==='excerpt')answer(+b.dataset.choice)}})}}
function answer(id){if(paused||s.mode!=='play'||s.wrong.includes(id))return;s.tries++;s.totalAttempts++;const ok=id===0;if(!ok){s.wrong.push(id);s.mistakes.push({index:s.index,id})}s.feedback={id,ok};if(ok||s.tries===2)s.answers[s.index]={correct:ok,points:ok?(s.tries===1?100:60):0,attempts:s.tries};s.mode='feedback';sound(ok?(s.stage===4?'hit':'correct'):'wrong');save();render()}
function finishRound(){const hits=s.answers.slice(20,25).filter(a=>a?.correct).length;s.bonuses[s.stage]=50+Math.floor(s.remaining/10)+(s.stage===4&&hits===5?150:0);s.mode='round';sound('round');confetti();save();render()}
function roundEnd(){$('app').innerHTML=`<section class="panel center"><p class="eyebrow">Round ${s.stage+1} complete · Clock paused</p><h2>${s.stage===4?(s.answers.slice(20).every(a=>a.correct)?'Destroyer defeated!':'You completed the showdown!'):'Register upgraded.'}</h2><p>${s.answers.slice(s.stage*5,s.stage*5+5).filter(a=>a.correct).length} / 5 solved · ${s.bonuses[s.stage]} bonus points</p><label for="reflection">30–45 second debrief</label><p class="muted">Which two choices were hardest to separate? Explain how audience, tone, or precision helped you decide.</p><textarea id="reflection" placeholder="I chose … instead of … because …">${esc(s.reflections[s.stage]||'')}</textarea><p class="note">Use this pause to explain your reasoning to a partner or write it here. No timer is running.</p>${btn(s.stage===4?'See My Results':'Continue', 'advance','primary')}</section>`;$('reflection').oninput=e=>{s.reflections[s.stage]=e.target.value;save()}}
function resetRound(){s.answers=s.answers.slice(0,s.stage*5);s.mistakes=s.mistakes.filter(m=>m.index<s.stage*5);s.bonuses=s.bonuses.slice(0,s.stage);delete s.reflections[s.stage];s.index=s.stage*5;s.remaining=TIMES[s.stage];s.tries=0;s.wrong=[];s.feedback=null;s.warned=false;s.mode='intro';s.retries++;paused=false;save();render()}
function final(){const msg=percentage()>=84?'You read beyond the vocabulary and made words work for their audience.':percentage()>=60?'You are building a strong eye for context. Review the close calls to sharpen your next choices.':'You completed the challenge. Review the explanations, then try again with audience and purpose in mind.';$('app').innerHTML=`<section class="panel center"><p class="eyebrow">Player result · ${esc(s.date)}</p><h2>${esc(s.name)} · ${esc(s.group)}</h2><div class="big">${percentage()}%</div><div class="badge">${level()}</div><p>${esc(s.name)}, ${msg}</p><div class="stats"><div class="stat"><span>Final score</span><strong>${score()}</strong></div><div class="stat"><span>Correct answers</span><strong>${correct()} / 25</strong></div><div class="stat"><span>Total attempts</span><strong>${s.totalAttempts}</strong></div><div class="stat"><span>Active time used</span><strong>${fmt(s.elapsed)}</strong></div></div><p class="note">Accuracy counts answers solved on either attempt in retained rounds. Attempts and active time include ${s.retries} round restarts. Reading and pause time excluded.</p><p><b>Take a screenshot of this screen and submit it as evidence.</b></p><div class="actions">${btn('Review Mistakes','review')}${btn('Print or Save Result','print')}${btn('Play Again','playagain')}</div></section><section class="panel center"><span class="eyebrow">Unlocked · Fast finisher</span><h2>SECRET LEVEL: THE TONE SWITCH</h2><p>Three situations. Three registers each. One new badge.</p>${s.secretDone?'<p class="badge">TONE SHIFTER</p>':''}${btn(s.secretDone?'Revisit Secret Level':'Enter Secret Level','secret','primary')}</section>`;$('printResult').innerHTML=`<p>Student name: ${esc(s.name)}<br>Group: ${esc(s.group)}<br>Date: ${esc(s.date)}<br>Score: ${score()}<br>Percentage: ${percentage()}%<br>Performance level: ${level()}</p>`}
function review(){const ids=[...new Set(s.mistakes.map(m=>m.index))];$('app').innerHTML=`<section><h2>Review Mistakes</h2><p class="muted">Includes first-attempt mistakes you later corrected in retained rounds.</p>${ids.length?ids.map(i=>`<article class="panel reviewcard"><span class="eyebrow">Challenge ${i+1} · ${esc(QUESTIONS[i].ctx)}</span><h3>${esc(QUESTIONS[i].prompt)}</h3><p>${esc(QUESTIONS[i].text)}</p>${s.mistakes.filter(m=>m.index===i).map(m=>`<p><b>Your answer:</b> ${esc(QUESTIONS[i].options[m.id])}<br>${esc(QUESTIONS[i].reasons[m.id])}</p>`).join('')}<p><b>Correct answer:</b> ${esc(QUESTIONS[i].options[0])}<br>${esc(QUESTIONS[i].reasons[0])}</p></article>`).join(''):'<p>No mistakes in your completed rounds. Excellent context reading!</p>'}${btn('Back to Results','results','primary')}</section>`}
const SECRET=[{title:'The group project needs one more day.',rows:[['Could we submit the project one day later?','Formal'],['We need an extra day to finish the project.','Neutral'],['Can we get another day? We’re not quite done.','Informal']]},{title:'The club’s stream starts at six.',rows:[['We invite you to join the club’s livestream at 6 p.m.','Formal'],['We’re going live at six—come hang out!','Informal'],['The club’s livestream begins at 6 p.m.','Neutral']]},{title:'A small survey suggests students prefer shorter videos.',rows:[['In this sample, respondents tended to prefer shorter videos.','Academic'],['Looks like people in our survey liked the shorter clips more.','Informal'],['Students in the survey generally preferred shorter videos.','Neutral']]}];
function secret(){let n=0;$('app').innerHTML=`<h2>SECRET LEVEL: THE TONE SWITCH</h2><p class="muted">Identify all three versions of each idea. Compare wording, not just length. Your main score stays unchanged.</p><form id="secretForm">${SECRET.map((v,j)=>`<section class="panel reviewcard"><h3>${j+1}. ${v.title}</h3>${v.rows.map(([text,reg])=>{const k=n++;return `<label for="secret${k}">${esc(text)}</label><select id="secret${k}" data-secret="${k}" required><option value="">Select register</option>${['Informal','Neutral',j===2?'Academic':'Formal'].map(x=>`<option ${s.secret[k]===x?'selected':''}>${x}</option>`).join('')}</select>`}).join('')}</section>`).join('')}<div class="actions"><button class="primary">Check Tone Switch</button>${btn('Back to Results','results')}</div><div id="secretFeedback" aria-live="polite"></div></form>`;document.querySelectorAll('[data-secret]').forEach(el=>el.onchange=()=>{s.secret[el.dataset.secret]=el.value;save()});$('secretForm').onsubmit=e=>{e.preventDefault();const expected=SECRET.flatMap(x=>x.rows.map(r=>r[1]));const right=expected.filter((x,i)=>s.secret[i]===x).length;if(right===9){s.secretDone=true;sound('victory');confetti();$('secretFeedback').innerHTML='<p class="badge">TONE SHIFTER</p><p>9 / 9! You matched all three tones without changing the central ideas.</p>';save()}else{$('secretFeedback').innerHTML=`<p>${right} / 9 correct. Try again: informal versions sound conversational; neutral versions state the facts plainly; formal versions make respectful requests or invitations. Academic wording limits a claim to the evidence.</p>`}}}
document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){answer(+choice.dataset.choice);return}const b=e.target.closest('[data-action]');if(!b||!s)return;const a=b.dataset.action;if(a==='sound'||a==='music'){initAudio();s[a]=!s[a];save();render();return}if(a==='pause'){paused=!paused;save();render();return}if(a==='erase'){if(confirm('Erase all saved progress and begin again?')){s=null;paused=false;save();render()}return}if(a==='resume'){initAudio();s.mode=resumeMode||'intro';resumeMode=null;save();render();return}if(a==='enter'){initAudio();s.mode='play'}if(a==='restart'){if(!confirm('Restart only this round? Its answers and points will reset.'))return;resetRound();return}if(a==='retry'){resetRound();return}if(a==='again'){s.mode='play';s.feedback=null}if(a==='next'){s.tries=0;s.wrong=[];s.feedback=null;if(s.index%5===4){finishRound();return}s.index++;s.mode='play'}if(a==='advance'){if(s.stage===4){s.mode='final';s.date=new Date().toLocaleDateString('en-GB');sound('victory');confetti()}else{s.stage++;s.index=s.stage*5;s.remaining=TIMES[s.stage];s.warned=false;s.mode='intro'}}if(a==='review')s.mode='review';if(a==='results')s.mode='final';if(a==='secret')s.mode='secret';if(a==='print'){window.print();return}if(a==='playagain'){if(!confirm('Start a new game? Save your result first.'))return;s=fresh(s.name,s.group);paused=false}save();render();window.scrollTo({top:0,behavior:'smooth'})});
document.addEventListener('keydown',e=>{if(!s||s.mode!=='play'||paused||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const i=e.key.toUpperCase().charCodeAt(0)-65;if(e.key.length===1&&i>=0&&i<s.order[s.index].length){e.preventDefault();answer(s.order[s.index][i])}});
setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(!s||s.mode!=='play'||paused)return;s.remaining=Math.max(0,s.remaining-dt);s.elapsed+=dt;if(s.remaining<=30&&!s.warned){s.warned=true;sound('warning')}if(s.remaining===0){s.mode='timeout';save();render();return}const t=$('timer');if(t){t.textContent=fmt(Math.ceil(s.remaining));t.classList.toggle('urgent',s.remaining<=60)}save()},250);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&['play','feedback'].includes(s.mode)){paused=true;save();render()}});
window.addEventListener('beforeunload',save);
if(s){resumeMode=s.mode==='resume'?'intro':s.mode;s.mode='resume'}render();
</script></body></html>
