const CASES=[{"title": "The Missing Actor", "brief": "Goal: safe drinking water in two schools. Resources: a district water team, school staff and an existing maintenance fund. Limits: recommend local action; no new national authority.", "broken": "Encourages everyone to improve drinking-water safety in two schools through monthly tap inspections, with inspection logs reviewed each month.", "good": ["Encourages the district water team, working with school leaders,", "to improve drinking-water safety in the two participating schools", "through monthly tap inspections and repairs funded by the existing maintenance fund,", "with school leaders reviewing inspection logs and unresolved faults each month."], "bad": ["Encourages everyone who cares about education,", "to support healthier school communities", "through a future partnership whose tasks will be decided later,", "with schools counting views of their water-awareness posts."], "why": ["The district water team and school leaders have a specific local responsibility. \u201cEveryone\u201d leaves responsibility unclear.", "Drinking-water safety in two schools matches the brief; general community health does not define this action.", "Inspections and funded repairs use the stated team and fund; an undefined partnership cannot deliver them.", "Logs and unresolved faults track delivery and needed repairs; views do not establish safer water."], "hints": ["Find an actor able to inspect and repair local water facilities.", "Use the existing maintenance fund and track faults, not publicity."], "start": ["b0", "g1", "g2", "g3"], "mode": "Remove the vague actor, then replace it. Check the other components too."}, {"title": "The Vague Action", "brief": "Goal: learning materials for 60 learners in three classes. Resources: 60 reusable reading packs, class teachers and one distribution day. Limits: no funding for devices or extra packs.", "broken": "Recommends class teachers to help students through a one-day distribution of available reading packs, with a register of packs received.", "good": ["Recommends that teachers in the three participating classes", "distribute one reusable reading pack to each of the 60 learners", "through the planned distribution day using the 60 available packs,", "and record packs received and any missing deliveries in a class register."], "bad": ["Recommends that education supporters across the country", "help students achieve a better future", "through purchasing tablets for all participating learners,", "and record how many promotional leaflets teachers hand out."], "why": ["The three class teachers match the defined delivery team; national supporters are not assigned a role.", "One pack per learner states a deliverable and quantity; \u201chelp students\u201d does not.", "The existing packs and distribution day are funded; tablets are not.", "Receipt records show delivery gaps; promotional leaflets are a different output."], "hints": ["Replace \u201chelp students\u201d with a measurable delivery to the 60 learners.", "Match 60 packs to 60 learners without adding new purchases."], "start": ["g0", "b1", "g2", "g3"], "mode": "Remove and replace the vague action; preserve the feasible components."}, {"title": "The Delivery Gap", "brief": "Goal: reading practice for 20 learners over six weeks. Resources: two teachers, a classroom, reusable texts and two 20-minute periods each week. Limits: no new staff, transport or paid platform.", "broken": "Encourages the two participating teachers to provide six weeks of reading practice for 20 learners by developing a delivery method later, with weekly attendance and session records.", "good": ["Encourages the two participating teachers", "to provide six weeks of reading practice for the 20 learners", "through two 20-minute classroom sessions each week using reusable texts,", "with teachers recording weekly attendance and sessions delivered."], "bad": ["Encourages interested volunteer groups not yet contacted", "to improve literacy for all learners in the district", "through a delivery plan to be developed after the programme starts,", "with teachers reporting the number of school newsletter subscribers."], "why": ["The available teachers can coordinate the sessions; uncontacted groups are not secured resources.", "Twenty learners and six weeks match the available capacity; a district-wide commitment does not.", "Frequency, location and materials make the method usable now; a future plan leaves the gap unresolved.", "Attendance and delivered sessions track implementation, without claiming to prove reading gains; subscribers do not."], "hints": ["Your method needs a schedule and materials already available.", "Two weekly periods are available; do not assume new staff or a platform."], "start": ["g0", "g1", "b2", "g3"], "mode": "Supply the missing delivery method, then classify all four cards in the workbench."}, {"title": "The Invisible Progress", "brief": "Goal: reduce mixed classroom waste in four classrooms during a four-week pilot. Resources: labelled sorting bins, a shared scale and a student eco-team supervised by teachers. Limits: no impact claim based on publicity alone.", "broken": "Encourages the supervised student eco-team to run a four-week sorting pilot in four classrooms using labelled bins, with success measured by likes on campaign posts.", "good": ["Encourages the teacher-supervised student eco-team", "to run a four-week waste-sorting pilot in the four classrooms", "using the available labelled bins and short in-class sorting demonstrations,", "with the team weighing mixed waste before the pilot and weekly, and logging sorting errors for teacher review."], "bad": ["Encourages all visitors to the school", "to make the entire community waste-free", "using collection services whose availability has not been confirmed,", "with success measured by likes and shares on campaign posts."], "why": ["The supervised eco-team is the assigned team; visitors have no defined responsibility.", "A four-classroom pilot fits the resources; a waste-free community exceeds the scope.", "Existing bins and demonstrations give a feasible sorting method; unconfirmed services are not secured.", "Baseline and weekly weights plus sorting-error logs inform progress; likes measure attention. These measures alone do not prove the pilot caused every change."], "hints": ["Compare mixed-waste measurements over time using the shared scale.", "An audience count is not evidence that classroom waste decreased."], "start": ["g0", "g1", "g2", "b3"], "mode": "Remove the publicity metric and install useful follow-up."}, {"title": "The Mandate Overreach", "brief": "Mandate: this advisory education committee may recommend voluntary cooperation to district school boards. Goal: share inclusive-teaching resources. Resources: an existing monthly board meeting and a free shared folder. Limits: it cannot command governments, legislate or impose penalties.", "broken": "Orders district school boards to share inclusive-teaching resources through monthly meetings and a shared folder, with a quarterly participation summary.", "good": ["Recommends that district school boards voluntarily", "share inclusive-teaching resources among participating schools", "through existing monthly board meetings and the free shared folder,", "with participating boards preparing a quarterly summary of resources shared and schools taking part."], "bad": ["Orders district school boards, under threat of committee penalties,", "adopt a legally binding national teaching law", "through creating a new inspection agency with compulsory enforcement powers,", "with the committee fining boards that submit no quarterly report."], "why": ["A voluntary recommendation respects the advisory mandate; the committee has no power to order or penalize.", "Sharing resources fits the stated goal; passing national law exceeds the mandate.", "Meetings and a free folder use available resources; an enforcement agency does not.", "A participation summary supports voluntary review; committee fines exceed its powers. Recommendations are not automatically binding orders."], "hints": ["Read the mandate: advisory and voluntary are the decisive limits.", "Check follow-up too: a report is appropriate; a fine is not."], "start": ["b0", "b1", "b2", "b3"], "mode": "Dismantle the overreach. Rebuild a recommendation without enforcement powers."}, {"title": "The Impossible Promise", "brief": "Goal: test school-breakfast delivery. Resources: a simulated grant of 1,200 budget units and a school kitchen with existing staff. Approved costing: 2 units per meal, up to 20 learners, 5 mornings weekly for 6 weeks = 600 meals. Limits: no extra staff or funding; no promise to eliminate hunger.", "broken": "Encourages the school nutrition team to end child hunger worldwide immediately through the school kitchen and a 1,200-unit grant, with publicity reports.", "good": ["Encourages the school nutrition team, working with the school leader,", "to pilot breakfast for 20 learners, five mornings weekly for six weeks,", "using the existing staffed kitchen and the 1,200-unit grant for 600 meals at 2 units each,", "with weekly logs of meals served, spending and delivery issues reviewed by the school leader."], "bad": ["Encourages international partners whose participation is unconfirmed", "to provide breakfast for 40 learners, five mornings weekly for six weeks,", "using the 1,200-unit grant for 1,200 meals at the approved 2-unit meal cost,", "with promotional coverage treated as proof that hunger has ended."], "why": ["The existing school team has an assigned delivery role; unconfirmed partners cannot be assumed.", "20 \u00d7 5 \u00d7 6 = 600 meals; doubling learners requires 1,200 meals, beyond the grant.", "600 \u00d7 2 = 1,200 units. The alternative costs 2,400 units and cannot fit the grant.", "Meal and spending logs monitor delivery and budget; coverage cannot prove hunger is eliminated."], "hints": ["Calculate learners \u00d7 mornings \u00d7 weeks before checking.", "Use the fixed meal cost of 2 units; the total budget is 1,200."], "start": ["g0", "b1", "b2", "b3"], "mode": "Replace the inflated scope, repair the budget and add meaningful follow-up."}, {"title": "The Broken Clause", "brief": "Goal: weekly learning access for 30 learners over four weeks. Resources: printed packs, one weekly school collection point and teachers available to review returned work. Limits: home internet is unreliable; no device purchases or daily travel.", "broken": "with teachers reviewing work each week / through daily live video lessons / Encourages the participating teachers / to provide four weeks of weekly learning activities for 30 learners", "good": ["Encourages the participating teachers", "to provide four weeks of weekly learning activities for the 30 learners", "through printed packs collected and returned at the school once each week,", "with teachers logging packs collected, reviewing returned work weekly and recording learners needing support."], "bad": ["Encourages online content providers without a local coordinator", "to offer daily live online lessons to all learners", "through compulsory daily video calls requiring stable home internet,", "with progress measured only by the number of accounts registered online."], "why": ["The participating teachers are available and locally responsible; uncoordinated providers are not.", "The defined 30-learner, four-week activity fits the goal; live daily online lessons do not fit access limits.", "Weekly printed packs work with unreliable internet and the collection schedule; compulsory video does not.", "Collection logs and returned work reveal access and support needs; account registrations alone do not."], "hints": ["Order the sentence: actor, action, method, then review.", "Choose a delivery method that remains usable without home internet."], "start": ["g3", "b2", "g0", "g1"], "mode": "Select and order blocks into sentence positions 1\u20134. Replace the incompatible method."}, {"title": "The Final Repair", "brief": "Goal: prepare two schools for floods during a four-week planning period. Resources: existing school safety teams, local emergency-authority guidance and one supervised drill per school during safe conditions. Limits: authorities approve evacuation routes; students never enter floodwater or lead rescues; no new vehicles.", "broken": "Encourages pupils acting alone to prevent all flood harm immediately through student-led floodwater rescues, with success measured by online attention.", "good": ["Encourages the two school safety teams, coordinating with local emergency authorities,", "to prepare and practise flood-response plans for both schools over four weeks", "using authority-approved routes and one supervised drill per school in safe conditions,", "with teams logging drill participation and route-access issues, then reviewing corrections with local authorities after each drill."], "bad": ["Encourages pupil volunteers acting without adult or authority coordination", "to guarantee that no flood can harm anyone in the district", "through student-led rescues in floodwater using vehicles not yet funded,", "with drill videos and online attention used as the only evidence of readiness."], "why": ["School safety teams and authorities have relevant responsibilities; pupils alone cannot replace them.", "Two-school preparation over four weeks is a bounded action; guaranteeing no harm is unrealistic.", "Approved routes and supervised drills in safe conditions respect safety and resources; student floodwater rescues do not.", "Participation and route issues guide corrections with authorities; attention alone cannot establish readiness."], "hints": ["Repair all four components; do not leave safety to untrained students.", "A useful review identifies route problems and assigns follow-up with authorities."], "start": ["b2", "b0", "b3", "b1"], "mode": "Build the final clause in sentence order. Check mandate, safety, resources and follow-up."}];

const TUTOR={title:'Tutorial: move, classify and repair',brief:'Simulation: one school library, a librarian, ten existing book packs and one collection day. No points. Practise moving cards, removing one and undoing a move.',broken:'Encourages everyone to distribute ten book packs through the library collection day, with a collection register.',good:['Encourages the school librarian','to distribute the ten existing book packs','through the library collection day,','with the librarian keeping a collection register.'],bad:['Encourages everyone interested in books,','to improve the whole education system','through an unfunded new online platform,','with success measured by publicity views.'],why:['The librarian is a specific actor.','Ten existing packs define the action.','The collection day is an available method.','The register checks deliveries.'],hints:['Select the “everyone” card and then Remove. Select the librarian card, then WHO.','Try moving any card to the bank and pressing Undo. Finally arrange the four relevant cards.'],start:['b0','g1','g2','g3'],mode:'Select a card, then a destination. Enter or Space operates every button. Dragging is optional.'};

const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(orders){return {version:1,stage:'tutorial',index:0,people:{},seconds:0,orders:orders||Array.from({length:9},()=>shuffle(['g0','g1','g2','g3','b0','b1','b2','b3'])),boards:[TUTOR,...CASES].map(c=>({slots:c.start.slice(),removed:[],first:null,last:null,repaired:false,hints:0,justification:''})),mission:{},extra:{},written:false,extraDone:false}}
function persist(){if(!s)return;try{localStorage.setItem(KEY,JSON.stringify(s));$('notice').textContent=''}catch(e){$('notice').textContent='Progress is held in this tab only: browser storage is unavailable. Download your evidence before closing.'}}

function score(){return s.boards.slice(1).reduce((n,b)=>n+(b.first||[]).filter(Boolean).length,0)}function repaired(){return s.boards.slice(1).filter(b=>b.repaired).length}function hints(){return s.boards.reduce((n,b)=>n+b.hints,0)}function clock(n){return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function stats(){if(!s){$('stats').innerHTML='';return}$('stats').innerHTML=`<div class="stats"><span>First-check score: ${score()}/32</span><span>Cases repaired: ${repaired()}/8</span><span>Time: <b id="clock">${clock(s.seconds)}</b></span><span>Hints: ${hints()}</span></div><progress max="8" value="${repaired()}" aria-label="Cases repaired"></progress>`}

function tone(freq,dur,vol){try{if(muted)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){$('audioStatus').textContent='Audio unavailable; the lab still works.'}}

function intro(){stats();$('app').innerHTML=`<section><span class="tag">Needs revision</span><h1>Amendment Surgery:<br>The Resolution Repair Lab</h1><p>You are the editorial team repairing proposals before a MUN session. Diagnose, remove, replace and reorder clause fragments.</p><p><b>Plan: 20–25 minutes</b> for the tutorial, eight cases and your own proposal. Optional stress test: 5 minutes. There is no time limit, waiting period or life limit.</p><p>This is a <b>clause-repair workshop</b>. Formal rules for presenting and voting on amendments depend on the conference and are not simulated here.</p><p>WHO + WHAT + HOW + FOLLOW-UP is a learning checklist, not a universal required structure for every resolution. Recommendations do not automatically become binding orders.</p><details><summary>How scoring and controls work</summary><p>Each case has four independent criteria. Your first press of Check fixes all four first-check results: one point per correct criterion, even if a slot is empty. Later repairs do not add points. Eight cases × four criteria = 32. Grade = points ÷ 32 × 10. Hints are free and counted.</p><p>Drag cards or select a card and then a destination. With a keyboard use Tab, Enter or Space. Remove, return, swap and Undo are available. Keep all four roles coherent.</p><p>Justifications and your final clause are for teacher review, outside the automatic grade. Minor English mistakes are not automatically penalized.</p></details><p>This runs locally and sends no data. Saved progress may be visible to the next person using this browser. It is practice, not a secure exam.</p>${saved?'<button id="resume" class="primary">Resume saved session</button>':''}</section><section><h2>Open your lab file</h2><form id="startform"><label for="mode">Working mode</label><select id="mode"><option value="solo">Individual</option><option value="pair">Pair</option></select><div class="grid"><div><label for="name1">Full name</label><input id="name1" required autocomplete="off"></div><div><label for="country1">Assigned country</label><input id="country1" required autocomplete="off"></div><div id="partner" class="wide" hidden><div class="grid"><div><label for="name2">Partner’s full name</label><input id="name2" autocomplete="off"></div><div><label for="country2">Partner’s assigned country</label><input id="country2" autocomplete="off"></div></div></div><div><label for="group">Group</label><input id="group" required value="10A"></div></div><p>No email or password needed. In pairs, discuss and submit one shared repair file.</p><button class="primary" type="submit">Start a new session →</button></form></section>`;
if($('resume'))$('resume').onclick=()=>{s=saved;render()};$('mode').onchange=()=>{let pair=$('mode').value==='pair';$('partner').hidden=!pair;$('name2').required=pair;$('country2').required=pair};$('startform').onsubmit=e=>{e.preventDefault();if(saved&&!confirm('Replace saved responses, points and time?'))return;let old=saved?.orders;s=fresh(old);for(let k of ['mode','name1','country1','name2','country2','group'])s.people[k]=$(k).value.trim();if(!s.people.name1||!s.people.country1||!s.people.group||(s.people.mode==='pair'&&(!s.people.name2||!s.people.country2)))return;persist();render()}}
function boardIndex(){return s.stage==='tutorial'?0:s.index+1}function content(){return s.stage==='tutorial'?TUTOR:CASES[s.index]}function cardText(id,c=content()){return c[id[0]==='g'?'good':'bad'][+id[1]]}

function move(id,dest){const b=s.boards[boardIndex()];if(!/^[gb][0-3]$/.test(id))return;if(!['bank','remove','0','1','2','3'].includes(String(dest)))return;snapshot();let from=b.slots.indexOf(id);if(from>=0)b.slots[from]=null;b.removed=b.removed.filter(x=>x!==id);if(dest==='remove')b.removed.push(id);else if(dest!=='bank'){let displaced=b.slots[+dest];b.slots[+dest]=id;if(displaced&&from>=0&&from!==+dest)b.slots[from]=displaced}b.last=null;b.repaired=false;selected=null;persist();board();let target=document.querySelector(`[data-dest="${dest}"]`);target?.focus();fx()}
function check(){let b=s.boards[boardIndex()];const result=b.slots.map((id,i)=>id==='g'+i);if(b.first===null)b.first=result.slice();b.last=result;b.repaired=result.every(Boolean);selected=null;persist();board();$('feedback')?.focus();fx(b.repaired)}
function board(){stats();let n=boardIndex(),b=s.boards[n],c=content(),tutorial=n===0;let bank=s.orders[n].filter(id=>!b.slots.includes(id)&&!b.removed.includes(id));$('app').innerHTML=`<section><div class="row"><span class="tag">${b.repaired?'Ready for review':b.last?'Under repair':'Needs revision'}</span><b>${tutorial?'Tutorial • no points':`Case file ${n} of 8 • Simulation`}</b></div><h1>${esc(c.title)}</h1><p>${esc(c.brief)}</p><h3>Defective draft</h3><blockquote>${esc(c.broken)}</blockquote><p><b>Task:</b> ${esc(c.mode)}</p><p class="muted">The cards have one coherent solution for this brief. Card length and appearance do not indicate correctness.</p></section><div class="grid"><section><h2>Repair workbench</h2><p id="selection" role="status">${selected?'Selected: '+esc(cardText(selected))+'. Choose a destination.':'Select a card, then a destination — or drag it.'}</p>${ROLES.map((r,i)=>`<div class="slot"><button class="target" data-dest="${i}">${n>=7?`Position ${i+1} • `:''}${r} — place card here</button>${b.slots[i]?card(b.slots[i]):'<p class="empty">Empty slot</p>'}</div>`).join('')}<h3>Assembled clause</h3><p>${esc(b.slots.filter(Boolean).map(id=>cardText(id)).join(' '))||'Place cards to build your clause.'}</p></section><section><h2>Fragment bank</h2><p>Return removed cards here, or place them directly into a slot. Placing onto an occupied slot swaps cards when possible; otherwise the previous card returns here.</p><button data-dest="bank" class="target">Return to bank</button><div class="stack">${bank.map(card).join('')}</div><div class="tray"><button data-dest="remove" class="orange">⌫ Remove — place defective fragment here</button><div class="stack">${b.removed.map(card).join('')}</div></div></section></div><section><div class="row"><button id="undo" ${history.length?'':'disabled'}>↶ Undo move</button><button id="retry">Restore draft / retry</button><button id="hint" ${b.hints>=c.hints.length?'disabled':''}>Hint (${b.hints}/${c.hints.length})</button><button id="check" class="primary">${b.first===null&&!tutorial?'First check — lock four scores':'Check repair'}</button></div><p class="muted">${tutorial?'Tutorial feedback does not affect your score.':b.first===null?'First check fixes all four criterion scores, including empty slots. Review your work before checking.':`First-check points locked: ${b.first.filter(Boolean).length}/4. Repairs remain unlimited.`}</p>${c.hints.slice(0,b.hints).map((h,i)=>`<p class="feedback">Hint ${i+1}: ${esc(h)}</p>`).join('')}<div id="feedback" tabindex="-1" aria-live="polite">${b.last?b.last.map((ok,i)=>`<div class="feedback ${ok?'':'fail'}"><b>${ok?'✓ Met':'↻ Revise'}: ${ROLES[i]}</b><p>${ok?esc(c.why[i]):`This slot does not yet meet ${ROLES[i]}. ${esc(c.why[i])}`}</p></div>`).join(''):''}</div>${b.repaired?`<details><summary>Commented solution</summary><p>${esc(c.good.join(' '))}</p>${c.why.map((x,i)=>`<p><b>${ROLES[i]}:</b> ${esc(x)}</p>`).join('')}</details>`:''}${tutorial?'<p>Ready? Complete the repair to unlock the cases.</p>':`<label for="justify">For teacher review: I changed ___ because ___.</label><textarea id="justify" placeholder="I changed … because …">${esc(b.justification)}</textarea><p class="muted">Explain your editorial decision. This writing is saved, not automatically graded.</p>`}<button id="next" class="primary" ${b.repaired?'':'disabled'}>${tutorial?'Open case file 1 →':n===8?'My Country, My Proposal →':'Save justification & next case →'}</button><p id="writeMsg" role="status"></p></section><button id="restart">Restart entire session</button>`;
document.querySelectorAll('[data-card]').forEach(el=>{el.onclick=()=>{selected=el.dataset.card;document.querySelectorAll('[data-card]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.card===selected));$('selection').textContent='Selected: '+cardText(selected)+'. Choose a destination.'};el.ondragstart=e=>{selected=el.dataset.card;e.dataTransfer.setData('text/plain',selected);e.dataTransfer.effectAllowed='move'}});
document.querySelectorAll('[data-dest]').forEach(el=>{el.onclick=()=>{if(selected)move(selected,el.dataset.dest);else $('selection').textContent='Select a card first.'};el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};el.ondrop=e=>{e.preventDefault();move(e.dataTransfer.getData('text/plain'),el.dataset.dest)}});
$('undo').onclick=()=>{if(history.length){let prior=history.pop();prior.first=b.first;prior.hints=b.hints;prior.justification=b.justification;prior.last=null;prior.repaired=false;s.boards[n]=prior;selected=null;persist();board()}};
$('retry').onclick=()=>{snapshot();b.slots=c.start.slice();b.removed=[];b.last=null;b.repaired=false;selected=null;persist();board()};$('hint').onclick=()=>{b.hints=Math.min(c.hints.length,b.hints+1);persist();board();$('hint').focus()};$('check').onclick=check;
if($('justify'))$('justify').oninput=e=>{b.justification=e.target.value;persist()};$('next').onclick=()=>{if(!tutorial&&!b.justification.trim()){$('writeMsg').textContent='Please record a justification for teacher review. It is not graded automatically.';$('justify').focus();return}history=[];selected=null;if(tutorial){s.stage='case';s.index=0}else if(n<8)s.index++;else{s.stage='mission';s.mission.country=s.people.mode==='pair'?s.people.country1+' / '+s.people.country2:s.people.country1}persist();render()};$('restart').onclick=restart;
}
const MF=[['country','Country (or both countries)'],['challenge','Challenge'],['fact','Supporting fact from your notes or source'],['source','Source title'],['url','Source URL (as recorded in your notes)'],['clause','My proposed operative clause'],['who','WHO — identify the actor in your clause'],['what','WHAT — identify the action'],['how','HOW — identify the delivery method'],['follow','FOLLOW-UP — identify the review method']];
function mission(){stats();$('app').innerHTML=`<section><span class="tag">For teacher review</span><h1>My Country, My Proposal</h1><p>Use your assigned country and a challenge relevant to it. You may use your notes and sources already consulted; no extensive new research is required.</p><p><b>Your proposal is not automatically your country’s official policy.</b> A supporting fact does not by itself prove your government endorses your solution. In a pair, write one joint practice proposal, naming both countries and explaining its relevance to each.</p><p>Use a source you can identify. If you cannot verify a fact or have no recorded URL, write “not verified” or “URL not recorded” rather than inventing one. Your teacher will review it.</p><form id="missionform"><div class="grid">${MF.map(([k,l])=>`<div class="${['fact','clause'].includes(k)?'wide':''}"><label for="m_${k}">${l}</label>${['country','source','url'].includes(k)?`<input id="m_${k}" required value="${esc(s.mission[k])}">`:`<textarea id="m_${k}" required>${esc(s.mission[k])}</textarea>`}</div>`).join('')}</div><label for="policy">How should your proposal be described?</label><select id="policy"><option value="student">Student-created proposal; no official-policy claim</option><option value="official">Includes an official-policy claim that my source supports — teacher to verify</option></select><label for="policyNote">If you claim official policy: quote or identify the relevant source passage. Otherwise write “Student proposal”.</label><textarea id="policyNote" required>${esc(s.mission.policyNote||'Student proposal')}</textarea><p>No automatic grade is assigned to truth, diplomacy or English accuracy. The fields are recorded for review.</p><button class="primary">Save writing & view result →</button></form></section><button id="restart">Restart entire session</button>`;$('policy').value=s.mission.policy||'student';MF.forEach(([k])=>$('m_'+k).oninput=e=>{s.mission[k]=e.target.value;s.written=false;persist()});$('policy').onchange=e=>{s.mission.policy=e.target.value;persist()};$('policyNote').oninput=e=>{s.mission.policyNote=e.target.value;persist()};$('missionform').onsubmit=e=>{e.preventDefault();MF.forEach(([k])=>s.mission[k]=$('m_'+k).value.trim());if(MF.some(([k])=>!s.mission[k]))return;s.mission.policy=$('policy').value;s.mission.policyNote=$('policyNote').value;s.written=true;s.stage='result';persist();render()};$('restart').onclick=restart}
function datePrefix(){let d=new Date();return String(d.getFullYear()).slice(-2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function evidence(){const p=s.people;return ['Amendment Surgery: The Resolution Repair Lab','10A MUN • Operative Clauses • Practice 1','Local practice evidence — not a secure exam','Name(s): '+[p.name1,p.mode==='pair'?p.name2:''].filter(Boolean).join(' / '),'Group: '+p.group,'Country/countries: '+[p.country1,p.mode==='pair'?p.country2:''].filter(Boolean).join(' / '),`Cases repaired: ${repaired()}/8`,`First-check score: ${score()}/32`,`Grade: ${(score()/32*10).toFixed(1)}/10`,`Main activity time (active tab session, including reading): ${clock(s.seconds)}`,`Hints used (including tutorial): ${hints()}`,'Written production: '+(s.written?'Saved — for teacher review':'Incomplete'),'No results are automatically sent to the teacher.','',...CASES.flatMap((c,i)=>{let b=s.boards[i+1];return [`CASE ${i+1}: ${c.title}`,`First-check criteria: ${ROLES.map((r,j)=>r+' '+(b.first?.[j]?'1':'0')).join('; ')}`,`Repaired: ${b.repaired?'yes':'no'}; hints: ${b.hints}`,`Repair: ${b.slots.filter(Boolean).map(id=>cardText(id,c)).join(' ')}`,`Justification: ${b.justification}`,'']}),'MY COUNTRY, MY PROPOSAL — FOR TEACHER REVIEW',...MF.map(([k,l])=>l+': '+(s.mission[k]||'')),'Policy status: '+(s.mission.policy==='official'?'Official-policy claim requires source verification':'Student-created proposal'),'Relevant passage / note: '+(s.mission.policyNote||''),'Your proposal is not automatically your country’s official policy.','','OPTIONAL: THE AMENDMENT STRESS TEST',s.extraDone?'Completed — outside automatic score':'Not completed',s.extraDone?'Scenario: budget reduced by 50%; if no budget was specified, delivery staff/time reduced by 50%.':'',...Object.entries(s.extra).map(([k,v])=>k+': '+v)].join('\n')}
function download(){let blob=new Blob([evidence()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=datePrefix()+'_10A_MUN_Amendment_Surgery_evidence.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('dlmsg').textContent='TXT download requested. Save it and upload your evidence to Algebraix; nothing is sent automatically.'}
function result(){stats();let p=s.people;$('app').innerHTML=`<section class="evidence"><span class="tag">Ready for review</span><h1>Amendment Surgery:<br>The Resolution Repair Lab</h1><p><b>10A MUN • Operative Clauses • Practice 1</b></p><p><b>Name(s):</b> ${esc([p.name1,p.mode==='pair'?p.name2:''].filter(Boolean).join(' / '))}</p><p><b>Group:</b> ${esc(p.group)} • <b>Country/countries:</b> ${esc([p.country1,p.mode==='pair'?p.country2:''].filter(Boolean).join(' / '))}</p><div class="grid"><div><p class="score">${score()}/32</p><p>First-check score</p></div><div><p class="score">${(score()/32*10).toFixed(1)}/10</p><p>Automatic grade</p></div></div><p><b>Cases repaired:</b> ${repaired()}/8 • <b>Time:</b> ${clock(s.seconds)} • <b>Hints:</b> ${hints()}</p><p><b>Written production:</b> ${s.written?'Saved — for teacher review':'Incomplete'}</p><p><b>Stress test:</b> ${s.extraDone?'Saved — ungraded':'Optional / not completed'}</p><p><b>Take a screenshot and upload it to Algebraix.</b></p></section><section><div class="row"><button id="download" class="primary">↓ Download evidence TXT</button><button id="edit">Review / edit my proposal</button><button id="extra" class="orange">Optional: The Amendment Stress Test</button><button id="restart">Restart entire session</button></div><p id="dlmsg" role="status">Results are local. They are not automatically sent to Miss Martha.</p></section>`;$('download').onclick=download;$('edit').onclick=()=>{s.stage='mission';persist();render()};$('extra').onclick=()=>{s.stage='extra';persist();render()};$('restart').onclick=restart}
function extra(){stats();$('app').innerHTML=`<section><span class="tag">Optional • 5 minutes • no points</span><h1>The Amendment Stress Test</h1><p><b>Resource change:</b> your proposed budget is reduced by 50%. If your clause has no stated budget, assume half the original staff time is available. Keep safety requirements and the relevant mandate.</p><p>Adapt scope, frequency or method. Explain two concrete changes and show what remains feasible. Do not invent an official country policy.</p><h3>Your original clause</h3><blockquote>${esc(s.mission.clause)}</blockquote><form id="extraform">${[['adapted','Adapted operative clause'],['change1','Change 1 and why it fits the new resources'],['change2','Change 2 and why it fits the new resources']].map(([k,l])=>`<label for="e_${k}">${l}</label><textarea id="e_${k}" required>${esc(s.extra[k])}</textarea>`).join('')}<p>For teacher review only. This does not modify the main score or main timer.</p><button class="primary">Save optional challenge</button> <button type="button" id="back">Back to results</button></form></section>`;['adapted','change1','change2'].forEach(k=>$('e_'+k).oninput=e=>{s.extra[k]=e.target.value;s.extraDone=false;persist()});$('extraform').onsubmit=e=>{e.preventDefault();if(['adapted','change1','change2'].some(k=>!s.extra[k]?.trim()))return;s.extraDone=true;s.stage='result';persist();render()};$('back').onclick=()=>{s.stage='result';persist();render()}}
function restart(){if(!confirm('Restart the entire session? This clears names, answers, points, written work and time. The card shuffle stays the same. Download evidence first if needed.'))return;const order=s.orders;s=fresh(order);s.stage='tutorial';s.people={};saved=null;history=[];selected=null;try{localStorage.removeItem(KEY)}catch(e){};saved=s;s=null;intro();$('resume')?.remove();$('startform').onsubmit=e=>{e.preventDefault();s=fresh(order);for(let k of ['mode','name1','country1','name2','country2','group'])s.people[k]=$(k).value.trim();saved=null;persist();render()}}
function render(){history=[];selected=null;if(s.stage==='tutorial'||s.stage==='case')board();else if(s.stage==='mission')mission();else if(s.stage==='extra')extra();else result();window.scrollTo(0,0);let h=$('app').querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
intro();
</script></html>
