<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Showdown | 7A English</title>
<style>
:root{--ink:#192039;--purple:#6c4cff;--pink:#ff5f9e;--cyan:#4fd8ff;--lime:#c8f36b;--yellow:#ffd85a;--bg:#f2f0ff}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}header{padding:15px 5%;background:#17142c;color:white;display:flex;justify-content:space-between;position:sticky;top:0}.brand{font-weight:950}.brand b{color:var(--yellow)}main{max-width:950px;margin:28px auto;padding:0 18px 40px}.card{background:white;border:2px solid var(--ink);border-radius:24px;padding:28px;box-shadow:8px 8px 0 #cbc6f5}.hero{text-align:center}.hero h1{font-size:clamp(48px,9vw,92px);line-height:.88;margin:12px 0;letter-spacing:-4px}.hero h1 span{color:var(--purple)}.sub{font-size:24px;font-weight:850}.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}.pill{padding:7px 12px;border-radius:99px;background:#f1efff;border:1px solid #d2ccef;font-weight:800;font-size:14px}label{display:block;font-weight:850;margin:14px 0 7px}input{width:100%;font:inherit;padding:13px;border:2px solid #b8b4d5;border-radius:12px}button{font:inherit;font-weight:900;border:2px solid var(--ink);border-radius:14px;padding:13px 18px;background:white;box-shadow:0 4px 0 var(--ink);cursor:pointer}.primary{background:var(--purple);color:white;border-color:var(--purple)}.lime{background:var(--lime)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.topline{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--yellow);font-weight:950;font-size:13px}.progress{height:14px;background:#e7e5f6;border-radius:99px;overflow:hidden;margin:18px 0 28px}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--cyan))}.question h2{font-size:clamp(30px,5vw,48px);line-height:1.08}.options{display:grid;gap:12px}.opt{text-align:left;background:white;border-color:#b9b6d3;box-shadow:none;display:flex;gap:12px;align-items:flex-start;padding:16px}.opt b{min-width:34px;height:34px;display:grid;place-items:center;background:#efecff;border-radius:10px}.opt.selected{border-color:var(--purple);background:#f1efff}.feedback{margin-top:22px;padding:20px;border-radius:16px;border:2px solid #27936d;background:#e7fff4}.feedback.wrong{background:#fff0f4;border-color:#c74470}.pct{font-size:clamp(92px,17vw,170px);font-weight:950;line-height:.9;color:var(--purple);letter-spacing:-8px}.score{font-size:34px;font-weight:950}.evidence{background:var(--lime);padding:14px;border-radius:12px;font-weight:850;margin:18px 0}.hidden{display:none!important}.error{color:#a4254f;min-height:22px}.timer{font-variant-numeric:tabular-nums}@media(max-width:650px){.grid2{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body>
<header><div class="brand">⚡ SENTENCE <b>SHOWDOWN</b><div style="font-size:11px;letter-spacing:2px;color:#c6c2ff">MISS MARTHA · 7A ENGLISH</div></div><div class="timer" id="timer"></div></header>
<main id="app"></main>
<script>
"use strict";
const QUESTIONS=[{"q":"Which sentence is SIMPLE?","o":["The rain stopped, and the game continued.","Although the rain stopped, the field stayed muddy.","The players celebrated after the final whistle.","The rain stopped, but the clouds remained."],"a":2,"f":"A simple sentence has one independent clause."},{"q":"Which sentence is COMPOUND?","o":["The bell rang, and the students packed their bags.","When the bell rang, the students packed their bags.","After class, the students packed their bags.","Packing their bags, the students hurried out."],"a":0,"f":"A compound sentence has two independent clauses joined correctly."},{"q":"Which sentence is COMPLEX?","o":["Mia studied, and Leo made flashcards.","Because Mia studied, she felt prepared.","Mia studied all evening.","Mia studied; Leo made flashcards."],"a":1,"f":"A complex sentence has one independent clause and at least one dependent clause."},{"q":"Which sentence is COMPOUND-COMPLEX?","o":["We stayed inside because it rained.","We stayed inside, and we played cards.","Because it rained, we stayed inside, and we played cards.","We stayed inside during the storm."],"a":2,"f":"This one has a dependent clause plus two independent clauses."},{"q":"Identify the dependent clause: “Although the test was difficult, Nora finished early.”","o":["Although the test was difficult","Nora finished early","the test was difficult, Nora","finished early"],"a":0,"f":"The subordinating word although makes that clause dependent."},{"q":"Which is an independent clause?","o":["because the bus was late","while we waited outside","the bus finally arrived","although it was raining"],"a":2,"f":"An independent clause can stand alone as a complete thought."},{"q":"Choose the correct FANBOYS word: “I wanted to go outside, ___ it was raining.”","o":["so","but","or","for"],"a":1,"f":"But shows contrast."},{"q":"Which sentence uses the comma correctly?","o":["Because I was tired I went to bed early.","Because I was tired, I went to bed early.","Because, I was tired I went to bed early.","Because I was tired I, went to bed early."],"a":1,"f":"When a dependent clause comes first, use a comma before the independent clause."},{"q":"Which sentence contains a comma splice?","o":["The movie ended, and we left.","The movie ended; we left.","The movie ended, we left.","When the movie ended, we left."],"a":2,"f":"Two independent clauses cannot be joined with only a comma."},{"q":"Best repair: “The dog barked, the baby woke up.”","o":["The dog barked and the baby woke up.","The dog barked, and the baby woke up.","Because the dog barked the baby woke up.","The dog barked, because the baby woke up."],"a":1,"f":"Two independent clauses can be joined with comma + FANBOYS."},{"q":"Which is a fragment?","o":["The team practiced after school.","Because the team practiced after school.","The team practiced, so they improved.","After school, the team practiced."],"a":1,"f":"Because makes the clause dependent, so it cannot stand alone."},{"q":"Which sentence is punctuated correctly?","o":["I finished my homework but, I forgot to submit it.","I finished my homework, but I forgot to submit it.","I finished my homework but I, forgot to submit it.","I finished my homework, but, I forgot to submit it."],"a":1,"f":"Use a comma before a FANBOYS conjunction joining two independent clauses."},{"q":"How many independent clauses are in: “Lena cooked dinner, and Max washed the dishes.”","o":["0","1","2","3"],"a":2,"f":"There are two complete thoughts."},{"q":"What type is: “When the lights went out, everyone became quiet.”","o":["Simple","Compound","Complex","Compound-complex"],"a":2,"f":"Dependent clause + independent clause = complex."},{"q":"What type is: “The lights went out, and everyone became quiet.”","o":["Simple","Compound","Complex","Compound-complex"],"a":1,"f":"Two independent clauses joined by and = compound."},{"q":"What type is: “The lights went out.”","o":["Simple","Compound","Complex","Compound-complex"],"a":0,"f":"One independent clause = simple."},{"q":"What type is: “When the lights went out, everyone became quiet, and the teacher found a flashlight.”","o":["Simple","Compound","Complex","Compound-complex"],"a":3,"f":"One dependent clause + two independent clauses = compound-complex."},{"q":"Which sentence is the BEST revision of the run-on? “Ava likes science she joined the robotics club.”","o":["Ava likes science, she joined the robotics club.","Ava likes science and joined the robotics club.","Ava likes science, so she joined the robotics club.","Because Ava likes science."],"a":2,"f":"Comma + so correctly joins the two complete thoughts."},{"q":"Choose the sentence with TWO independent clauses.","o":["Before lunch, we finished the project.","We finished the project because time was short.","We finished the project, and we presented it.","Finishing the project before lunch."],"a":2,"f":"Both halves can stand alone, joined by and."},{"q":"Which sentence starts with a dependent clause?","o":["The class cheered when the score appeared.","When the score appeared, the class cheered.","The score appeared, and the class cheered.","The class cheered loudly."],"a":1,"f":"“When the score appeared” cannot stand alone."},{"q":"FINAL ROUND: Which sentence is correctly written AND compound-complex?","o":["Although we were tired we kept working, and we finished the poster.","Although we were tired, we kept working, and we finished the poster.","We were tired, we kept working, and finished the poster.","Although we were tired, and we kept working, we finished the poster."],"a":1,"f":"Dependent clause first + comma, then two independent clauses joined with comma + and."},{"q":"FINAL ROUND: Which explanation is correct? “Because the bus was late, we missed the first activity, but we joined the second one.”","o":["Simple: one subject and one verb.","Compound: two independent clauses only.","Complex: one dependent clause and one independent clause.","Compound-complex: one dependent clause and two independent clauses."],"a":3,"f":"It contains one dependent clause and two independent clauses."}];
const EDGE="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results",GAME_ID="260918_7A_SENTENCE_SHOWDOWN",SCHOOL_DOMAIN="@colegiointernacional.edu.mx",STORE="260918_7A_sentence_showdown_state";
const el=id=>document.getElementById(id);let state=null,locked=false,sending=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function landing(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY FINAL REVIEW · SEPT. 18, 2026</span><h1>SENTENCE<br><span>SHOWDOWN</span></h1><div class="sub">22 rounds. No lives. No boring worksheet.</div><div class="pills"><span class="pill">IC / DC</span><span class="pill">FANBOYS</span><span class="pill">Simple</span><span class="pill">Compound</span><span class="pill">Complex</span><span class="pill">Compound-Complex</span><span class="pill">Fragments & Run-ons</span></div><form id="start"><div class="grid2"><div><label>Full name</label><input id="name" required placeholder="First and last name"></div><div><label>School email</label><input id="email" type="email" required placeholder="name@colegiointernacional.edu.mx"></div></div><label>Group</label><input value="7A" readonly><p class="error" id="err"></p><button class="primary">ENTER THE SHOWDOWN →</button></form></section>`;
el("start").onsubmit=e=>{e.preventDefault();const name=el("name").value.trim(),email=el("email").value.trim().toLowerCase();if(name.length<3){el("err").textContent="Please enter your full name.";return}if(!email.endsWith(SCHOOL_DOMAIN)){el("err").textContent="Use your colegiointernacional.edu.mx school email.";return}state={name,email,group:"7A",index:0,answers:[],started:Date.now(),finished:false,saved:false};persist();renderQ()}}
function renderQ(){locked=false;const i=state.index,q=QUESTIONS[i],pct=Math.round(i/QUESTIONS.length*100);app.innerHTML=`<section class="card question"><div class="topline"><span class="badge">${i>=20?"FINAL ROUND":"ROUND "+(i+1)}</span><b>${i+1} / ${QUESTIONS.length}</b></div><div class="progress"><div style="width:${pct}%"></div></div><h2>${esc(q.q)}</h2><div class="options">${q.o.map((x,j)=>`<button class="opt" data-i="${j}"><b>${String.fromCharCode(65+j)}</b><span>${esc(x)}</span></button>`).join("")}</div><div id="feed"></div></section>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>select(+b.dataset.i));window.scrollTo(0,0)}
function select(j){if(locked)return;locked=true;const q=QUESTIONS[state.index],correct=j===q.a;state.answers[state.index]={choice:j,correct};persist();document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add("selected")});el("feed").innerHTML=`<div class="feedback ${correct?"":"wrong"}"><strong>${correct?"✅ NICE. +1":"⚠️ Not quite."}</strong><p>${esc(q.f)}</p>${!correct?`<p><b>Correct answer:</b> ${esc(q.o[q.a])}</p>`:""}<button id="next" class="lime">${state.index===QUESTIONS.length-1?"SEE MY FINAL SCORE →":"NEXT ROUND →"}</button></div>`;el("next").onclick=next}
function next(){state.index++;if(state.index>=QUESTIONS.length){state.finished=true;persist();showResult();submitScore()}else{persist();renderQ()}}
function score(){return state.answers.filter(x=>x&&x.correct).length} function rank(p){return p>=91?"Sentence Structure Champion":p>=82?"Grammar Pro":p>=73?"Strong Finish":p>=64?"Almost There":"Keep Practicing"}
function showResult(){const s=score(),p=Math.round(s/QUESTIONS.length*100);app.innerHTML=`<section class="card hero"><span class="badge">OFFICIAL RESULT</span><h1>SENTENCE<br><span>SHOWDOWN</span></h1><h2>${esc(state.name)}</h2><p><b>7A ENGLISH · Friday, Sept. 18, 2026</b></p><div class="pct">${p}%</div><div class="score">${s} / ${QUESTIONS.length}</div><h2>${rank(p)}</h2><div class="evidence">Take a screenshot of this screen for your class evidence.</div><div id="save">${state.saved?"Score saved to Miss Martha's dashboard.":"Saving score…"}</div><p><button id="download" class="primary">DOWNLOAD RESULT</button> <button id="retry" class="${state.saved?"hidden":""}">RETRY SAVE</button> <button id="again">PLAY AGAIN</button></p></section>`;el("download").onclick=downloadResult;el("retry").onclick=submitScore;el("again").onclick=()=>{if(confirm("Start a new attempt?")){localStorage.removeItem(STORE);state=null;landing()}}}
async function submitScore(){if(!state||!state.finished||state.saved||sending)return;sending=true;try{const s=score(),p=Math.round(s/QUESTIONS.length*100),r=await fetch(EDGE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student_name:state.name,student_group:"7A",game_id:GAME_ID,grade:"7A",score:s,max_score:QUESTIONS.length,percentage:p,completed:true}),signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error();state.saved=true;persist();if(el("save"))el("save").textContent="Score saved to Miss Martha's dashboard.";if(el("retry"))el("retry").classList.add("hidden")}catch(e){if(el("save"))el("save").textContent="Could not save automatically. Your screenshot still works."}finally{sending=false}}
function downloadResult(){const c=document.createElement("canvas");c.width=1200;c.height=800;const x=c.getContext("2d"),s=score(),p=Math.round(s/QUESTIONS.length*100);x.fillStyle="#fff";x.fillRect(0,0,1200,800);x.strokeStyle="#6c4cff";x.lineWidth=12;x.strokeRect(20,20,1160,760);x.textAlign="center";x.fillStyle="#192039";x.font="bold 50px Arial";x.fillText("SENTENCE SHOWDOWN",600,90);x.font="bold 55px Arial";x.fillText(state.name,600,180);x.fillStyle="#6c4cff";x.font="bold 220px Arial";x.fillText(p+"%",600,470);x.fillStyle="#192039";x.font="bold 54px Arial";x.fillText(s+" / "+QUESTIONS.length,600,570);x.font="32px Arial";x.fillText("7A ENGLISH · SEPTEMBER 18, 2026",600,650);c.toBlob(b=>{const a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download="260918_7A_Sentence_Showdown_"+state.name.replace(/[^a-z0-9]/gi,"_")+".png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},"image/png")}
function boot(){try{const r=JSON.parse(localStorage.getItem(STORE));if(r&&r.group==="7A"&&Array.isArray(r.answers))state=r}catch(e){}if(!state){landing();return}if(state.finished){showResult();submitScore();return}app.innerHTML=`<section class="card hero"><span class="badge">SESSION FOUND</span><h1>WELCOME<br><span>BACK</span></h1><h2>${esc(state.name)}</h2><p>You have completed ${state.answers.length} of ${QUESTIONS.length} rounds.</p><button class="primary" id="resume">RESUME →</button> <button id="new">NEW STUDENT</button></section>`;el("resume").onclick=renderQ;el("new").onclick=()=>{localStorage.removeItem(STORE);state=null;landing()}}
setInterval(()=>{if(state&&!state.finished){const sec=Math.floor((Date.now()-state.started)/1000);el("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}else el("timer").textContent=""},1000);window.addEventListener("online",()=>{if(state?.finished&&!state.saved)submitScore()});boot();
</script></body></html>
