<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italics Teacher Dashboard</title><style>body{font-family:"Trebuchet MS","Comic Sans MS","Marker Felt",Arial,sans-serif;background:#fff7fb;color:#17223b;margin:0;font-size:18px}header{background:#ff2d2d;color:white;padding:16px 5%;font-family:"Comic Sans MS","Trebuchet MS",cursive;font-weight:900;font-size:25px;border-bottom:4px solid #17223b}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border:3px solid #17223b;border-radius:22px;padding:22px;box-shadow:8px 8px 0 #ffd500}input,select,button{padding:12px;font-size:17px;border:2px solid #a9bac8;border-radius:10px;font-family:inherit}button{font-weight:900;cursor:pointer}.primary{background:#1f5cff;color:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls>div{flex:1;min-width:170px}label{display:block;font-weight:900;margin:8px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff3a4;padding:14px 18px;border-radius:12px;border:2px solid #17223b}.stat b{display:block;font-size:36px;color:#1f5cff;font-family:"Comic Sans MS","Trebuchet MS",cursive}table{width:100%;border-collapse:collapse}th{text-align:left;background:#cfe0ff;padding:12px}td{padding:14px 12px;border-bottom:1px solid #d7dfef}.pct{font-size:30px;font-weight:900;color:#ff2d2d}.hidden{display:none}.msg{min-height:24px}</style></head><body><header>✨ ITALICS STYLE SHOWDOWN · TEACHER · 260918</header><main><section class="card"><h1>8A English · Italics</h1><p>25 points · Friday Review</p><form id="login"><label>Teacher code</label><input id="code" type="password" required><button class="primary">OPEN DASHBOARD</button></form><p class="msg" id="msg">Enter your teacher code to retrieve results.</p><section id="dash" class="hidden"><div class="controls"><div><label>Sort</label><select id="sort"><option value="new">Most recent</option><option value="high">Highest score</option><option value="low">Lowest score</option></select></div><div><label>Find student</label><input id="search" type="search"></div><button class="primary" id="refresh">REFRESH</button></div><div class="stats"><div class="stat"><b id="count">0</b>submissions</div><div class="stat"><b id="avg">—</b>average</div></div><table><thead><tr><th>STUDENT</th><th>GROUP</th><th>SCORE</th><th>PERCENTAGE</th><th>DATE / TIME</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script>const E='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',G='260918_8A_ITALICS_STYLE_SHOWDOWN';let data=[],code='';const el=id=>document.getElementById(id);function render(){let q=el('search').value.toLowerCase(),l=data.filter(r=>String(r.student_name).toLowerCase().includes(q));l.sort((a,b)=>el('sort').value==='high'?b.percentage-a.percentage:el('sort').value==='low'?a.percentage-b.percentage:new Date(b.created_at||0)-new Date(a.created_at||0));el('rows').innerHTML='';l.forEach(r=>{let tr=document.createElement('tr'),d=new Date(r.created_at||r.completed_at||0);[r.student_name,r.student_group,r.score+' / '+r.max_score,r.percentage+'%',d.toLocaleString()].forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i===3)td.className='pct';tr.appendChild(td)});el('rows').appendChild(tr)});if(!l.length)el('rows').innerHTML='<tr><td colspan="5">No results yet.</td></tr>';el('count').textContent=l.length;el('avg').textContent=l.length?Math.round(l.reduce((n,r)=>n+Number(r.percentage||0),0)/l.length)+'%':'—'}async function load(){el('msg').textContent='Loading…';try{let r=await fetch(E+'?game_id='+encodeURIComponent(G),{headers:{'x-teacher-code':code},cache:'no-store'});if(!r.ok)throw Error(r.status===401||r.status===403?'Teacher code was not accepted.':'Results service unavailable.');let j=await r.json();data=(j.results||[]).filter(x=>x.game_id===G);el('login').classList.add('hidden');el('dash').classList.remove('hidden');render();el('msg').textContent='Updated.'}catch(e){el('msg').textContent=e.message}}el('login').onsubmit=e=>{e.preventDefault();code=el('code').value.trim();load()};el('refresh').onclick=load;el('search').oninput=render;el('sort').onchange=render;</script></body></html>
