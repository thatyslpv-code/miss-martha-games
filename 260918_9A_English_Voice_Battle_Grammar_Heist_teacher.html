<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Battle Teacher Dashboard</title><style>body{margin:0;background:#0c1020;color:#eef4ff;font-family:Arial,sans-serif}header{padding:16px 5%;background:#080c17;font-weight:900}main{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#151c33;border:1px solid #334365;border-radius:22px;padding:24px}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #4c5d82;background:#0f1629;color:#fff}button{font-weight:900;cursor:pointer}.primary{background:#1679ff}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls>div{flex:1;min-width:170px}label{display:block;font-weight:900;margin:8px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#10243a;padding:14px 18px;border-radius:12px}.stat b{display:block;font-size:34px;color:#37d7ff}table{width:100%;border-collapse:collapse}th{text-align:left;background:#182440;padding:12px}td{padding:14px 12px;border-bottom:1px solid #283755}.pct{font-size:30px;font-weight:900;color:#37d7ff}.hidden{display:none}.msg{min-height:24px;color:#b8c8e8}@media(max-width:650px){table,tbody,tr,td{display:block;width:100%}thead{display:none}tr{border:1px solid #334365;border-radius:12px;margin:12px 0;padding:8px}td{border:0;padding:5px}}</style></head><body><header>🕶️ VOICE BATTLE · THE GRAMMAR HEIST · TEACHER DASHBOARD</header><main><section class="card"><h1>9A English · Friday Final Review</h1><p>Active & Passive Voice · 25 points · September 18, 2026</p><form id="login"><label>Teacher code</label><input id="code" type="password" required><button class="primary">OPEN DASHBOARD</button></form><p class="msg" id="msg">Enter your teacher code to retrieve results.</p><section id="dash" class="hidden"><div class="controls"><div><label>Sort</label><select id="sort"><option value="new">Most recent</option><option value="high">Highest score</option><option value="low">Lowest score</option></select></div><div><label>Find student</label><input id="search" type="search"></div><button class="primary" id="refresh">REFRESH</button><button id="lock">LOCK</button></div><div class="stats"><div class="stat"><b id="count">0</b>submissions</div><div class="stat"><b id="avg">—</b>average</div></div><table><thead><tr><th>STUDENT</th><th>GROUP</th><th>SCORE</th><th>PERCENTAGE</th><th>DATE / TIME</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script>const E='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',G='260918_9A_VOICE_BATTLE_GRAMMAR_HEIST',el=id=>document.getElementById(id);let data=[],code='';function render(){let q=search.value.trim().toLowerCase(),list=data.filter(r=>String(r.student_name).toLowerCase().includes(q));let s=sort.value;list.sort((a,b)=>s==='high'?+b.percentage-+a.percentage:s==='low'?+a.percentage-+b.percentage:new Date(b.created_at||0)-new Date(a.created_at||0));rows.innerHTML='';for(let r of list){let tr=document.createElement('tr'),d=new Date(r.created_at||r.completed_at||0);[r.student_name,r.student_group,r.score+' / '+r.max_score,r.percentage+'%',d.toLocaleString()].forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i===3)td.className='pct';tr.appendChild(td)});rows.appendChild(tr)}if(!list.length)rows.innerHTML='<tr><td colspan="5">No results yet.</td></tr>';count.textContent=list.length;avg.textContent=list.length?Math.round(list.reduce((n,r)=>n+Number(r.percentage||0),0)/list.length)+'%':'—'}async function load(){msg.textContent='Loading results…';try{let r=await fetch(E+'?game_id='+encodeURIComponent(G),{headers:{'x-teacher-code':code},cache:'no-store'});if(!r.ok)throw Error(r.status===401||r.status===403?'Teacher code was not accepted.':'Results service unavailable.');let j=await r.json();data=(j.results||[]).filter(x=>x.game_id===G);login.classList.add('hidden');dash.classList.remove('hidden');render();msg.textContent='Results updated: '+new Date().toLocaleTimeString()}catch(e){msg.textContent=e.message}}login.onsubmit=e=>{e.preventDefault();code=document.getElementById('code').value.trim();load()};refresh.onclick=load;sort.onchange=render;search.oninput=render;lock.onclick=()=>{code='';data=[];dash.classList.add('hidden');login.classList.remove('hidden');document.getElementById('code').value='';msg.textContent='Dashboard locked.'};</script></body></html>
