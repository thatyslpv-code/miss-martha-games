<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Battle: The Grammar Heist</title><style>body{margin:0;background:#0c1020;color:#eef4ff;font-family:Arial,sans-serif}header{padding:16px 5%;background:#080c17;position:sticky;top:0;font-weight:900}main{max-width:900px;margin:28px auto;padding:0 18px}.card{background:#151c33;border:1px solid #334365;border-radius:22px;padding:26px;box-shadow:0 18px 50px #0007}.hero{text-align:center}.hero h1{font-size:clamp(46px,9vw,88px);line-height:.9;margin:12px 0}.cyan{color:#37d7ff}.pink{color:#ff4fa3}.badge{display:inline-block;background:#ffd960;color:#241d00;border-radius:8px;padding:6px 10px;font-weight:900}.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}.pill{border:1px solid #40517b;border-radius:99px;padding:7px 11px;background:#10162a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:900;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid #50618a;background:#0d1325;color:#fff;font-size:18px}button{font:inherit;font-weight:900;padding:13px 16px;border-radius:12px;border:1px solid #53648d;background:#10182d;color:#fff;cursor:pointer}.primary{background:#5e56ff}.lime{background:#bafc6d;color:#102017}.top{display:flex;justify-content:space-between;gap:10px}.progress{height:12px;background:#0a0f1d;border-radius:99px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:linear-gradient(90deg,#37d7ff,#6b55ff,#ff4fa3)}h2{font-size:clamp(28px,5vw,44px)}.opts{display:grid;gap:12px}.opt{text-align:left}.feedback{margin-top:20px;padding:18px;border-radius:14px;background:#12302d;border:1px solid #35967f}.bad{background:#381a28;border-color:#c54b74}.score{font-size:clamp(96px,18vw,170px);font-weight:900;color:#37d7ff;letter-spacing:-8px}.small{color:#a9b9d9}.hidden{display:none}.err{color:#ff9fbd}.tiles,.answer{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:1px dashed #4c5b7a;border-radius:12px;min-height:58px}.answer{margin-top:10px;border-color:#37d7ff}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><header>🕶️ VOICE <span class="cyan">BATTLE</span> · THE GRAMMAR HEIST · 9A</header><main id="app"></main><script>const Q=[['MISSION 1 — IDENTIFY','The final report was submitted before noon.',['Active voice','Passive voice','Imperative mood','Fragment'],1,'The report receives the action.'],['MISSION 1 — IDENTIFY','Which sentence is active?',['The message was deleted by the editor.','The lights were turned off.','The committee approved the proposal.','The files were uploaded yesterday.'],2,'The committee performs the action.'],['MISSION 1 — IDENTIFY','Which sentence is passive?',['The storm damaged several roads.','Several roads were damaged by the storm.','The storm is damaging several roads.','The roads damaged the storm.'],1,'Passive voice uses be + past participle.'],['MISSION 1 — IDENTIFY','The research team tested the prototype.',['Active voice','Passive voice','Question','Fragment'],0,'The team performs the action.'],['MISSION 2 — SWITCH IT','The students completed the project yesterday.',['The project is completed by the students yesterday.','The project was completed by the students yesterday.','The students were completed by the project.','The project has been completed yesterday.'],1,'Past simple passive = was/were + past participle.'],['MISSION 2 — SWITCH IT','The chef prepares the sauce every morning.',['The sauce is prepared by the chef every morning.','The sauce was prepared every morning.','The chef is prepared by the sauce.','The sauce has prepared by the chef.'],0,'Present simple passive = is/are + past participle.'],['MISSION 2 — SWITCH IT','The technicians will repair the system tonight.',['The system will repaired tonight.','The system will be repaired tonight.','The system is repaired tonight.','The technicians will be repaired.'],1,'Future passive = will be + past participle.'],['MISSION 2 — SWITCH IT','The documents were signed by the director.',['The director signed the documents.','The director was signing the documents.','The documents signed the director.','The director has signed the documents.'],0,'Past simple passive becomes past simple active.'],['MISSION 3 — SABOTAGE','The trophy was win by our team.',['No error','win should be won','was should be is','team should be teams'],1,'Passive voice needs the past participle: won.'],['MISSION 3 — SABOTAGE','The emails were sented this morning.',['No error','were should be was','sented should be sent','this morning is wrong'],2,'The past participle of send is sent.'],['MISSION 3 — SABOTAGE','They have finished the task. Which passive keeps the tense?',['The task was finished.','The task has been finished.','The task is finished.','The task had been finished.'],1,'Present perfect passive = has/have been + past participle.'],['MISSION 3 — SABOTAGE','Which sentence has an unnecessary obvious agent?',['The suspect was arrested by the police.','The experiment was conducted by Dr. Lee.','The homework was completed by the student.','The sculpture was created by Maya.'],0,'The police are an obvious agent in this context.'],['MISSION 4 — BEST CHOICE','Best for a lab report?',['We heated the solution to 80°C.','The solution was heated to 80°C.','Heat the solution now!','Did we heat the solution?'],1,'Passive focuses on the process.'],['MISSION 4 — BEST CHOICE','Best for a clear news headline?',['The mayor opened the new library.','The new library was opened by the mayor.','The new library had been opened.','Opening the library was done by the mayor.'],0,'Active voice is shorter and direct.'],['MISSION 4 — BEST CHOICE','Best when the doer is unknown?',['Someone stole the bike.','The bike was stolen.','Someone was stealing the bike.','The bike stole someone.'],1,'Passive is useful when the doer is unknown.'],['MISSION 4 — BEST CHOICE','Best direct instruction?',['The button should be pressed by you.','Press the button.','The button is pressed.','The button was pressed.'],1,'Direct instructions are clearest in active/imperative form.'],['MISSION 5 — RECONSTRUCTION','The team will announce the results tomorrow.',['The results will announced tomorrow.','The results will be announced tomorrow.','The results are announced tomorrow.','The team will be announced tomorrow.'],1,'Future passive requires will be announced.'],['MISSION 5 — RECONSTRUCTION','The painting was created by a local artist.',['A local artist created the painting.','A local artist creates the painting.','The painting created a local artist.','A local artist was created by the painting.'],0,'Move the agent into subject position.'],['MISSION 5 — RECONSTRUCTION','People speak Spanish in many countries.',['Spanish is spoken in many countries.','Spanish was spoken in many countries.','Spanish has speaking in many countries.','Many countries are spoken Spanish.'],0,'Present simple passive = is spoken.'],['MISSION 5 — RECONSTRUCTION','The coach praised the team after the game.',['The team praised the coach.','The team was praised by the coach after the game.','The coach was praised by the team.','The team has praised after the game.'],1,'The team receives the action; tense stays past simple.'],['FINAL HEIST','The side door was left open at 6:10 p.m. Why use passive?',['The doer is unknown or unstated.','It is a command.','Passive is always stronger.','There is no verb.'],0,'Passive focuses on the event when the actor is unknown.'],['FINAL HEIST','A student moved the display case. Which version focuses on the case?',['The display case was moved by a student.','A student was moved by the display case.','The display case moved a student.','A student has moving the case.'],0,'Passive shifts focus to the receiver.'],['FINAL HEIST','The security camera had been disconnected before the alarm sounded.',['Active','Passive','Imperative','Interrogative'],1,'Had been disconnected is past perfect passive.'],['FINAL HEIST','The key was found under the desk by Maya.',['Maya found the key under the desk.','The key found Maya.','Maya was found by the key.','Maya has found the key.'],0,'Past simple passive becomes past simple active.'],['FINAL BOSS','The principal has announced the winner.',['The winner has been announced by the principal.','The winner was announced by the principal.','The winner is announced by the principal.','The principal has been announced by the winner.'],0,'Present perfect passive = has been + past participle.']];const E='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',G='260918_9A_VOICE_BATTLE_GRAMMAR_HEIST',D='@colegiointernacional.edu.mx',S='260918_9A_voice_battle',app=document.getElementById('app');let st=null,lock=false,sending=false;function save(){localStorage.setItem(S,JSON.stringify(st))}function land(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY FINAL REVIEW · SEPT. 18, 2026</span><h1>VOICE BATTLE<br><span class="cyan">THE GRAMMAR HEIST</span></h1><div class="pills"><span class="pill">25 missions</span><span class="pill">Active ↔ Passive</span><span class="pill">Tense traps</span><span class="pill">Final Heist</span></div><form id="f"><div class="grid"><div><label>Full name</label><input id="n" required></div><div><label>School email</label><input id="m" type="email" placeholder="name@colegiointernacional.edu.mx" required></div></div><label>Group</label><input value="9A" readonly><p class="err" id="er"></p><button class="primary">BEGIN THE HEIST →</button></form></section>`;f.onsubmit=e=>{e.preventDefault();let n=document.getElementById('n').value.trim(),m=document.getElementById('m').value.trim().toLowerCase();if(n.length<3)return er.textContent='Enter your full name.';if(!m.endsWith(D))return er.textContent='Use your school email.';st={name:n,email:m,i:0,a:[],finished:false,saved:false};save();render()}}function render(){lock=false;let q=Q[st.i],p=Math.round(st.i/Q.length*100);app.innerHTML=`<section class="card"><div class="top"><span class="badge ${q[0].includes('FINAL')?'pink':''}">${q[0]}</span><b>${st.i+1}/25</b></div><div class="progress"><div style="width:${p}%"></div></div><h2>${q[1]}</h2><div class="opts">${q[2].map((x,j)=>`<button class="opt" data-j="${j}"><b>${String.fromCharCode(65+j)}.</b> ${x}</button>`).join('')}</div><div id="feed"></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));scrollTo(0,0)}function pick(j){if(lock)return;lock=true;let q=Q[st.i],ok=j===q[3];st.a[st.i]={ok};save();document.querySelectorAll('.opt').forEach(b=>b.disabled=true);feed.innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'✅ MISSION CLEARED':'⚠️ SECURITY ALERT'}</b><p>${q[4]}</p>${ok?'':`<p><b>Correct:</b> ${q[2][q[3]]}</p>`}<button class="lime" id="nx">${st.i===24?'CLOSE THE HEIST →':'NEXT MISSION →'}</button></div>`;nx.onclick=next}function next(){st.i++;if(st.i>=25){st.finished=true;save();result();submit()}else{save();render()}}function sc(){return st.a.filter(x=>x&&x.ok).length}function result(){let s=sc(),p=s*4;app.innerHTML=`<section class="card hero"><span class="badge pink">HEIST COMPLETE</span><h1>CASE <span class="cyan">CLOSED</span></h1><h2>${st.name}</h2><div class="score">${p}%</div><h2>${s}/25</h2><div class="evidence">Take a screenshot of this screen for your class evidence.</div><p id="sv">${st.saved?'Score saved to Miss Martha’s dashboard.':'Saving score…'}</p><button id="ag">PLAY AGAIN</button></section>`;ag.onclick=()=>{localStorage.removeItem(S);st=null;land()}}async function submit(){if(st.saved||sending)return;sending=true;try{let s=sc(),r=await fetch(E,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:st.name,student_group:'9A',game_id:G,grade:'9A',score:s,max_score:25,percentage:s*4,completed:true})});if(!r.ok)throw 0;st.saved=true;save();sv.textContent='Score saved to Miss Martha’s dashboard.'}catch(e){sv.textContent='Could not save automatically. Your screenshot still works.'}sending=false}try{let r=JSON.parse(localStorage.getItem(S));if(r)st=r}catch(e){}if(!st)land();else if(st.finished){result();submit()}else render();</script></body></html>
