<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDG Crisis Room | Teacher</title>
<style>body{font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;background:#fff8d7;color:#17324d;margin:0}header{background:#ff6fb7;color:white;padding:16px 5%;font-weight:950}main{max-width:1200px;margin:30px auto;padding:0 18px}.card{background:white;border:2px solid #17324d;border-radius:22px;padding:26px;box-shadow:8px 8px 0 #b9e7ef}input,select,button{font:inherit;padding:11px;border:2px solid #9eb9c5;border-radius:10px}button{font-weight:900}.primary{background:#4ecbff}.hidden{display:none}.controls,.stats{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:20px 0}.stat{background:#e8fbff;padding:14px 18px;border-radius:12px}.stat b{display:block;font-size:34px;color:#ff5c8a}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #dce7eb;text-align:left}.pct{font-size:28px;font-weight:950;color:#ff5c8a}</style></head><body><header>🌍 SDG CRISIS ROOM · TEACHER DASHBOARD</header><main><section class="card"><h1>7A MUN · Final Review</h1><form id="login"><input id="code" type="password" placeholder="Teacher code" required> <button class="primary">OPEN</button></form><p id="msg">Enter your teacher code.</p><section id="dash" class="hidden"><div class="controls"><input id="search" placeholder="Find student"><select id="sort"><option value="new">Most recent</option><option value="high">Highest</option><option value="low">Lowest</option></select><button id="refresh" class="primary">REFRESH</button></div><div class="stats"><div class="stat"><b id="count">0</b>submissions</div><div class="stat"><b id="avg">—</b>average</div></div><table><thead><tr><th>Student</th><th>Group</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script>"use strict";const E="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results",G="260918_7A_MUN_SDG_CRISIS_ROOM",el=id=>document.getElementById(id);let data=[],code="";function render(){const s=search.value.toLowerCase();let l=data.filter(r=>String(r.student_name).toLowerCase().includes(s));l.sort((a,b)=>sort.value==="high"?b.percentage-a.percentage:sort.value==="low"?a.percentage-b.percentage:new Date(b.created_at||0)-new Date(a.created_at||0));rows.replaceChildren();l.forEach(r=>{const tr=document.createElement("tr");[r.student_name,r.student_group,`${r.score}/${r.max_score}`,`${r.percentage}%`,new Date(r.created_at||r.completed_at||0).toLocaleString()].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===3)td.className="pct";tr.appendChild(td)});rows.appendChild(tr)});count.textContent=l.length;avg.textContent=l.length?Math.round(l.reduce((n,r)=>n+Number(r.percentage||0),0)/l.length)+"%":"—"}async function load(){msg.textContent="Loading…";try{const r=await fetch(E+"?game_id="+G,{headers:{"x-teacher-code":code},cache:"no-store"});if(!r.ok)throw Error("Teacher code not accepted.");const j=await r.json();data=(j.results||[]).filter(x=>x.game_id===G);login.classList.add("hidden");dash.classList.remove("hidden");render();msg.textContent="Updated."}catch(e){msg.textContent=e.message}}login.onsubmit=e=>{e.preventDefault();code=el("code").value.trim();load()};refresh.onclick=load;search.oninput=render;sort.onchange=render;</script></body></html>
