<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italics Style Showdown</title><style>:root{--r:#ff2d2d;--b:#1f5cff;--y:#ffd500;--g:#18c94e;--k:#17223b}*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Comic Sans MS","Marker Felt",Arial,sans-serif;background:linear-gradient(135deg,#fff38c,#bfe8ff 45%,#ffc0d8 72%,#d7c7ff);color:var(--k);font-size:22px}header{position:sticky;top:0;background:#fff;border-bottom:4px solid var(--k);padding:16px 5%;font-weight:900;z-index:5}.brand{font-family:"Comic Sans MS","Trebuchet MS",cursive;font-size:28px}.brand b{color:var(--r)}main{max-width:980px;margin:28px auto;padding:0 16px 42px}.card{background:#fff;border:4px solid var(--k);border-radius:28px;padding:28px;box-shadow:10px 10px 0 var(--y)}.hero{text-align:center}h1{font-family:"Comic Sans MS","Trebuchet MS",cursive;font-size:clamp(58px,10vw,100px);line-height:.9;margin:12px 0}h1 em{color:var(--b)}.sub{font-size:30px;font-weight:900}.pills{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:20px 0}.pill,.badge{padding:8px 13px;border-radius:999px;border:3px solid var(--k);font-weight:900}.pill:nth-child(1),.badge{background:var(--y)}.pill:nth-child(2){background:#a8d9ff}.pill:nth-child(3){background:#ffabc7}.pill:nth-child(4){background:#a9efba}label{display:block;font-weight:900;margin:15px 0 7px}input{width:100%;font:inherit;padding:15px;border:3px solid #9aacc0;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;font-size:22px;font-weight:900;border:3px solid var(--k);border-radius:16px;padding:15px 17px;background:#fff;box-shadow:0 5px 0 var(--k);cursor:pointer}.primary{background:var(--r);color:#fff}.next{background:var(--g)}.progress{height:18px;background:#e8eef6;border:3px solid var(--k);border-radius:99px;overflow:hidden;margin:20px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--r),var(--y),var(--g),var(--b))}.question h2{font-family:"Comic Sans MS","Trebuchet MS",cursive;font-size:clamp(38px,6vw,56px);line-height:1.08}.options{display:grid;gap:13px}.opt{text-align:left;box-shadow:none}.feedback{margin-top:20px;padding:19px;border:3px solid var(--g);border-radius:16px;background:#eaffee}.wrong{border-color:#d84d82;background:#fff0f5}.feedback strong{font-size:29px}.pct{font-size:clamp(105px,18vw,170px);font-weight:950;color:var(--b);line-height:.9}.score{font-size:40px;font-weight:950}.evidence{background:#d9ff8f;padding:14px;border:3px solid var(--k);border-radius:12px;font-weight:900}.err{color:#b6316e}.small{font-size:16px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:20px}.brand{font-size:22px}.opt{font-size:20px}}</style></head><body><header><div class="brand">✨ ITALICS <b>STYLE SHOWDOWN</b><div class="small">8A ENGLISH · 260918</div></div></header><main id="app"></main><script>const Q=[['WARM-UP','Which title should be italicized?',['A short story: “The Tell-Tale Heart”','A poem: “Still I Rise”','A novel: The Giver','A song: “Happy”'],2,'Long works such as novels are italicized.'],['WARM-UP','Which title should NOT be italicized?',['The Hunger Games','National Geographic','The New York Times','“The Road Not Taken”'],3,'Poems are short works and usually use quotation marks.'],['WARM-UP','Which sentence uses italics correctly?',['I watched *Inside Out 2* last night.','I read *“The Raven”* in class.','We listened to *“Flowers”*.','She wrote an essay called *My Summer*.'],0,'Movie titles are italicized.'],['WARM-UP','Which item is usually italicized?',['A chapter title','A magazine title','A song title','A short story title'],1,'Magazine titles are italicized.'],['WARM-UP','Which item usually uses quotation marks instead?',['A movie','A book','A newspaper','A song'],3,'Songs are short works.'],['TITLE TRAPS','Choose the correctly formatted sentence.',['We read “Harry Potter and the Sorcerer’s Stone.”','We read *Harry Potter and the Sorcerer’s Stone*.','We read Harry Potter and the Sorcerer’s Stone.','We read HARRY POTTER AND THE SORCERER’S STONE.'],1,'Book titles are italicized.'],['TITLE TRAPS','Which should be italicized?',['“The Lottery”','“Bohemian Rhapsody”','The Wall Street Journal','“The Road Not Taken”'],2,'Newspaper titles are italicized.'],['TITLE TRAPS','Which should stay in quotation marks?',['Frozen','Time','“The Necklace”','The Odyssey'],2,'Short story titles use quotation marks.'],['TITLE TRAPS','Which sentence is correct?',['My favorite episode is *The One Where No One’s Ready*.','My favorite episode is “The One Where No One’s Ready.”','My favorite episode is The One Where No One’s Ready.','My favorite episode is **The One Where No One’s Ready**.'],1,'TV episode titles use quotation marks.'],['TITLE TRAPS','Which sentence is correct?',['We watched the series *Wednesday*.','We watched the series “Wednesday.”','We watched the series Wednesday with no formatting.','We watched the series **Wednesday**.'],0,'TV series titles are italicized.'],['PURPOSE','In which sentence are italics used for emphasis?',['I said I wanted the *blue* notebook, not the red one.','We read *The Giver*.','The ship *Titanic* sank in 1912.','The word *run* can be a noun or a verb.'],0,'Italics can emphasize contrast.'],['PURPOSE','Which sentence uses italics to refer to a word as a word?',['I really *love* this song.','The word *because* introduces a reason.','I watched *Coco*.','The magazine *Time* is well known.'],1,'Words discussed as words can be italicized.'],['PURPOSE','Which use of italics is BEST?',['I *really really really* like pizza.','That was *so* amazing!!!','I said *Thursday*, not Tuesday.','Every adjective is italicized.'],2,'Italics work best for meaningful emphasis.'],['PURPOSE','Why is overusing italics a problem?',['It makes every sentence passive.','It can make emphasis less effective.','It changes verb tense.','It creates fragments.'],1,'Too much emphasis weakens emphasis.'],['PURPOSE','Which sentence uses italics appropriately?',['Please bring your *notebook* because notebooks are useful.','I wanted the *small* box, not the large one.','The *dog* ran across the *yard*.','She *quickly* finished the *assignment*.'],1,'The italics show real contrast.'],['SPECIAL CASES','Which name is commonly italicized in formal writing?',['A school','A ship','A city','A country'],1,'Names of ships are traditionally italicized.'],['SPECIAL CASES','Which sentence is correctly formatted?',['The *Titanic* was a famous ship.','The “Titanic” was a famous ship.','The Titanic was a famous ship with quotation marks.','The TITANIC was a famous ship.'],0,'Ship names are italicized.'],['SPECIAL CASES','Which correctly formats a scientific name?',['Homo sapiens','*Homo sapiens*','“Homo sapiens”','HOMO SAPIENS'],1,'Genus and species are italicized.'],['SPECIAL CASES','Which sentence does NOT need italics for the common English word?',['I ordered a *croissant*.','I read *The Hobbit*.','The word *however* can signal contrast.','The ship *Endeavour* sailed south.'],0,'Common English loanwords usually do not need italics.'],['SPECIAL CASES','Which statement is best about unfamiliar foreign words?',['They may be italicized, especially on first use.','They must always be in quotation marks.','They must be bold.','They must be ALL CAPS.'],0,'Unfamiliar foreign expressions are often italicized.'],['FINAL BOSS','Which sentence is fully correct?',['We watched “Avatar” and discussed *The Lottery*.','We watched *Avatar* and discussed “The Lottery.”','We watched *“Avatar”* and discussed The Lottery.','We watched Avatar and discussed The Lottery.'],1,'Movies are italicized; short stories use quotation marks.'],['FINAL BOSS','Which sentence is fully correct?',['I read *Time* magazine and the article *“Person of the Year.”*','I read “Time” magazine and the article *Person of the Year*.','I read *Time* magazine and the article “Person of the Year.”','I read Time magazine and the article Person of the Year.'],2,'Magazine titles are italicized; article titles use quotation marks.'],['FINAL BOSS','Which sentence uses italics for the clearest reason?',['I *absolutely totally completely* agree.','I said *fifteen*, not fifty.','The *students* opened their *books*.','We *walked* to the *library*.'],1,'Italics clearly mark contrast.'],['FINAL BOSS','Which pair is formatted correctly?',['Book = quotation marks; chapter = italics','Movie = quotation marks; song = italics','Novel = italics; poem = quotation marks','Newspaper = quotation marks; article = italics'],2,'Long works are italicized; short works use quotation marks.'],['FINAL BOSS','FINAL ROUND: Which sentence follows all the rules?',['In *The Giver*, the word *release* has a special meaning.','In “The Giver,” the word release has a special meaning.','In The Giver, the word “release” has a special meaning.','In *“The Giver”*, the word **release** has a special meaning.'],0,'The novel title and the word being discussed are italicized.']];const EDGE='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',GAME='260918_8A_ITALICS_STYLE_SHOWDOWN',DOMAIN='@colegiointernacional.edu.mx';let s=null,lock=false;const app=document.getElementById('app');const fmt=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*(.*?)\*/g,'<em>$1</em>');function land(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY REVIEW · 260918</span><h1>ITALICS<br><em>STYLE SHOWDOWN!</em></h1><div class="sub">25 rounds · fun font mode</div><div class="pills"><span class="pill">LONG WORKS</span><span class="pill">SHORT WORKS</span><span class="pill">EMPHASIS</span><span class="pill">SPECIAL CASES</span></div><form id="form"><div class="grid"><div><label>Full name</label><input id="name" required></div><div><label>School email</label><input id="email" type="email" required></div></div><label>Group</label><input value="8A" readonly><p class="err" id="err"></p><button class="primary">LET’S PLAY! →</button></form></section>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let n=document.getElementById('name').value.trim(),m=document.getElementById('email').value.trim().toLowerCase();if(n.length<3)return document.getElementById('err').textContent='Enter your full name.';if(!m.endsWith(DOMAIN))return document.getElementById('err').textContent='Use your school email.';s={name:n,i:0,a:[]};render()}}function render(){lock=false;let q=Q[s.i];app.innerHTML=`<section class="card question"><span class="badge">${q[0]}</span><div class="progress"><div style="width:${Math.round(s.i/25*100)}%"></div></div><h2>${fmt(q[1])}</h2><div class="options">${q[2].map((x,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(65+j)}. ${fmt(x)}</button>`).join('')}</div><div id="feed"></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j))}function pick(j){if(lock)return;lock=true;let q=Q[s.i],ok=j===q[3];s.a.push(ok);document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.getElementById('feed').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'✅ STYLE POINT!':'⚠️ FORMAT TRAP!'}</strong><p>${fmt(q[4])}</p>${ok?'':`<p><b>Correct:</b> ${fmt(q[2][q[3]])}</p>`}<button id="next" class="next">${s.i===24?'SHOW MY SCORE! →':'KEEP GOING! →'}</button></div>`;document.getElementById('next').onclick=()=>{s.i++;s.i>=25?finish():render()}}function finish(){let sc=s.a.filter(Boolean).length,p=sc*4;app.innerHTML=`<section class="card hero"><span class="badge">FINAL RESULT</span><h1>STYLE<br><em>MASTERED!</em></h1><h2>${s.name}</h2><div class="pct">${p}%</div><div class="score">${sc} / 25</div><div class="evidence">Take a screenshot of this screen for your class evidence.</div><p id="save">Saving score…</p></section>`;fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:s.name,student_group:'8A',game_id:GAME,grade:'8A',score:sc,max_score:25,percentage:p,completed:true})}).then(r=>document.getElementById('save').textContent=r.ok?'Score saved to Miss Martha’s dashboard.':'Screenshot still works.').catch(()=>document.getElementById('save').textContent='Screenshot still works.')}land();</script></body></html>
