<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDG Crisis Room | 7A MUN</title><style>:root{--ink:#17324d;--sky:#4ecbff;--sun:#ffd84d;--pink:#ff6fb7;--green:#7ce38b;--purple:#8b6cff;--orange:#ff9b50;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7c9,#dff7ff 45%,#ffe1f0 100%);font-size:18px}header{padding:15px 5%;background:#ffffffdd;backdrop-filter:blur(8px);display:flex;justify-content:space-between;border-bottom:2px solid #17324d;position:sticky;top:0;z-index:5}.brand{font-weight:950}.brand b{color:#ff5c8a}main{max-width:980px;margin:28px auto;padding:0 18px 42px}.card{background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:28px;box-shadow:8px 8px 0 #b9e7ef}.hero{text-align:center}.hero h1{font-size:clamp(48px,9vw,92px);line-height:.9;margin:10px 0}.hero h1 span{color:#ff5c8a}.sub{font-size:24px;font-weight:900}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}.chip{padding:7px 12px;border-radius:99px;font-weight:900;background:#fff1a8}.chip:nth-child(2){background:#c8f2ff}.chip:nth-child(3){background:#ffd0e5}.chip:nth-child(4){background:#d6ffc9}label{display:block;font-weight:900;margin:14px 0 7px}input{width:100%;font:inherit;padding:13px;border:2px solid #9eb9c5;border-radius:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;font-weight:950;border:2px solid var(--ink);border-radius:14px;padding:13px 18px;background:white;box-shadow:0 4px 0 var(--ink);cursor:pointer}.primary{background:var(--pink);color:white;border-color:#d74b8f}.lime{background:var(--green)}.badge{display:inline-block;background:var(--sun);padding:6px 10px;border-radius:9px;font-weight:950;font-size:13px}.progress{height:14px;background:#e8eef2;border-radius:99px;overflow:hidden;margin:18px 0 26px}.progress div{height:100%;background:linear-gradient(90deg,var(--sky),var(--green),var(--sun),var(--pink),var(--purple))}.question h2{font-size:clamp(30px,5vw,46px);line-height:1.08}.options{display:grid;gap:12px}.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;box-shadow:none;border-color:#b4c9d1}.opt b{min-width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#e7f8ff}.opt.selected{background:#fff0f7;border-color:#ff6fb7}.feedback{margin-top:22px;padding:20px;border-radius:16px;background:#e9ffe8;border:2px solid #5cad68}.feedback.wrong{background:#fff0f5;border-color:#c74b77}.pct{font-size:clamp(92px,18vw,170px);font-weight:950;line-height:.9;color:#ff5c8a}.score{font-size:36px;font-weight:950}.evidence{background:#d7ff98;padding:14px;border-radius:12px;font-weight:900;margin:18px 0}.error{color:#b23c65;min-height:22px}@media(max-width:650px){.grid2{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><header><div class="brand">🌍 SDG <b>CRISIS ROOM</b><div style="font-size:11px;letter-spacing:2px">7A MUN · FRIDAY MISSION</div></div><div id="timer"></div></header><main id="app"></main><script>"use strict";const Q=[['A city has repeated water shortages and unsafe drinking water. Which SDG is the best match?',['SDG 4 Quality Education','SDG 6 Clean Water and Sanitation','SDG 8 Decent Work','SDG 15 Life on Land'],1,'Clean water access and sanitation are directly connected to SDG 6.'],['Thousands of students stop attending school after a natural disaster. Which SDG should delegates prioritize first?',['SDG 4 Quality Education','SDG 9 Industry, Innovation and Infrastructure','SDG 12 Responsible Consumption','SDG 16 Peace, Justice and Strong Institutions'],0,'School access and learning continuity belong to SDG 4.'],['A coastal town loses homes because of rising sea levels. Which SDG is most directly involved?',['SDG 13 Climate Action','SDG 2 Zero Hunger','SDG 7 Affordable and Clean Energy','SDG 10 Reduced Inequalities'],0,'Sea-level rise is a climate-change impact, so SDG 13 is central.'],['A country throws away tons of edible food while many families lack meals. Which pair fits best?',['SDG 2 + SDG 12','SDG 5 + SDG 16','SDG 7 + SDG 9','SDG 14 + SDG 15'],0,'Hunger and food waste connect strongly to SDG 2 and SDG 12.'],['Who should be part of a realistic response to an urban air-pollution crisis?',['Only students','Only the UN','Government, transport sector, citizens, and experts','Only hospitals'],2,'Complex problems need multiple stakeholders working together.'],['Which proposal is the MOST realistic for improving school attendance?',['Close schools until attendance improves','Provide transport support and safe access to schools','Cancel homework forever','Only punish absent students'],1,'A realistic policy addresses barriers instead of only punishing outcomes.'],['A delegate says, “We will solve poverty everywhere next month.” What is the main problem?',['Too specific','Not realistic or measurable','Too polite','Too short'],1,'MUN solutions should be realistic, measurable, and achievable.'],['Which solution best supports SDG 11 Sustainable Cities and Communities?',['Expand safe public transportation','Ban all parks','Use more single-use plastic','Reduce emergency planning'],0,'Safe and sustainable transport is strongly linked to SDG 11.'],['A health crisis spreads quickly because clinics lack supplies. Which SDG is central?',['SDG 3 Good Health and Well-Being','SDG 6 Clean Water','SDG 8 Decent Work','SDG 17 Partnerships'],0,'Health services and access to care are core to SDG 3.'],['Which response sounds most like a strong MUN resolution idea?',['We hope things improve.','Create a funded regional program with annual progress reports.','Everyone should just try harder.','The problem is bad.'],1,'Strong proposals explain action, resources, and accountability.'],['A rural community has no reliable electricity. Which SDG is the closest fit?',['SDG 7 Affordable and Clean Energy','SDG 14 Life Below Water','SDG 5 Gender Equality','SDG 16 Peace, Justice and Strong Institutions'],0,'Energy access is directly linked to SDG 7.'],['Which stakeholder would be MOST useful in a youth unemployment crisis?',['Employers and vocational-training institutions','Only tourists','Only sports teams','Only museums'],0,'Employers and training institutions can directly expand job pathways.'],['A delegate wants to reduce plastic entering oceans. Which SDG is most directly targeted?',['SDG 14 Life Below Water','SDG 1 No Poverty','SDG 4 Quality Education','SDG 8 Decent Work'],0,'Marine pollution is central to SDG 14.'],['Which is the BEST first step in a crisis-room discussion?',['Choose a random SDG','Identify the problem and who is affected','Vote immediately','Write the final speech first'],1,'Good policy starts with defining the problem and affected groups.'],['FINAL CRISIS: A city faces flooding, school closures, damaged hospitals, and displaced families. What is the best MUN approach?',['Pick only one SDG and ignore the rest','Use a multi-SDG response with coordinated stakeholders','Wait until next year','Focus only on social media awareness'],1,'Real crises often require coordinated action across several SDGs.']];const EDGE='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',GAME='260918_7A_MUN_SDG_CRISIS_ROOM',DOMAIN='@colegiointernacional.edu.mx';let s=null,locked=false;const app=document.getElementById('app');function landing(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY · FINAL SDG CHALLENGE</span><h1>SDG<br><span>CRISIS ROOM</span></h1><div class="sub">15 crisis decisions. Think like a delegate.</div><div class="chips"><span class="chip">Identify the SDG</span><span class="chip">Choose stakeholders</span><span class="chip">Pick realistic solutions</span><span class="chip">Final crisis</span></div><form id="start"><div class="grid2"><div><label>Full name</label><input id="name" required></div><div><label>School email</label><input id="email" type="email" required placeholder="name@colegiointernacional.edu.mx"></div></div><label>Group</label><input value="7A" readonly><p class="error" id="err"></p><button class="primary">ENTER THE CRISIS ROOM →</button></form></section>`;start.onsubmit=e=>{e.preventDefault();let n=name.value.trim(),m=email.value.trim().toLowerCase();if(n.length<3){err.textContent='Enter your full name.';return}if(!m.endsWith(DOMAIN)){err.textContent='Use your school email.';return}s={name:n,i:0,a:[],started:Date.now()};render()}}function render(){locked=false;let q=Q[s.i],p=Math.round(s.i/Q.length*100);app.innerHTML=`<section class="card question"><span class="badge">${s.i===Q.length-1?'FINAL CRISIS':'CRISIS '+(s.i+1)}</span><div class="progress"><div style="width:${p}%"></div></div><h2>${q[0]}</h2><div class="options">${q[1].map((x,j)=>`<button class="opt" data-i="${j}"><b>${String.fromCharCode(65+j)}</b><span>${x}</span></button>`).join('')}</div><div id="feed"></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i))}function pick(j){if(locked)return;locked=true;let q=Q[s.i],ok=j===q[2];s.a.push(ok);document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add('selected')});feed.innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'✅ DELEGATE POINT WON':'⚠️ RECONSIDER'}</strong><p>${q[3]}</p>${!ok?`<p><b>Best answer:</b> ${q[1][q[2]]}</p>`:''}<button id="next" class="lime">${s.i===Q.length-1?'SEE MY SCORE →':'NEXT CRISIS →'}</button></div>`;next.onclick=()=>{s.i++;s.i>=Q.length?result():render()}}function result(){let sc=s.a.filter(Boolean).length,p=Math.round(sc/Q.length*100);app.innerHTML=`<section class="card hero"><span class="badge">MISSION COMPLETE</span><h1>CRISIS<br><span>RESOLVED</span></h1><h2>${s.name}</h2><p><b>7A MUN · Sept. 18, 2026</b></p><div class="pct">${p}%</div><div class="score">${sc} / ${Q.length}</div><div class="evidence">Take a screenshot of this screen for your class evidence.</div><div id="save">Saving score…</div></section>`;fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:s.name,student_group:'7A',game_id:GAME,grade:'7A',score:sc,max_score:Q.length,percentage:p,completed:true})}).then(r=>save.textContent=r.ok?'Score saved to Miss Martha\'s dashboard.':'Screenshot still works.').catch(()=>save.textContent='Screenshot still works.')}setInterval(()=>{if(s){let z=Math.floor((Date.now()-s.started)/1000);timer.textContent=String(Math.floor(z/60)).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}},1000);landing();</script></body></html>
