<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8A Tense Tracker</title>
<style>
:root{--bg:#071c2c;--cyan:#20e3d2;--pink:#ff4fa3;--lime:#c6ff45;--orange:#ff9e38;--purple:#a76cff;--yellow:#ffe34d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16334d,#071c2c 70%);font-family:Verdana,Arial,sans-serif;color:#fff;min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:20px}h1{font-size:clamp(36px,6vw,68px);margin:0}.sub{font-size:20px;opacity:.9}
.top{padding:20px;border:2px solid #2b5875;border-radius:24px;background:rgba(255,255,255,.04)}.board{display:grid;gap:16px;margin-top:18px}
.card{background:#fff;color:#0c1d2c;border-radius:20px;padding:20px;font-size:clamp(20px,2.3vw,30px);font-weight:900;line-height:1.25;box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:grab;border:4px solid var(--yellow)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.zone{min-height:130px;border-radius:22px;padding:14px;border:3px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.06)}
.zone h3{font-size:22px;margin:0 0 10px}.zone.active{transform:scale(1.02);border-color:white}
button{border:0;border-radius:16px;padding:15px 20px;font-size:20px;font-weight:900;cursor:pointer}.btn{background:var(--pink);color:#fff}
.score{font-weight:900;font-size:22px}.msg{min-height:28px;font-size:20px;font-weight:800;margin:12px 0}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--lime);color:#071c2c;font-weight:900}
</style></head><body>
<style>
#loginGate{position:fixed;inset:0;background:linear-gradient(135deg,#10152d,#273b7a);display:grid;place-items:center;z-index:9999;padding:20px}
#loginCard{width:min(620px,96vw);background:white;color:#17203b;border-radius:26px;padding:26px;box-shadow:0 20px 70px #0008}
#loginCard h2{font-size:34px;margin:0 0 8px}#loginCard input{width:100%;padding:15px;margin:8px 0 14px;border:2px solid #aebbd0;border-radius:14px;font-size:19px;color:#17203b;background:white}
#loginCard button{width:100%;padding:15px;border:0;border-radius:14px;font-size:20px;font-weight:900;background:#ffd93d;color:#18203a;cursor:pointer}
#loginErr{color:#b42318;font-weight:800;min-height:22px}
</style>
<div id="loginGate"><div id="loginCard"><h2>Tense Tracker</h2><p><b>8A English</b> · Enter your school information to begin.</p><label>Full name</label><input id="studentName" autocomplete="name"><label>School email</label><input id="studentEmail" type="email" placeholder="name@colegiointernacional.edu.mx"><div id="loginErr"></div><button id="beginGame">BEGIN</button></div></div>
<div class="wrap">
<div class="top"><h1>TENSE TRACKER</h1><div class="sub">8A English · Drag each sentence to the correct tense</div><p><span class="pill">TIP</span> Look for the time clues.</p><div class="score">Score: <span id="score">0</span> / 15</div></div>
<div class="board"><div id="card" class="card" draggable="true"></div><div id="msg" class="msg"></div><div id="zones" class="zones"></div><button class="btn" onclick="restart()">Restart & Shuffle</button></div></div>
<script>
const items=[{"text":"He has already finished his science project.","ans":"Present Perfect"},{"text":"They will travel to Monterrey next month.","ans":"Future Simple"},{"text":"My brother walks to school every morning.","ans":"Present Simple"},{"text":"I was doing my homework when my friend called me.","ans":"Past Continuous"},{"text":"They are playing basketball in the yard at the moment.","ans":"Present Continuous"},{"text":"She visited her grandmother last weekend.","ans":"Past Simple"},{"text":"We have lived in this neighborhood for five years.","ans":"Present Perfect"},{"text":"I will call my cousin after dinner tonight.","ans":"Future Simple"},{"text":"We usually eat dinner at 8:00 p.m.","ans":"Present Simple"},{"text":"My dad is cooking dinner right now.","ans":"Present Continuous"},{"text":"They were sleeping when the teacher entered the room.","ans":"Past Continuous"},{"text":"She has just cleaned her room.","ans":"Present Perfect"},{"text":"I am studying for my English test right now.","ans":"Present Continuous"},{"text":"We watched a movie last night.","ans":"Past Simple"},{"text":"I will help you with your presentation tomorrow.","ans":"Future Simple"}];const cats=["Present Simple","Present Continuous","Past Simple","Past Continuous","Present Perfect","Future Simple"];let q=[],idx=0,score=0,current=null;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function makeZones(){const z=document.getElementById('zones');z.innerHTML='';shuffle(cats).forEach((c,k)=>{let d=document.createElement('div');d.className='zone';d.dataset.cat=c;d.style.borderColor=['#20e3d2','#ff4fa3','#c6ff45','#ff9e38','#a76cff','#ffe34d'][k%6];d.innerHTML='<h3>'+c+'</h3><div style="opacity:.75;font-size:14px">Drop here</div>';d.ondragover=e=>{e.preventDefault();d.classList.add('active')};d.ondragleave=()=>d.classList.remove('active');d.ondrop=e=>{e.preventDefault();d.classList.remove('active');check(c)};z.appendChild(d)})}
function restart(){q=shuffle(items);idx=0;score=0;document.getElementById('score').textContent='0';document.getElementById('msg').textContent='';makeZones();show()}
function show(){if(idx>=q.length){finish();return}current=q[idx];let c=document.getElementById('card');c.textContent=current.text;c.draggable=true;c.style.opacity='1'}
document.getElementById('card').ondragstart=e=>e.dataTransfer.setData('text/plain','x');
function check(cat){if(!current)return;if(cat===current.ans){score++;document.getElementById('score').textContent=score;document.getElementById('msg').textContent='Correct!';idx++;current=null;setTimeout(show,400)}else document.getElementById('msg').textContent='Try again — look for the time clue.'}
function finish(){MM_save(score);const c=document.getElementById('card');c.draggable=false;c.innerHTML='<div style="text-align:center;font-size:38px">Finished!</div><div style="text-align:center;font-size:54px;margin-top:10px">'+score+' / '+q.length+'</div><div style="text-align:center;font-size:20px;margin-top:14px">Take a screenshot and upload it to Algebraix.</div>';document.getElementById('msg').textContent=''}
restart();
</script>
<script>
const MM_EDGE="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results", MM_GAME="260923_8A_TENSE_TRACKER", MM_GRADE="8A", MM_MAX=15;
let MM_STUDENT={name:'',email:''}, MM_SAVED=false;
document.getElementById('beginGame').onclick=()=>{const n=document.getElementById('studentName').value.trim(),e=document.getElementById('studentEmail').value.trim().toLowerCase(),err=document.getElementById('loginErr');if(n.length<3){err.textContent='Please enter your full name.';return}if(!e.endsWith('@colegiointernacional.edu.mx')){err.textContent='Use your school email: @colegiointernacional.edu.mx';return}MM_STUDENT={name:n,email:e};document.getElementById('loginGate').remove();};
async function MM_save(score){if(MM_SAVED||!MM_STUDENT.name)return;const pct=Math.round(score/MM_MAX*100);try{const r=await fetch(MM_EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:MM_STUDENT.name,student_group:MM_GRADE,game_id:MM_GAME,grade:MM_GRADE,score:score,max_score:MM_MAX,percentage:pct,completed:true})});if(r.ok)MM_SAVED=true;}catch(e){}}
</script>
</body></html>
