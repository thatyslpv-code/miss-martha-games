<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italics Teacher</title><style>body{font-family:Arial,sans-serif;background:#fff5fb;color:#17223b;margin:0}header{background:#ff4f9a;color:white;padding:16px;font-weight:900}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border:2px solid #17223b;border-radius:20px;padding:22px}input,select,button{padding:10px;font-size:16px;border:2px solid #adb8c5;border-radius:9px}button{font-weight:800}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.pct{font-size:26px;font-weight:900;color:#775cff}</style></head><body><header>✨ ITALICS STYLE SHOWDOWN · TEACHER</header><main><section class="card"><h1>8A English · Italics</h1><form id="login"><input id="code" type="password" placeholder="Teacher code" required><button>OPEN</button></form><p id="msg"></p><section id="dash" class="hidden"><input id="search" placeholder="Find student"><select id="sort"><option value="new">Most recent</option><option value="high">Highest</option><option value="low">Lowest</option></select><button id="refresh">REFRESH</button><h2><span id="count">0</span> submissions · Average <span id="avg">—</span></h2><table><thead><tr><th>Student</th><th>Group</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script>const E="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results",G="260918_8A_ITALICS_STYLE_SHOWDOWN";let data=[],code="";const el=id=>document.getElementById(id);function render(){let q=el("search").value.toLowerCase(),l=data.filter(r=>String(r.student_name).toLowerCase().includes(q));l.sort((a,b)=>el("sort").value==="high"?b.percentage-a.percentage:el("sort").value==="low"?a.percentage-b.percentage:new Date(b.created_at||0)-new Date(a.created_at||0));el("rows").innerHTML="";l.forEach(r=>{let tr=document.createElement("tr");[r.student_name,r.student_group,r.score+"/"+r.max_score,r.percentage+"%",new Date(r.created_at||0).toLocaleString()].forEach((v,i)=>{let td=document.createElement("td");td.textContent=v;if(i===3)td.className="pct";tr.appendChild(td)});el("rows").appendChild(tr)});el("count").textContent=l.length;el("avg").textContent=l.length?Math.round(l.reduce((n,r)=>n+Number(r.percentage||0),0)/l.length)+"%":"—"}async function load(){el("msg").textContent="Loading…";try{let r=await fetch(E+"?game_id="+encodeURIComponent(G),{headers:{"x-teacher-code":code},cache:"no-store"});if(!r.ok)throw Error("Teacher code was not accepted.");let j=await r.json();data=(j.results||[]).filter(x=>x.game_id===G);el("login").classList.add("hidden");el("dash").classList.remove("hidden");render();el("msg").textContent="Updated."}catch(e){el("msg").textContent=e.message}}el("login").onsubmit=e=>{e.preventDefault();code=el("code").value.trim();load()};el("refresh").onclick=load;el("search").oninput=render;el("sort").onchange=render;</script></body></html>
