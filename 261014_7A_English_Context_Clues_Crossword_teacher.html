<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miss Martha · 7A Calificaciones</title><style>body{background:#173558;color:white;font:17px Arial;max-width:1100px;margin:30px auto;padding:20px}input,button{font:inherit;padding:12px;margin:10px;border-radius:8px}button{cursor:pointer;background:#ffcf56;border:0}table{background:white;color:#173558}th,td{border-bottom:1px solid #abc;text-align:left}.row{display:flex;flex-wrap:wrap}</style><body><section class="card" id="gradesPanel"><h2>Miss Martha · Calificaciones de 7A</h2><p>Context Clues Crossword · Unit 2 · Chapter 6</p><label for="teacherCode">Tu clave privada</label><input type="password" id="teacherCode" autocomplete="off"><div class="row controls"><button class="primary" id="loadGrades">VER / ACTUALIZAR CALIFICACIONES</button><button class="secondary" id="exportGrades" disabled>DESCARGAR CSV PARA EXCEL</button><button class="secondary" id="clearGrades">CERRAR CONSULTA</button></div><p id="gradesStatus" role="status">Escribe tu clave para consultar los resultados.</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse" id="gradesTable"></table></div><p class="small">Se muestran todos los intentos, con fecha y hora de México. Actualiza para recibir entregas nuevas.</p></section><p><a style="color:#ffcf56" href="261014_7A_English_Context_Clues_Crossword_student.html">Abrir juego de estudiantes</a></p><script>const $=id=>document.getElementById(id);const RESULTS_API="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/context-crossword-results";const API_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvaW5qeWdpYmR6a29vbnV2a25kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODI3MjYsImV4cCI6MjEwNDk1ODcyNn0.tTi2XYizvA1l_mHRxxfcZjamuxIt4uuQk691rRGfPv4";let receivedGrades=[];
function dateMx(s){return new Date(s).toLocaleString("es-MX",{timeZone:"America/Mexico_City"})}
function renderGrades(){const table=$("gradesTable");table.replaceChildren();const head=document.createElement("tr");["Alumno","Grupo","Calificación / 10","Puntos / 100","Aciertos / 12","Tiempo","Entrega"].forEach(s=>{const th=document.createElement("th");th.textContent=s;th.style.padding="12px";head.append(th)});table.append(head);receivedGrades.forEach(r=>{const tr=document.createElement("tr");[r.student_name,r.student_group,(r.score/10).toFixed(1),r.score,r.correct,Math.floor(r.elapsed_seconds/60)+":"+String(r.elapsed_seconds%60).padStart(2,"0"),dateMx(r.created_at)].forEach(s=>{const td=document.createElement("td");td.textContent=s;td.style.padding="12px";tr.append(td)});table.append(tr)})}
$("loadGrades").onclick=async()=>{const button=$("loadGrades");button.disabled=true;receivedGrades=[];$("gradesTable").replaceChildren();$("exportGrades").disabled=true;$("gradesStatus").textContent="Consultando…";try{const r=await fetch(RESULTS_API,{method:"POST",headers:{"Content-Type":"application/json",apikey:API_KEY,Authorization:"Bearer "+API_KEY},body:JSON.stringify({action:"list",code:$("teacherCode").value}),signal:AbortSignal.timeout(15000)});const data=await r.json();if(!r.ok)throw new Error(r.status===403?"Clave incorrecta.":"No se pudo consultar. Intenta nuevamente.");receivedGrades=data.results;renderGrades();$("exportGrades").disabled=!receivedGrades.length;$("gradesStatus").textContent=receivedGrades.length+" intentos recibidos. Actualizado: "+dateMx(new Date().toISOString());}catch(e){$("gradesStatus").textContent=e.message||"No hay conexión."}finally{button.disabled=false}};
$("clearGrades").onclick=()=>{receivedGrades=[];$("teacherCode").value="";$("gradesTable").replaceChildren();$("exportGrades").disabled=true;$("gradesStatus").textContent="Consulta cerrada."};
$("exportGrades").onclick=()=>{const csvCell=s=>{s=String(s);if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const rows=[["Alumno","Grupo","Calificación / 10","Puntos / 100","Aciertos / 12","Segundos","Fecha México","Intento"],...receivedGrades.map(r=>[r.student_name,r.student_group,(r.score/10).toFixed(1),r.score,r.correct,r.elapsed_seconds,dateMx(r.created_at),r.attempt_id])];const url=URL.createObjectURL(new Blob(["\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;const stamp=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Mexico_City"}).format(new Date()).replace(/-/g,"").slice(2);a.download=stamp+"_7A_Context_Crossword_Calificaciones.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
