<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miss Martha — Flag Ops Teacher Dashboard</title>
<style>
body{margin:0;font-family:Inter,system-ui,Arial;background:#07111f;color:#eef6ff} .wrap{max-width:1100px;margin:auto;padding:24px} .card{background:#0d2035;border:1px solid #284a67;border-radius:20px;padding:20px} h1{margin-top:0} input,select,button{padding:12px;border-radius:10px;border:1px solid #345975;background:#0a1727;color:white;font-size:15px} button{background:#4da3ff;color:#06111c;font-weight:800;cursor:pointer} .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px} table{width:100%;border-collapse:collapse;background:#091827} th,td{padding:10px;border-bottom:1px solid #203b52;text-align:left} th{background:#102a44;position:sticky;top:0} .muted{color:#9fb2c8} .good{font-weight:800} @media(max-width:700px){table{font-size:12px}th,td{padding:7px}}
</style></head><body><div class="wrap"><div class="card">
<h1>FLAG OPS — TEACHER DASHBOARD</h1>
<div class="muted">9th & 10th MUN • September 14, 2026</div>
<div class="controls">
<input id="code" type="password" placeholder="Teacher code">
<select id="game"><option value="">All games</option><option value="260914_9th_MUN_Global_Intelligence_Flag_Ops">9th MUN</option><option value="260914_10th_MUN_Global_Intelligence_Flag_Ops">10th MUN</option></select>
<button onclick="load()">REFRESH RESULTS</button>
</div>
<div id="summary" class="muted" style="margin-bottom:12px"></div>
<div style="overflow:auto"><table><thead><tr><th>Student</th><th>Group</th><th>Grade</th><th>Score</th><th>%</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
const EDGE="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results";
async function load(){
 const code=document.getElementById('code').value.trim(); if(!code){alert('Enter teacher code');return;}
 const game=document.getElementById('game').value; const url=EDGE+(game?`?game_id=${encodeURIComponent(game)}`:'');
 const r=await fetch(url,{headers:{'x-teacher-code':code}});
 if(!r.ok){alert('Teacher code incorrect or server error.');return;}
 const data=await r.json(); const results=data.results||[];
 document.getElementById('summary').textContent=`${results.length} submissions`;
 const rows=document.getElementById('rows'); rows.innerHTML='';
 results.forEach(x=>{const tr=document.createElement('tr'); const dt=new Date(x.created_at); tr.innerHTML=`<td>${esc(x.student_name)}</td><td>${esc(x.student_group)}</td><td>${esc(x.grade)}</td><td class="good">${x.score} / ${x.max_score}</td><td>${x.percentage}%</td><td>${dt.toLocaleString()}</td>`; rows.appendChild(tr);});
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
</script></body></html>
