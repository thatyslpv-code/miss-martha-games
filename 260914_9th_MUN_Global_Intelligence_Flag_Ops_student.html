<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9th MUN Flag Ops — Student</title><style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef6ff}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#0d2035;border:1px solid #284a67;border-radius:20px;padding:20px;margin-bottom:18px}h1{margin-top:0}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #345975;font-size:16px;box-sizing:border-box}input{background:#0a1727;color:white}button{background:#4da3ff;color:#06111c;font-weight:800;cursor:pointer}.ans{background:#132d49;color:white;text-align:left}.good{background:#0f4c3d!important}.bad{background:#5b2329!important}.flag{font-size:80px;text-align:center}.hidden{display:none}.muted{color:#9fb2c8}.feedback{padding:12px;background:#081522;border-radius:10px;margin-top:10px}</style></head><body><div class="wrap"><div class="card" id="login"><h1>GLOBAL INTELLIGENCE: FLAG OPS</h1><div class="muted">9th MUN • Student Mission</div><input id="studentName" placeholder="First and last name"><input id="studentGroup" placeholder="Group, e.g. 9A"><button id="enterBtn">ENTER MISSION</button><div id="startStatus" class="muted"></div></div><div class="card hidden" id="game"><div class="muted" id="meta"></div><div class="flag" id="flag"></div><h2 id="q"></h2><div id="clue" class="feedback"></div><div id="answers"></div><div id="feedback" class="feedback">Choose one answer.</div><button id="next" class="hidden">NEXT MISSION</button></div><div class="card hidden" id="done"><h1>MISSION COMPLETE</h1><h2 id="final"></h2><div id="status">Sending your result to Miss Martha…</div></div></div><script>
const EDGE='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results';
const SOURCE='https://raw.githubusercontent.com/thatyslpv-code/miss-martha-games/main/260914_9th_MUN_Global_Intelligence_Flag_Ops.html';
const GAME_ID='260914_9th_MUN_Global_Intelligence_Flag_Ops';
let missions=[],idx=0,score=0,maxScore=0,answered=false,studentName='',studentGroup='';
const $=id=>document.getElementById(id);
$('enterBtn').addEventListener('click',begin);$('next').addEventListener('click',nextQ);
async function begin(){
 studentName=$('studentName').value.trim(); studentGroup=$('studentGroup').value.trim();
 if(!studentName||!studentGroup){alert('Please enter your name and group.');return;}
 $('startStatus').textContent='Loading mission…';
 try{
   const resp=await fetch(SOURCE,{cache:'no-store'}); if(!resp.ok) throw new Error('Could not load game data');
   const t=await resp.text(); const m=t.match(/const missions = \[(.*?)\];/s); if(!m) throw new Error('Game data not found');
   missions=Function('return ['+m[1]+']')();
   $('login').classList.add('hidden'); $('game').classList.remove('hidden'); load();
 }catch(e){$('startStatus').textContent='Could not start the mission. Please refresh and try again.'; console.error(e);}
}
function load(){answered=false;const m=missions[idx];$('meta').textContent=`Mission ${idx+1} of ${missions.length} • Score ${score}/${maxScore}`;$('flag').textContent=m.flag;$('q').textContent=m.q;$('clue').textContent=m.clue;$('answers').innerHTML='';$('feedback').textContent='Choose one answer.';$('next').classList.add('hidden');m.a.forEach((a,i)=>{const b=document.createElement('button');b.className='ans';b.textContent=`${String.fromCharCode(65+i)}. ${a}`;b.onclick=()=>pick(i,b);$('answers').appendChild(b)});}
function pick(i,b){if(answered)return;answered=true;const m=missions[idx];maxScore+=100;[...document.querySelectorAll('.ans')].forEach((x,j)=>{if(j===m.correct)x.classList.add('good')});if(i===m.correct){score+=100;$('feedback').textContent='Correct. '+m.exp}else{b.classList.add('bad');$('feedback').textContent='Not quite. '+m.exp}$('meta').textContent=`Mission ${idx+1} of ${missions.length} • Score ${score}/${maxScore}`;$('next').classList.remove('hidden');}
function nextQ(){idx++;if(idx>=missions.length)return finish();load();}
async function finish(){$('game').classList.add('hidden');$('done').classList.remove('hidden');const pct=Math.round(score/maxScore*100);$('final').textContent=`Final score: ${score}/${maxScore} (${pct}%)`;try{const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:studentName,student_group:studentGroup,game_id:GAME_ID,grade:'9th',score:score,max_score:maxScore})});if(!r.ok)throw 0;$('status').textContent='Result sent successfully. You may close this page.'}catch(e){$('status').textContent='Submission failed. Show this final score to Miss Martha.'}}
</script></body></html>
