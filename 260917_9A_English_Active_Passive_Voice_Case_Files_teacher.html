<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Switch • Teacher Dashboard</title><style>*{box-sizing:border-box}body{margin:0;color:#142e4c;background:#eff6ff;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:20px;background-image:radial-gradient(#1760ff19 1.5px,transparent 1.5px);background-size:22px 22px}button,input,select{font:inherit}button{cursor:pointer;border:2px solid #173655;border-radius:14px;padding:13px 20px;background:white;color:#142e4c;font-weight:800;box-shadow:0 4px 0 #173655}button:hover{transform:translateY(-2px)}button:disabled{cursor:default;opacity:.6;transform:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #ff9f1c;outline-offset:3px}.primary{background:#1858ed;color:white}.lime{background:#c5f64a}.small{font-size:15px;padding:9px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:auto;padding:22px}.brand{font-weight:900;letter-spacing:1px;font-size:18px}.dot{display:inline-block;background:#ff735e;border:2px solid #142e4c;border-radius:50%;width:18px;height:18px;margin-right:8px}.wrap{max-width:1080px;margin:12px auto;padding:0 24px 40px}.card{background:#fff;border:2px solid #173655;border-radius:24px;padding:30px;box-shadow:7px 8px 0 #173655;animation:enter .3s ease}h1{font-size:clamp(38px,6vw,74px);line-height:1.02;letter-spacing:-2px;margin:18px 0}h2{font-size:32px;margin:12px 0}p{line-height:1.5}.eyebrow,.badge{display:inline-block;background:#c5f64a;font-weight:900;font-size:14px;letter-spacing:1px;padding:8px 12px;border:2px solid #173655;border-radius:7px}.badge{background:#c8f9f1}.orange{background:#ffbb63}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}.blue{color:#1858ed}.folder{background:#ffd664;transform:rotate(3deg);padding:30px;border:2px solid;border-radius:12px;box-shadow:8px 8px #ff735e}.evidence{background:white;border:2px solid #173655;padding:16px;margin:12px 0;border-radius:10px}.arrow{text-align:center;font-weight:900;color:#1858ed;animation:pulse 2s infinite}.meta,.actions,.chips{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.meta{justify-content:space-between;margin:18px 0}.muted{color:#506079;font-size:16px}label{display:block;font-weight:800;margin:16px 0 7px}input,select{width:100%;padding:14px;border:2px solid #a3b7cf;border-radius:12px;background:white;color:#142e4c}.formrow{display:grid;grid-template-columns:2fr 1fr;gap:20px}.progress{height:12px;background:#d5e3f4;border-radius:20px;overflow:hidden;margin:14px 0 24px}.progress>div{height:100%;background:#1858ed;transition:width .4s}.prompt{font-size:24px;line-height:1.5;white-space:pre-line;margin:22px 0}.options{display:grid;gap:12px}.option{text-align:left;display:flex;align-items:center;gap:14px;width:100%;font-size:20px;font-weight:600;box-shadow:0 3px #173655}.letter{padding:4px 10px;background:#edf3ff;border-radius:7px;color:#142e4c}.selected{background:#d8e6ff;border-color:#1858ed}.tray{min-height:90px;padding:18px;border:2px dashed #1858ed;background:#f0f5ff;border-radius:14px;margin-bottom:16px}.chip{font-size:20px;padding:10px 14px;margin:5px;box-shadow:0 3px #173655}.feedback{padding:20px;border-radius:14px;background:#dcf8ed;border:2px solid #128065;margin:22px 0}.feedback.bad{background:#fff0d7;border-color:#cb7800}.actions{margin-top:24px}.boss{border:4px solid #ff735e;background:#fffaf0}.boss .eyebrow{background:#ff735e}.result{text-align:center;padding:24px}.percent{font-size:clamp(96px,16vw,160px);line-height:1;font-weight:900;color:#1858ed;letter-spacing:-8px}.student{font-size:32px;font-weight:900;overflow-wrap:anywhere}.score{font-size:30px;font-weight:900}.result h1{font-size:30px;letter-spacing:-1px}.result p{margin:10px 0}.note{background:#fff1b9;padding:12px;border-radius:10px;font-size:18px}.rounds{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.rounds span{height:9px;flex:1;border-radius:7px;background:#c8d8ed}.rounds span.done{background:#12bfa7}.rounds span.current{background:#ff735e}details{margin-top:20px}summary{cursor:pointer;font-weight:800}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{padding:22px 12px;text-align:left;border-bottom:2px solid #e4ecf6}th{font-size:16px;background:#eaf1ff}td{font-size:22px}td.percentcell{font-weight:900;font-size:38px;color:#1858ed}td:first-child{font-weight:800;overflow-wrap:anywhere}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:16px}.controls>div{flex:1;min-width:150px}.controls input,.controls select{font-size:18px}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:translateX(7px)}}@media(max-width:700px){.hero,.formrow{grid-template-columns:1fr}.folder{display:none}.wrap{padding:0 12px 24px}.card{padding:20px;box-shadow:4px 5px #173655}.prompt{font-size:21px}.option{font-size:18px}header{padding:15px}.student{font-size:26px}td,th{padding:16px 5px;font-size:16px}td.percentcell{font-size:27px}.time{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header><div class="brand"><span class="dot"></span>MISS MARTHA / TEACHER DESK</div><span class="badge">9A ENGLISH</span></header><main class="wrap" style="max-width:1300px"><section class="card"><span class="eyebrow">VOICE SWITCH: CASE FILES</span><h1 style="font-size:46px">Investigation results</h1><p class="muted">25 graded cases • Large scores • All attempts shown</p><form id="controls" class="controls"><div><label for="code">Teacher code</label><input type="password" id="code" required autocomplete="off"></div><div><label for="groupFilter">Group</label><select id="groupFilter"><option value="9A">9A</option><option value="">All groups</option></select></div><div><label for="sort">Sort results</label><select id="sort"><option value="recent">Most recent first</option><option value="high">Highest score first</option><option value="low">Lowest score first</option></select></div><button class="primary" id="refresh">REFRESH RESULTS</button></form><p id="status" role="status">Enter your teacher code to load results.</p><div id="tableWrap" class="hidden"><table><thead><tr><th>Student Name</th><th>Group</th><th>Score</th><th>Percentage</th><th>Date / Time</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);const EDGE='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results',GAME='260917_9A_ACTIVE_PASSIVE_CASE_FILES';let results=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('controls').onsubmit=e=>{e.preventDefault();load();};$('sort').onchange=draw;$('groupFilter').onchange=draw;
async function load(){const code=$('code').value.trim();if(!code)return;$('refresh').disabled=true;$('status').textContent='Loading results…';try{const r=await fetch(EDGE+'?game_id='+encodeURIComponent(GAME),{headers:{'x-teacher-code':code},signal:AbortSignal.timeout(15000),cache:'no-store'});if(!r.ok)throw Error(r.status===401||r.status===403?'Teacher code incorrect.':'Server unavailable. Please try again.');const data=await r.json();if(!Array.isArray(data.results))throw Error('Unexpected server response. Please try again.');results=data.results.filter(x=>!x.game_id||x.game_id===GAME);draw();}catch(e){results=[];$('rows').replaceChildren();$('tableWrap').classList.add('hidden');$('status').textContent=e.message||'Could not load results. Please try again.';}finally{$('refresh').disabled=false;}}
function draw(){const filtered=results.filter(x=>!$('groupFilter').value||x.student_group===$('groupFilter').value);filtered.sort((a,b)=>$('sort').value==='high'?Number(b.percentage)-Number(a.percentage):$('sort').value==='low'?Number(a.percentage)-Number(b.percentage):new Date(b.created_at)-new Date(a.created_at));$('status').textContent=filtered.length+' submissions • Updated '+new Date().toLocaleTimeString();$('tableWrap').classList.toggle('hidden',!filtered.length);$('rows').innerHTML=filtered.map(x=>{const d=new Date(x.created_at);return `<tr><td>${esc(x.student_name)}</td><td>${esc(x.student_group)}</td><td>${esc(x.score)} / ${esc(x.max_score)}</td><td class="percentcell">${esc(x.percentage)}%</td><td class="time">${isNaN(d.getTime())?'—':esc(d.toLocaleDateString())+'<br>'+esc(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}</td></tr>`;}).join('');if(!filtered.length)$('status').textContent='No results for this game and group yet. Press REFRESH RESULTS after students finish.';}
</script></body></html>
