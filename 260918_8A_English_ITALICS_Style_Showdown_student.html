<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italics Style Showdown</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff6a8,#d7f7ff,#ffd7ec,#e7ddff);color:#18233b}header{padding:16px;background:#fff;border-bottom:2px solid #18233b;font-weight:900}main{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#fff;border:2px solid #18233b;border-radius:24px;padding:24px;box-shadow:8px 8px 0 #bfe7ef}.hero{text-align:center}h1{font-size:clamp(46px,9vw,88px);line-height:.92}.hero h1 em{color:#705cff}.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pill,.badge{padding:7px 11px;border-radius:999px;background:#ffe15a;font-weight:900}.pill:nth-child(2){background:#c7f4ff}.pill:nth-child(3){background:#ffd0e7}.pill:nth-child(4){background:#d8ffd0}label{display:block;font-weight:800;margin-top:12px}input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:2px solid #abb8c8;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;text-align:left;margin-top:10px;padding:14px;border:2px solid #18233b;border-radius:12px;background:white;font-size:17px;font-weight:800}.primary{background:#ff4f9a;color:white;text-align:center}.progress{height:13px;background:#e7edf4;border-radius:99px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:linear-gradient(90deg,#ff4f9a,#ff9a57,#ffe15a,#bff36b,#41d9ff,#775cff)}.feedback{margin-top:18px;padding:16px;border-radius:14px;background:#eaffea}.wrong{background:#fff0f5}.score{font-size:100px;font-weight:900;color:#775cff}.evidence{background:#d7ff98;padding:14px;border-radius:12px;font-weight:900}.err{color:#b52f6d}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header>✨ ITALICS STYLE SHOWDOWN · 8A ENGLISH</header><main id="app"></main><script>const Q=[{"phase":"WARM-UP","q":"Which title should be italicized?","o":["A short story: “The Tell-Tale Heart”","A poem: “Still I Rise”","A novel: The Giver","A song: “Happy”"],"a":2,"f":"Titles of long works such as novels are italicized."},{"phase":"WARM-UP","q":"Which title should NOT be italicized?","o":["The Hunger Games","National Geographic","The New York Times","“The Road Not Taken”"],"a":3,"f":"Poems are short works and usually use quotation marks."},{"phase":"WARM-UP","q":"Which sentence uses italics correctly?","o":["I watched *Inside Out 2* last night.","I read *“The Raven”* in class.","We listened to *“Flowers”*.","She wrote an essay called *My Summer*."],"a":0,"f":"Movie titles are italicized."},{"phase":"WARM-UP","q":"Which item is usually italicized?","o":["A chapter title","A magazine title","A song title","A short story title"],"a":1,"f":"Magazine titles are italicized."},{"phase":"WARM-UP","q":"Which item usually uses quotation marks instead of italics?","o":["A movie","A book","A newspaper","A song"],"a":3,"f":"Song titles are short works."},{"phase":"TITLE TRAPS","q":"Choose the correctly formatted sentence.","o":["We read “Harry Potter and the Sorcerer’s Stone.”","We read *Harry Potter and the Sorcerer’s Stone*.","We read Harry Potter and the Sorcerer’s Stone in quotation marks and italics.","We read HARRY POTTER AND THE SORCERER’S STONE."],"a":1,"f":"Book titles are italicized."},{"phase":"TITLE TRAPS","q":"Which should be italicized?","o":["“The Lottery”","“Bohemian Rhapsody”","The Wall Street Journal","“Stopping by Woods on a Snowy Evening”"],"a":2,"f":"Newspaper titles are italicized."},{"phase":"TITLE TRAPS","q":"Which should stay in quotation marks?","o":["Frozen","Time","“The Necklace”","The Odyssey"],"a":2,"f":"Short story titles use quotation marks."},{"phase":"TITLE TRAPS","q":"Which sentence is correct?","o":["My favorite episode is *The One Where No One’s Ready*.","My favorite episode is “The One Where No One’s Ready.”","My favorite episode is The One Where No One’s Ready.","My favorite episode is **The One Where No One’s Ready**."],"a":1,"f":"TV episode titles use quotation marks."},{"phase":"TITLE TRAPS","q":"Which sentence is correct?","o":["We watched the series *Wednesday*.","We watched the series “Wednesday.”","We watched the series Wednesday with no formatting.","We watched the series **Wednesday**."],"a":0,"f":"TV series titles are italicized."},{"phase":"PURPOSE","q":"In which sentence are italics used for emphasis?","o":["I said I wanted the *blue* notebook, not the red one.","We read *The Giver*.","The ship *Titanic* sank in 1912.","The word *run* can be a noun or a verb."],"a":0,"f":"Italics can emphasize contrast."},{"phase":"PURPOSE","q":"Which sentence uses italics to refer to a word as a word?","o":["I really *love* this song.","The word *because* introduces a reason.","I watched *Coco*.","The magazine *Time* is well known."],"a":1,"f":"Words discussed as words can be italicized."},{"phase":"PURPOSE","q":"Which use of italics is BEST?","o":["I *really really really* like pizza.","That was *so* amazing!!!","I said *Thursday*, not Tuesday.","Every adjective in the paragraph is italicized."],"a":2,"f":"Italics work best for meaningful emphasis."},{"phase":"PURPOSE","q":"Why is overusing italics a problem?","o":["It makes every sentence passive.","It can make emphasis less effective.","It changes verb tense.","It creates fragments."],"a":1,"f":"Too much emphasis weakens emphasis."},{"phase":"PURPOSE","q":"Which sentence uses italics appropriately?","o":["Please bring your *notebook* because notebooks are useful.","I wanted the *small* box, not the large one.","The *dog* ran across the *yard*.","She *quickly* finished the *assignment*."],"a":1,"f":"The italics show contrast."},{"phase":"SPECIAL CASES","q":"Which name is commonly italicized in formal writing?","o":["A school","A ship","A city","A country"],"a":1,"f":"Names of ships are traditionally italicized."},{"phase":"SPECIAL CASES","q":"Which sentence is correctly formatted?","o":["The *Titanic* was a famous ship.","The “Titanic” was a famous ship.","The Titanic was a famous ship with quotation marks.","The TITANIC was a famous ship."],"a":0,"f":"Ship names are italicized."},{"phase":"SPECIAL CASES","q":"Which correctly formats a scientific name?","o":["Homo sapiens","*Homo sapiens*","“Homo sapiens”","HOMO SAPIENS"],"a":1,"f":"Genus and species are italicized."},{"phase":"SPECIAL CASES","q":"Which sentence does NOT need italics for the common English word?","o":["I ordered a *croissant*.","I read *The Hobbit*.","The word *however* can signal contrast.","The ship *Endeavour* sailed south."],"a":0,"f":"Commonly adopted English words usually do not need italics."},{"phase":"SPECIAL CASES","q":"Which statement is best about unfamiliar foreign words?","o":["They may be italicized, especially on first use.","They must always be in quotation marks.","They must be bold.","They must be ALL CAPS."],"a":0,"f":"Style guides often italicize unfamiliar foreign expressions."},{"phase":"FINAL BOSS","q":"Which sentence is fully correct?","o":["We watched “Avatar” and discussed *The Lottery*.","We watched *Avatar* and discussed “The Lottery.”","We watched *“Avatar”* and discussed The Lottery.","We watched Avatar and discussed The Lottery."],"a":1,"f":"Movies are italicized; short stories use quotation marks."},{"phase":"FINAL BOSS","q":"Which sentence is fully correct?","o":["I read *Time* magazine and the article *“Person of the Year.”*","I read “Time” magazine and the article *Person of the Year*.","I read *Time* magazine and the article “Person of the Year.”","I read Time magazine and the article Person of the Year."],"a":2,"f":"Magazine titles are italicized; article titles use quotation marks."},{"phase":"FINAL BOSS","q":"Which sentence uses italics for the clearest reason?","o":["I *absolutely totally completely* agree.","I said *fifteen*, not fifty.","The *students* opened their *books*.","We *walked* to the *library*."],"a":1,"f":"Italics clearly mark contrast."},{"phase":"FINAL BOSS","q":"Which pair is formatted correctly?","o":["Book = quotation marks; chapter = italics","Movie = quotation marks; song = italics","Novel = italics; poem = quotation marks","Newspaper = quotation marks; article = italics"],"a":2,"f":"Long works are italicized; short works use quotation marks."},{"phase":"FINAL BOSS","q":"FINAL ROUND: Which sentence follows all the rules?","o":["In *The Giver*, the word *release* has a special meaning.","In “The Giver,” the word release has a special meaning.","In The Giver, the word “release” has a special meaning.","In *“The Giver”*, the word **release** has a special meaning."],"a":0,"f":"The novel title and the word being discussed are italicized."}],EDGE="https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/game-results",GAME="260918_8A_ITALICS_STYLE_SHOWDOWN",DOMAIN="@colegiointernacional.edu.mx";let s=null,lock=false;const app=document.getElementById("app"),esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*(.*?)\*/g,"<em>$1</em>");function land(){app.innerHTML=`<section class="card hero"><span class="badge">FRIDAY REVIEW · 260918</span><h1>ITALICS<br><em>STYLE SHOWDOWN</em></h1><p>25 rounds · Titles · Emphasis · Special cases</p><div class="pills"><span class="pill">Long Works</span><span class="pill">Short Works</span><span class="pill">Emphasis</span><span class="pill">Special Cases</span></div><form id="f"><div class="grid"><div><label>Full name</label><input id="n" required></div><div><label>School email</label><input id="m" type="email" required></div></div><label>Group</label><input value="8A" readonly><p class="err" id="er"></p><button class="primary">START →</button></form></section>`;document.getElementById("f").onsubmit=e=>{e.preventDefault();let n=document.getElementById("n").value.trim(),m=document.getElementById("m").value.trim().toLowerCase();if(n.length<3)return document.getElementById("er").textContent="Enter your full name.";if(!m.endsWith(DOMAIN))return document.getElementById("er").textContent="Use your school email.";s={name:n,i:0,a:[]};render()}}function render(){lock=false;let q=Q[s.i];app.innerHTML=`<section class="card"><span class="badge">${q.phase}</span><div class="progress"><div style="width:${Math.round(s.i/Q.length*100)}%"></div></div><h2>${esc(q.q)}</h2>${q.o.map((x,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(65+j)}. ${esc(x)}</button>`).join("")}<div id="feed"></div></section>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.j))}function pick(j){if(lock)return;lock=true;let q=Q[s.i],ok=j===q.a;s.a.push(ok);document.querySelectorAll(".opt").forEach(b=>b.disabled=true);document.getElementById("feed").innerHTML=`<div class="feedback ${ok?"":"wrong"}"><b>${ok?"✅ STYLE POINT":"⚠️ FORMAT TRAP"}</b><p>${esc(q.f)}</p>${ok?"":`<p><b>Correct:</b> ${esc(q.o[q.a])}</p>`}<button id="nx">${s.i===24?"SEE MY SCORE →":"NEXT →"}</button></div>`;document.getElementById("nx").onclick=()=>{s.i++;s.i>=25?finish():render()}}function finish(){let sc=s.a.filter(Boolean).length,p=sc*4;app.innerHTML=`<section class="card hero"><h1>FINAL SCORE</h1><h2>${s.name}</h2><div class="score">${p}%</div><h2>${sc}/25</h2><div class="evidence">Take a screenshot of this screen for your class evidence.</div><p id="sv">Saving score…</p></section>`;fetch(EDGE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student_name:s.name,student_group:"8A",game_id:GAME,grade:"8A",score:sc,max_score:25,percentage:p,completed:true})}).then(r=>document.getElementById("sv").textContent=r.ok?"Score saved to Miss Martha's dashboard.":"Screenshot still works.").catch(()=>document.getElementById("sv").textContent="Screenshot still works.")}land();</script></body></html>
