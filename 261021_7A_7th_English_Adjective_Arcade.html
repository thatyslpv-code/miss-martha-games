.panel{background:white;border:3px solid var(--ink);border-radius:23px;box-shadow:7px 7px 0 var(--ink);padding:27px}.mascot-wrap{background:var(--orange);border:3px solid var(--ink);border-radius:36px;position:relative;padding:24px;text-align:center;transform:rotate(2deg);box-shadow:9px 9px 0 var(--ink)}.mascot-wrap .tag{background:var(--yellow);border:2px solid var(--ink);border-radius:15px;padding:12px;font-weight:bold;font-size:18px;display:inline-block}.robot{width:100%;max-width:320px;height:255px;overflow:visible}
.primary,.secondary{border:3px solid var(--ink);border-radius:13px;padding:13px 23px;font-weight:900;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}.primary{background:var(--yellow)}.secondary{background:white}.primary:hover,.secondary:hover{transform:translate(-1px,-2px);box-shadow:5px 6px 0 var(--ink)}.primary:active,.secondary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.primary:disabled{opacity:.5;box-shadow:none;transform:none}
.start-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.field{flex:1;min-width:200px}label{font-size:13px;font-weight:bold;display:block;margin-bottom:7px}input{width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;background:#fffcf4}.tiny{font-size:12px;line-height:1.5;opacity:.85}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.level{border:2px solid var(--ink);border-radius:17px;padding:20px;background:var(--yellow)}.level:nth-child(2){background:var(--pink)}.level:nth-child(3){background:#ffb572}.level b{font-size:18px}.level p{margin-bottom:0;line-height:1.5;font-size:14px}
.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.stats{display:flex;gap:10px;flex-wrap:wrap}.progress{height:16px;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:white;margin-bottom:26px}.progress div{height:100%;background:var(--red);transition:width .4s}
h2{font-size:clamp(27px,4vw,39px);line-height:1.15;margin:10px 0 12px;letter-spacing:-1px}.instruction{font-size:16px;line-height:1.6;color:#4d4855}.round-tag{display:inline-block;background:var(--yellow);padding:6px 12px;font-size:12px;letter-spacing:1px;font-weight:900;border-radius:9px;border:2px solid var(--ink)}
.wordbank{min-height:88px;display:flex;gap:12px;flex-wrap:wrap;padding:17px;background:#fff1bb;border:2px dashed #b87c28;border-radius:15px;margin:22px 0}.word{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:white;border:2px solid var(--ink);padding:12px 17px;border-radius:10px;box-shadow:3px 3px 0 var(--ink);font-size:19px;font-weight:bold;user-select:none}.word[draggable=true]{cursor:grab}.word.selected{background:var(--yellow);outline:3px solid var(--red);outline-offset:3px}.word .grip{opacity:.4;font-size:15px}.word.correct{background:#d8f4c3}.word.wrong{background:#ffccca}.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.target{min-height:114px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:2px dashed #a58b6f;border-radius:15px;background:#fffdf6;padding:13px;cursor:pointer}.target .target-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px}.target .placeholder{color:#8a7462;font-size:13px}.target.over{border:3px solid var(--red);background:#ffefd6}.target.has-word{border-style:solid}.target.correct{border-color:#247347;background:#e7f7dc}.target.wrong{border-color:#d12929;background:#ffe4df}.target .word{font-size:17px;padding:8px 12px;max-width:100%}
.sentence{padding:20px;background:#fff7d6;border:2px solid var(--ink);border-radius:14px;font-size:clamp(19px,3vw,26px);line-height:1.65;margin:20px 0}.slots{display:flex;flex-wrap:wrap;gap:11px}.slots .target{min-width:100px;flex:1;min-height:87px}.feedback{margin-top:20px;padding:16px;border-radius:12px;background:#f3f0e9;line-height:1.55;min-height:58px}.feedback.good{background:#e5f6d8;border:2px solid #32794a}.feedback.retry{background:#ffeadf;border:2px solid #e1552f}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:21px}.actions .spacer{flex:1}.textbtn{background:none;border:0;text-decoration:underline;font-size:13px;padding:8px}.hint{border:2px solid #efbd23;background:#fff2b2;margin-top:15px;padding:13px;border-radius:12px;line-height:1.5}
.result{text-align:center;max-width:800px;margin:30px auto}.score{font-size:80px;font-weight:900;letter-spacing:-4px;margin:12px 0;color:#d62f36}.medal{font-size:66px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.result-grid div{background:#fff0b7;border:2px solid var(--ink);border-radius:12px;padding:15px}.result-grid b{display:block;font-size:25px}.confetti{position:fixed;top:-20px;width:12px;height:20px;z-index:20;pointer-events:none;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),100vh) rotate(650deg);opacity:0}}
details{margin-top:25px;padding:16px;border:2px solid var(--ink);background:white;border-radius:14px}summary{cursor:pointer;font-weight:bold}.review-row{text-align:left;border-bottom:1px solid #ddd;padding:12px 0;font-size:14px;line-height:1.6}footer{max-width:1100px;margin:auto;padding:15px 24px 30px;font-size:12px;color:#655c5d}.hidden{display:none!important}
@media(max-width:700px){main{padding:20px 16px 40px}.hero{grid-template-columns:1fr;gap:22px}h1{font-size:60px}.mascot-wrap{max-width:380px;margin:auto;width:100%}.robot{height:180px}.cards{grid-template-columns:1fr}.panel{padding:20px}.targets{grid-template-columns:repeat(2,1fr)}header{padding:12px 16px}header strong{font-size:14px}.topline{align-items:flex-start}.stats .pill{padding:6px 9px}.word{font-size:17px;padding:10px 12px}.result-grid{grid-template-columns:1fr}.score{font-size:68px}.slots .target{min-width:85px}.start-row .primary{width:100%}}

@media print{body{background:white}header,footer,.actions,.textbtn,details,.confetti{display:none!important}.panel{box-shadow:none}.result{margin:0;max-width:none}.result-grid{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><header><strong>✦ MISS MARTHA / PLAY & LEARN</strong><span class="pill">7A · ENGLISH</span></header><main id="app"></main><footer>October 21, 2026 · Adjective Arcade · Internet required to save results · Drag, or tap a word and then a destination.</footer>
<script> 'use strict';
const API='https://ioinjygibdzkoonuvknd.supabase.co/functions/v1/adjective-arcade';
const KEY='sb_publishable_zgaYDjfwjpkOoZD8-HwaSQ_j6jNpnWE',STORE='mm_adjective_arcade_261021';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let state=null,attempt=null,rounds=[],extras=[],selected=null,dragging=null,assignment={},tries=0,solved=false,hintOpen=false,busy=false,draft='',resume=null;
try{resume=JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{}
async function request(b){if(b.action==='start'){if(resume){b.attempt_id=resume.id;b.student_token=resume.token}}else{b.attempt_id=attempt.id;b.student_token=resume.token}const res=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b),signal:AbortSignal.timeout(25000)});const d=await res.json();if(!res.ok)throw Error(d.error||'Please retry.');return d}
function persist(){try{sessionStorage.setItem(STORE,JSON.stringify(resume))}catch{}}
const robot=`<svg class="robot" viewBox="0 0 320 260" aria-label="A smiling yellow adjective robot" role="img"><path d="M160 50V20" stroke="#27252e" stroke-width="8"/><circle cx="160" cy="16" r="12" fill="#fa4444" stroke="#27252e" stroke-width="5"/><rect x="55" y="48" width="210" height="150" rx="40" fill="#ffdc35" stroke="#27252e" stroke-width="7"/><rect x="32" y="100" width="23" height="52" rx="8" fill="#fa4444" stroke="#27252e" stroke-width="5"/><rect x="265" y="100" width="23" height="52" rx="8" fill="#fa4444" stroke="#27252e" stroke-width="5"/><rect x="80" y="75" width="160" height="64" rx="22" fill="#fff9e9" stroke="#27252e" stroke-width="5"/><circle cx="119" cy="107" r="12" fill="#27252e"/><circle cx="201" cy="107" r="12" fill="#27252e"/><path d="M130 157Q160 187 190 157" stroke="#27252e" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M106 202v30m108-30v30" stroke="#27252e" stroke-width="9"/><ellipse cx="103" cy="238" rx="30" ry="12" fill="#fa4444" stroke="#27252e" stroke-width="5"/><ellipse cx="217" cy="238" rx="30" ry="12" fill="#fa4444" stroke="#27252e" stroke-width="5"/><path d="m20 45 5 10 12 2-9 9 2 11-10-5-10 5 2-11-9-9 12-2Z" fill="#fff9e9"/><path d="m293 180 5 10 12 2-9 9 2 11-10-5-10 5 2-11-9-9 12-2Z" fill="#fff9e9"/></svg>`;
function home(){app.innerHTML=`<section class="hero"><div><span class="badge">GRADE 7 / EXTENDED CHALLENGE</span><h1>Adjective<br><span>Arcade!</span></h1><p class="intro">Sort the details, build sentences, crack the comma code, and put your own ideas into words.</p><div class="pill" style="display:inline-block">40 missions + 5 writing challenges · About 40–50 minutes</div></div><div class="mascot-wrap">${robot}<div class="tag">Small robot. HUGE word power.</div></div></section><section class="panel"><h2>Your classroom mission starts here.</h2><p>Work individually. Your answers, explanations, and progress are saved for Miss Martha.</p><form id="registration"><div class="start-row"><div class="field"><label for="player">Full name</label><input id="player" required minlength="3" maxlength="100" autocomplete="name" placeholder="First and last name" value="${esc(resume?.name||'')}"></div><div class="field"><label for="email">School email</label><input id="email" required type="email" autocomplete="email" placeholder="name@colegiointernacional.edu.mx" value="${esc(resume?.email||'')}"></div></div><div class="start-row" style="margin-top:16px"><div class="field"><label for="group">Grade and group</label><input id="group" value="Grade 7 · 7A" readonly></div><button class="primary" id="start" type="submit">${resume?'START / RESUME →':"LET'S PLAY →"}</button></div><p id="registerStatus" role="status" class="tiny"></p></form><p class="tiny">Your school email is recorded as entered. No verification email or code is required. Internet is required to save your work.</p><p class="tiny">Drag and drop, or tap a tile and then its destination. Keyboard: select a tile with Enter and activate a destination. Write a short explanation for each answer.</p><p><b>Finish all 40 missions and all 5 writing tasks. Then submit your final screenshot to Algebraix with your name, school email, group, and grade visible.</b></p></section><section class="cards"><div class="level"><b>01 / SORT STATION</b><p>12 missions with three adjectives each.</p></div><div class="level"><b>02 / SENTENCE FACTORY</b><p>12 sentence-building challenges.</p></div><div class="level"><b>03 / COMMA + BOSS</b><p>12 comma challenges, 4 final missions, and 5 writing tasks.</p></div></section><details><summary>How scoring works</summary><p>Each mission earns 2 points on your first check, or 1 point after a retry. Maximum: 80 points, converted to a grade out of 10. The server checks your answers and calculates your grade.</p><p>Your five writing tasks are saved for teacher review and do not change the automatic grade. There is no countdown. Think, explain, and revise!</p></details>`;
document.getElementById('registration').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('player').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),status=document.getElementById('registerStatus');if(!/^[^@\s]+@colegiointernacional\.edu\.mx$/.test(email)){status.textContent='Use your @colegiointernacional.edu.mx school email.';return}document.getElementById('start').disabled=true;status.textContent='Opening your saved classroom attempt…';try{const d=await request({action:'start',name,email,group:'7A'});attempt=d.attempt;rounds=d.game.rounds;extras=d.game.extras;resume={id:attempt.id,token:d.student_token,name:attempt.student_name,email:attempt.student_email};persist();sync();if(attempt.completed)result();else if(state.i>=rounds.length)writing();else openRound()}catch(e){status.textContent=e.message}finally{const b=document.getElementById('start');if(b)b.disabled=false}}}
function sync(){const incomplete=attempt.tasks.findIndex(t=>!t.correct);state={name:attempt.student_name,i:incomplete<0?attempt.tasks.length:incomplete,points:attempt.score,first:attempt.tasks.filter(t=>t.correct&&t.attempts===1).length,records:attempt.tasks};}
function openRound(){assignment={};draft='';tries=attempt.tasks[state.i]?.attempts||0;solved=false;hintOpen=false;selected=null;dragging=null;render()}
function getTiles(r){return r.type==='sort'?r.items.map((v,i)=>({id:String(i),text:v.word})):r.type==='build'?r.words.map((v,i)=>({id:String(i),text:v})):r.type==='choice'?r.options.map((v,i)=>({id:String(i),text:v})):[{id:'comma',text:'ADD A COMMA  ,'}, {id:'none',text:'NO COMMA'}]}
function wordButton(t){return `<button class="word" draggable="${!solved}" data-word="${esc(t.id)}" aria-pressed="${selected===t.id}" ${solved?'disabled':''}><span class="grip" aria-hidden="true">⠿</span>${esc(t.text)}</button>`}
function target(key,label,tiles){const id=assignment[key];const tile=tiles.find(t=>t.id===id);return `<div class="target ${tile?'has-word':''}" tabindex="${solved?'-1':'0'}" role="button" aria-label="${esc(label)}${tile?': '+esc(tile.text):': empty'}" data-target="${esc(key)}"><span class="target-label">${esc(label)}</span>${tile?wordButton(tile):'<span class="placeholder">Drop or tap here</span>'}</div>`}
function render(){const r=rounds[state.i],tiles=getTiles(r);const zone=r.type==='sort'?1:r.type==='build'?2:r.type==='comma'?3:4;
app.innerHTML=`<div class="topline"><button class="textbtn" id="quit">← Start over</button><div class="stats"><span class="pill">MISSION ${state.i+1} / 40</span><span class="pill">★ ${state.points} / 80</span></div></div><div class="progress" role="progressbar" aria-label="Completed missions" aria-valuemin="0" aria-valuemax="40" aria-valuenow="${state.i}"><div style="width:${state.i/40*100}%"></div></div><section class="panel"><span class="round-tag">ZONE 0${zone} / ${r.type==='sort'?'SORT STATION':r.type==='build'?'SENTENCE FACTORY':r.type==='comma'?'COMMA CRACKER':'FINAL BOSS'}</span><h2>${r.type==='sort'?'Sort the details.':r.type==='build'?'Build a brilliant sentence.':r.type==='comma'?'Crack the comma code.':'Beat the final boss.'}</h2><p class="instruction">${r.type==='sort'?'Move each adjective into the matching category.':r.type==='build'?'Arrange every word tile in the correct order, from left to right.':r.type==='comma'?'Do these two adjectives need a comma between them? Move your choice into the decision box.':'Read the sentence and move the correct answer into the decision box.'}</p>${(r.type==='comma'||r.type==='choice')?'<div class="sentence">'+esc(r.phrase)+'</div>':''}<div class="wordbank" aria-label="Available words" data-bank="true">${shuffle(tiles.filter(t=>!Object.values(assignment).includes(t.id))).map(wordButton).join('')||'<span class="tiny">All tiles placed. Ready to check!</span>'}</div>${r.type==='sort'?'<div class="targets">'+[...new Set(r.categories)].map(cat=>target(cat,cat,tiles)).join('')+'</div>':r.type==='build'?'<div class="slots">'+r.words.map((_,i)=>target(String(i),String(i+1),tiles)).join('')+'</div>':target('decision','Your decision',tiles)}<p class="tiny">Tip: to move a tile, select it and choose a new destination. Tap the word bank to return it.</p><label for="explanation" style="margin-top:20px">Explain your answer in at least six words</label><textarea id="explanation" maxlength="1200" rows="3" placeholder="Name the category, adjective position, or comma rule.">${esc(draft)}</textarea><div id="feedback" class="feedback" role="status" aria-live="polite">Make your move, word wizard.</div><div id="hint" class="hint hidden"></div><div class="actions"><button class="secondary" id="hintbtn">💡 Hint</button><button class="textbtn" id="clear">Reset tiles</button><span class="spacer"></span><button class="primary" id="check">CHECK MY ANSWER ✓</button><button class="primary hidden" id="next">${state.i===39?'WRITING WORKSHOP →':'NEXT MISSION →'}</button></div></section>`;
wire();document.getElementById('explanation').oninput=e=>draft=e.target.value;if(hintOpen)showHint();document.getElementById('quit').onclick=()=>{if(confirm('Return to registration? Your saved work will remain available when you resume.'))home()};}
function wire(){document.querySelectorAll('[data-word]').forEach(el=>{const id=el.dataset.word;el.onclick=e=>{e.stopPropagation();if(solved||busy)return;const parent=el.closest('[data-target]');if(parent&&selected!==null&&selected!==id){place(selected,parent.dataset.target);return}selected=id;document.querySelectorAll('[data-word]').forEach(n=>{n.classList.toggle('selected',n.dataset.word===id);n.setAttribute('aria-pressed',String(n.dataset.word===id))});document.getElementById('feedback').textContent='Selected: '+getTiles(rounds[state.i]).find(t=>t.id===id).text+'. Now choose a destination.'};el.ondragstart=e=>{if(solved){e.preventDefault();return}dragging=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move'};el.ondragend=()=>{dragging=null;document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))}});
document.querySelectorAll('[data-target]').forEach(el=>{el.onclick=()=>{if(selected!==null&&!busy)place(selected,el.dataset.target)};el.onkeydown=e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};el.ondragover=e=>{if(solved||busy)return;e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();if(!solved&&!busy)place(e.dataTransfer.getData('text/plain'),el.dataset.target)}});
const bank=document.querySelector('[data-bank]');bank.onclick=()=>{if(selected!==null&&!solved&&!busy){for(const k in assignment)if(assignment[k]===selected)delete assignment[k];selected=null;render()}};bank.ondragover=e=>{if(!solved&&!busy)e.preventDefault()};bank.ondrop=e=>{e.preventDefault();if(solved||busy)return;const id=e.dataTransfer.getData('text/plain');for(const k in assignment)if(assignment[k]===id)delete assignment[k];selected=null;render()};
document.getElementById('check').onclick=check;document.getElementById('clear').onclick=()=>{if(!solved&&!busy){assignment={};selected=null;render()}};document.getElementById('hintbtn').onclick=()=>{hintOpen=!hintOpen;showHint()};document.getElementById('next').onclick=()=>{if(state.i>=rounds.length)writing();else openRound()}}
function place(id,key){if(solved||busy||!getTiles(rounds[state.i]).some(t=>t.id===id))return;let oldKey=Object.keys(assignment).find(k=>assignment[k]===id),displaced=assignment[key];if(oldKey!==undefined)delete assignment[oldKey];assignment[key]=id;if(displaced!==undefined&&displaced!==id&&oldKey!==undefined)assignment[oldKey]=displaced;selected=null;render()}
function showHint(){const r=rounds[state.i],el=document.getElementById('hint');el.classList.toggle('hidden',!hintOpen);el.textContent=r.type==='sort'?'Ask: does the word tell you a quality, size, age, shape, color, origin, or material? Example: wooden tells you material.':r.type==='build'?'Look for a complete phrase or sentence. Adjectives can go before nouns or after linking verbs. Use capital letters and punctuation as clues.':'Try inserting AND and reversing the two adjectives. If both work naturally with the intended meaning, a comma often fits. If the descriptions build a unit, use no comma.'}
function burst(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<n;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=['#ffdc35','#fa4444','#ff9737','#ffbcd6'][i%4];d.style.setProperty('--dx',(Math.random()-.5)*240+'px');d.style.animationDelay=Math.random()*.3+'s';document.body.append(d);setTimeout(()=>d.remove(),2100)}}

async function check(){if(solved||busy)return;const r=rounds[state.i],needed=r.type==='sort'?r.items.length:r.type==='build'?r.words.length:1,fb=document.getElementById('feedback');if(Object.keys(assignment).length!==needed){fb.className='feedback retry';fb.textContent='Place every tile before checking. This does not count as a retry.';return}draft=document.getElementById('explanation').value;if(draft.trim().split(/\s+/).filter(Boolean).length<6){fb.className='feedback retry';fb.textContent='Explain your answer in at least six words before checking.';return}busy=true;document.getElementById('check').disabled=true;fb.textContent='Checking and saving your answer…';try{const response=r.type==='choice'?Number(assignment.decision):r.type==='comma'?assignment.decision:assignment;const d=await request({action:'answer',index:state.i,response,explanation:draft});attempt=d.attempt;const justAnswered=state.i;sync();solved=d.correct;tries=attempt.tasks[justAnswered].attempts;fb.className='feedback '+(solved?'good':'retry');fb.innerHTML='<b>'+ (solved?'Saved! +'+attempt.tasks[justAnswered].points+' point(s)':'Keep trying!')+'</b><br>'+esc(d.feedback);if(solved){document.querySelectorAll('[data-word]').forEach(e=>{e.disabled=true;e.draggable=false});document.getElementById('explanation').disabled=true;document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.querySelectorAll('.stats .pill')[1].textContent='★ '+state.points+' / 80';burst(12);document.getElementById('next').focus()}}catch(e){fb.className='feedback retry';fb.textContent=e.message+' Your tiles and explanation are still here. Retry.'}finally{busy=false;const b=document.getElementById('check');if(b)b.disabled=solved}}
async function writing(){const index=extras.findIndex((_,i)=>!attempt.extras[i]);if(index<0){await finish();return}const task=extras[index];app.innerHTML=`<div class="topline"><span class="pill">40 / 40 MISSIONS SAVED</span><span class="pill">★ ${attempt.score} / 80</span></div><section class="panel"><span class="round-tag">WRITING WORKSHOP / ${index+1} OF 5</span><h2>Your ideas. Your adjectives.</h2><p class="instruction">${esc(task.prompt)}</p><div class="hint">${esc(task.focus)}</div><label for="writingText" style="margin-top:20px">Write at least 20 words in your own sentences.</label><textarea id="writingText" rows="8" maxlength="2500" placeholder="Plan your ideas, then write complete sentences."></textarea><p id="wordCount" class="tiny">0 / 20 words minimum</p><p class="tiny">Saved for Miss Martha to review. This writing is required to finish, but it does not change your automatic grade.</p><div id="writingStatus" role="status" class="feedback">Write your response, then save and continue.</div><div class="actions"><button class="primary" id="saveWriting">SAVE & CONTINUE →</button></div></section>`;document.getElementById('writingText').oninput=e=>document.getElementById('wordCount').textContent=e.target.value.trim().split(/\s+/).filter(Boolean).length+' / 20 words minimum';document.getElementById('saveWriting').onclick=async()=>{const b=document.getElementById('saveWriting'),s=document.getElementById('writingStatus');b.disabled=true;try{const d=await request({action:'writing',index,writing:document.getElementById('writingText').value});attempt=d.attempt;await writing()}catch(e){s.textContent=e.message}finally{if(b.isConnected)b.disabled=false}}}
async function finish(){app.innerHTML='<section class="panel"><h2>Saving your final result…</h2><p id="finishStatus" role="status">Please keep this page open.</p><button class="primary hidden" id="retryFinish">RETRY SAVING</button></section>';try{const d=await request({action:'finish'});attempt=d.attempt;sync();result()}catch(e){document.getElementById('finishStatus').textContent=e.message+' Your result is not marked complete yet.';document.getElementById('retryFinish').classList.remove('hidden');document.getElementById('retryFinish').onclick=finish}}
function result(){const elapsed=Math.max(1,Math.round((new Date(attempt.completed_at)-new Date(attempt.created_at))/60000));app.innerHTML=`<section class="panel result"><div class="medal" aria-hidden="true">🏆</div><span class="round-tag">RESULT SAVED FOR MISS MARTHA</span><h2>Adjective power: unlocked!</h2><p style="font-size:24px;font-weight:bold">${esc(attempt.student_name)}</p><p><b>Grade 7 · ${esc(attempt.student_group)}</b><br>${esc(attempt.student_email)}</p><div class="score">${attempt.grade.toFixed(2)}<span style="font-size:28px;letter-spacing:0"> / 10</span></div><div class="result-grid"><div><b>${attempt.score} / 80</b>Points earned</div><div><b>40 / 40</b>Missions completed</div><div><b>5 / 5</b>Writing tasks saved</div></div><div class="hint" style="font-size:20px"><b>Submit your screenshot to Algebraix.</b><p>Make sure your full name, school email, group, and grade are clearly visible.</p></div><p class="tiny">Receipt: ${esc(attempt.id)}<br>Completed: ${esc(new Date(attempt.completed_at).toLocaleString('en-GB',{timeZone:'America/Mexico_City'}))} · Mexico City<br>Elapsed session time: ${elapsed} minute(s), including breaks.<br>Your writing and explanations are available for teacher review.</p><div class="actions" style="justify-content:center"><button class="primary" id="print">PRINT / SAVE RESULT</button><button class="secondary" id="download">DOWNLOAD RESULT</button></div></section>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('download').onclick=()=>{const text=['ADJECTIVE ARCADE | GRADE 7',attempt.student_name,attempt.student_email,'Group: '+attempt.student_group,'Grade: '+attempt.grade.toFixed(2)+'/10','Points: '+attempt.score+'/80','40 missions and 5 writing tasks completed','Saved receipt: '+attempt.id,'Submit your screenshot to Algebraix.'].join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='261021_7A_7th_English_Adjective_Arcade_Result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};burst(40)}
home();
</script></body></html>
